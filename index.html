<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>NGCC PKC Round 1 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE8; --line:#D3DCD9; --line-soft:#E3E9E7;
  --ink:#14201D; --ink-2:#3E4E4A; --muted:#66756F;
  --accent:#0E5F73; --accent-soft:#DCEBEF;
  --pend:#A8570A; --pend-soft:#FBEBD6; --ok:#2C7A4B; --ok-soft:#DDF0E3; --none:#7A8783; --none-soft:#E6EBE9;
  --crit:#B3261E; --crit-soft:#F9E1DE; --dom:#6A4FA3; --dom-soft:#ECE6F6; --patch:#1F6FB2; --patch-soft:#DDEBF8;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 8px 24px rgba(20,32,29,.08);
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#0E1514; --surface:#16201E; --sunk:#1C2826; --line:#2B3936; --line-soft:#223030;
  --ink:#E4ECE9; --ink-2:#B9C6C2; --muted:#8C9B96; --accent:#62B8CB; --accent-soft:#17343B;
  --pend:#F0A857; --pend-soft:#3A2A16; --ok:#6CC58E; --ok-soft:#18321F; --none:#8C9B96; --none-soft:#222D2B;
  --crit:#FF8A80; --crit-soft:#3A1B19; --dom:#B9A2EC; --dom-soft:#2A2340; --patch:#79B4EA; --patch-soft:#16293B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0E1514; --surface:#16201E; --sunk:#1C2826; --line:#2B3936; --line-soft:#223030;
  --ink:#E4ECE9; --ink-2:#B9C6C2; --muted:#8C9B96; --accent:#62B8CB; --accent-soft:#17343B;
  --pend:#F0A857; --pend-soft:#3A2A16; --ok:#6CC58E; --ok-soft:#18321F; --none:#8C9B96; --none-soft:#222D2B;
  --crit:#FF8A80; --crit-soft:#3A1B19; --dom:#B9A2EC; --dom-soft:#2A2340; --patch:#79B4EA; --patch-soft:#16293B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}
@media (max-width:560px){.wrap{padding-inline:16px}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font:700 clamp(22px,3.2vw,30px)/1.2 var(--serif);margin:0;text-wrap:balance}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:720px){.meta{align-items:flex-start}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.lang button{border:0;background:transparent;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.trk{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);font-size:12.5px}
.trk a,.trk span{padding:4px 12px;color:var(--ink-2);white-space:nowrap}
.trk a:hover{text-decoration:none;color:var(--accent)}
.trk [aria-current]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.trk a+span,.trk span+a{border-left:1px solid var(--line)}
.ty{display:inline-block;font:600 11px/1 var(--sans);padding:3px 6px;border-radius:4px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.ty-sig{border-color:var(--patch);color:var(--patch)}.ty-kem{border-color:var(--dom);color:var(--dom)}.ty-kex{border-color:var(--ok);color:var(--ok)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.tabs{display:flex;gap:2px;margin:18px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5}
.tabs button{border:0;background:none;padding:10px 14px 9px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button .c{font:500 11px var(--mono);color:var(--muted);margin-left:5px}
.note-bar{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink-2);margin-bottom:18px;max-width:none}
.note-bar b{color:var(--ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line-soft)}
h2{font:600 15px/1.3 var(--sans);margin:0;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 12px var(--sans);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px}

/* overview */
.lede{font-size:15px;line-height:1.75;color:var(--ink-2);max-width:72ch;margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 20px}
.kpi{background:var(--surface);padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;text-align:left;cursor:default}
button.kpi{cursor:pointer} button.kpi:hover{background:var(--sunk)}
.kpi .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font:600 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dist{padding:16px}
.dist-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.dist-bar button{border:0;padding:0;cursor:pointer;min-width:3px;display:flex;align-items:center;justify-content:center;font:600 11.5px var(--mono);color:var(--surface)}
.dist-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px}
.dist-leg button{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.upd{list-style:none;margin:0;padding:4px 0}
.upd li{padding:10px 16px;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;cursor:pointer}
.upd li:hover{background:var(--sunk)} .upd li:last-child{border-bottom:0}
.upd .d{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.upd .t{font-size:13px} .upd .t b{font-weight:600}
.links{list-style:none;margin:0;padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}

/* candidates */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--accent)}
.seg .c{font:500 11px var(--mono);color:var(--muted)}
input[type=search],select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
input[type=search]{width:190px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11.5px/1.2 var(--sans);color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--sunk)} tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.alg{font-weight:600;white-space:nowrap}
.alg .sub{display:block;font-weight:400;font-size:11.5px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap}
.pill.pend{background:var(--pend-soft);color:var(--pend)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.none{background:var(--none-soft);color:var(--none)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pend{background:var(--pend)} .dot.ok{background:var(--ok)} .dot.none{background:var(--none)}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap}
.lv b{font:700 11px/1 var(--mono);padding:2px 4px;border-radius:3px;color:var(--surface)}
.lv-A{background:var(--crit-soft);color:var(--crit)}.lv-A b{background:var(--crit)}
.lv-B{background:var(--pend-soft);color:var(--pend)}.lv-B b{background:var(--pend)}
.lv-C{background:var(--dom-soft);color:var(--dom)}.lv-C b{background:var(--dom)}
.lv-P{background:var(--patch-soft);color:var(--patch)}.lv-P b{background:var(--patch)}
.lv-I1{background:var(--crit-soft);color:var(--crit)}.lv-I1 b{background:var(--crit)}
.lv-I2{background:var(--pend-soft);color:var(--pend)}.lv-I2 b{background:var(--pend)}
.lv-I3{background:var(--none-soft);color:var(--ink-2)}.lv-I3 b{background:var(--none)}
.lv-OK{background:var(--ok-soft);color:var(--ok)}
.lv-NA{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.lv-K{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.fx{display:inline-block;font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.fx-claimed{border-color:var(--patch);color:var(--patch)}.fx-verified{border-color:var(--ok);color:var(--ok)}
.fx-open{border-color:var(--pend);color:var(--pend)}.fx-failed{border-color:var(--crit);color:var(--crit)}
.small{display:block;font:11px var(--mono);color:var(--muted);margin-top:2px}
.ver{font:500 12px var(--mono);white-space:nowrap} .ver .up{color:var(--patch);font-weight:600}
.when{white-space:nowrap;font:12px var(--mono);color:var(--ink-2)}
.mode{max-width:180px;color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.bars i{display:block;width:6px;height:12px;border-radius:1.5px} .bars i.c{background:var(--pend)} .bars i.r{background:var(--ok)}
.cr{white-space:nowrap;display:flex;align-items:center;gap:8px} .cr .n{font:500 12px var(--mono);color:var(--ink-2);min-width:34px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* forum */
.feed{list-style:none;margin:0;padding:4px 0}
.feed li{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.feed li:last-child{border-bottom:0}
.feed .rail{display:flex;justify-content:center;padding-top:6px}
.feed .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12.5px}
.feed .l1 .alg-l{font-weight:600;cursor:pointer;color:var(--ink)} .feed .l1 .alg-l:hover{color:var(--accent)}
.feed .l1 .t{margin-left:auto;font:11.5px var(--mono);color:var(--muted)}
.feed .ex{font-size:13px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.kind{font-size:11px;font-weight:500} .kind.comment{color:var(--pend)} .kind.response{color:var(--ok)} .kind.call,.kind.notice{color:var(--none)}
.who-list{list-style:none;margin:0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px}
.who-list li{display:grid;grid-template-columns:minmax(0,130px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.who-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-list .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.who-list .track i{display:block;height:100%} .who-list .track i.c{background:var(--pend)} .who-list .track i.r{background:var(--ok)}
.who-list .ct{font:12px var(--mono);color:var(--muted)}

/* about */
.doc{padding:18px 20px 22px;max-width:none}
.doc h3{font:600 15px var(--sans);margin:22px 0 8px} .doc h3:first-child{margin-top:0}
.doc p{margin:0 0 10px;max-width:78ch;color:var(--ink-2)}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 6px;font-size:13px}
.doc dt{white-space:nowrap} .doc dd{margin:0;color:var(--ink-2);max-width:78ch}
.doc ul{margin:0 0 10px;padding-left:18px;color:var(--ink-2);max-width:78ch}
@media (max-width:560px){.doc dl{grid-template-columns:1fr}.doc dt{margin-top:6px}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.42);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dr-h{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h h3{font:700 22px/1.2 var(--serif);margin:0 0 6px}
.dr-h .x{margin-left:auto;border:1px solid var(--line);background:var(--sunk);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none;font-size:16px;line-height:1}
.dr-b{overflow-y:auto;padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.sec-h{font:600 13px var(--sans);margin:22px 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sec-h:first-child{margin-top:2px}
.sec-h .vf{font-weight:400}
.facts{display:grid;grid-template-columns:120px 1fr;margin:0;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;font-size:12.5px}
.facts dt,.facts dd{margin:0;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.facts dt{color:var(--muted);background:var(--sunk)}
.facts dt:last-of-type,.facts dd:last-of-type{border-bottom:0}
@media (max-width:520px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0;padding-bottom:2px}}
.hl{margin:0;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.65}
.stbox{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px}
.stbox .st1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-weight:600;font-size:13.5px}
.stbox p{margin:6px 0 0;font-size:13px;line-height:1.65;color:var(--ink-2)}
.fd{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fd li{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px}
.fd .t1{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.fd .t1 .ttl{font-weight:600;flex:1 1 240px;min-width:0}
.fd .dt{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.fd .src{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.vtag{font-size:11.5px;color:var(--muted);border-bottom:1px dotted var(--muted);cursor:help}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl>li{position:relative;padding:0 0 14px 12px}
.tl>li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--none)}
.tl>li.cur::before{border-color:var(--patch);background:var(--patch)}
.tl .vh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.tl .vh b{font:600 13px var(--mono)}
.tl .vl{font-size:12.5px;color:var(--ink-2);margin:3px 0 6px}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.docs li{display:flex;gap:8px;align-items:baseline;min-width:0}
.docs .cat{flex:none;font-size:11px;color:var(--muted);min-width:70px}
.docs a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.docs .sz{flex:none;font:11px var(--mono);color:var(--muted)}
.msg{border:1px solid var(--line-soft);border-radius:8px;margin-bottom:10px;overflow:hidden}
.msg.comment{border-left:3px solid var(--pend)} .msg.response{border-left:3px solid var(--ok)} .msg.call{border-left:3px solid var(--none)}
.msg-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;background:var(--sunk);font-size:12.5px}
.msg-h .t{font:11.5px var(--mono);color:var(--muted)} .msg-h .lk{margin-left:auto;font-size:12px}
.msg-body{padding:9px 12px 11px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;color:var(--ink-2)}
footer{margin-top:26px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">NGCC · Round 1 · Public-Key (Post-Quantum)</p>
      <h1 id="h1"></h1>
    </div>
    <div class="meta">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button>
      </div>
      <span id="gen"></span>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden>
  <div class="dr-h"><div style="min-width:0"><h3 id="dr-title"></h3><div id="dr-status"></div></div>
  <button class="x" id="dr-close" aria-label="Close">✕</button></div>
  <div class="dr-b" id="dr-body"></div>

d": "实现", "title": "签名验证实现错误（ngcc.dev sign-01）", "detail": "提交方称已修复 ngcc.dev sign-01 报告的签名验证实现错误，并在论坛附上新的实现与测试向量压缩包。", "by": "Markku-Juhani O. Saarinen（ngcc.dev，经提交方论坛回应引用）", "msgs": [], "verify": "none", "fix": {"state": "claimed", "version": "v1.1", "msgs": ["O4KYBDYZGWSGXUOMEW5GCGXGQ2MY2OBR"]}, "impl_level": "I2"}, {"id": "Aigis-Sig+-2", "kind": "实现", "title": "接口忽略密钥长度导致越界读；签名时 polyvecl_uniform_gamma1 多写一个多项式（栈越界写）", "detail": "sig_sign/sig_verify 不使用 sk/pk 长度参数，短缓冲会被按固定长度解包（越界读，可致崩溃）；polyvecl_uniform_gamma1 循环结束后多调用一次 polyz_unpack，写 v->vec[PARAM_L]，参数集 I/II/III 均存在。报告者给出可复现驱动。", "by": "askus.li", "msgs": ["2ZTM3BMRATA6QTPA2OZSSSEBVBCTPHM6"], "verify": "none", "fix": {"state": "open"}, "impl_level": "I2"}], "versions": [{"v": "v1.1", "date": "2026-09-22", "label": "实现修订：修复 ngcc.dev sign-01 报告的签名验证实现错误（附实现与测试向量）", "msgs": ["O4KYBDYZGWSGXUOMEW5GCGXGQ2MY2OBR"]}]}, "BiT": {"findings": [{"id": "BiT-1", "kind": "安全", "title": "双峰拒绝采样（三角分布）存在潜在安全问题，提交方改用抛物线分布", "detail": "提交方在持续分析中发现三角分布上的双峰拒绝采样存在潜在安全问题，已将该组件替换为基于抛物线分布的构造；规范、安全分析与实现正在修订，尚未发布。", "by": "提交方自查", "msgs": ["XNS2SJQ4CUQDWP3IF6AQAMGAYSL5GQ3D"], "verify": "none", "fix": {"state": "ack", "note": "已宣布修订方向，新文档与实现待发布"}, "level": "C"}], "versions": []}, "CEDRUS+C": {"findings": [{"id": "CEDRUS+C-1", "kind": "实现", "title": "超树索引被置零，导致少次签名密钥重复使用（ngcc.dev sign-03）", "detail": "hash_sm3.c 中调试遗留的 *tree = 0 使消息摘要中的树索引被跳过；另有 SPX_BOTTOM_TREE_HEIGHT 缺括号导致索引位宽错误。所有 8 个参数集 SPX_D>1 均受影响。", "by": "Markku-Juhani O. Saarinen（ngcc.dev，经提交方论坛回应引用）", "msgs": [], "verify": "none", "fix": {"state": "claimed", "version": "v1.1", "note": "参考与优化实现均已修正，测试向量更新，代码发布在 GitHub", "msgs": ["DGLHBHCEFFVRVX335CUGVWEZGRYW6D4O"]}, "impl_level": "I1"}], "versions": [{"v": "v1.1", "date": "2026-09-22", "label": "实现修订：修正超树/叶索引解码，更新测试向量（GitHub: zhong-h/CEDRUSPLUSC-SM3）", "msgs": ["DGLHBHCEFFVRVX335CUGVWEZGRYW6D4O"], "links": [{"label": "修订代码（GitHub）", "label_en": "Revised code (GitHub)", "url": "https://github.com/zhong-h/CEDRUSPLUSC-SM3"}]}]}, "CEDRUS-α": {"findings": [{"id": "CEDRUS-α-1", "kind": "实现", "title": "FORC 地址 8 比特截断：每个 FORC 实例的私钥空间塌缩到至多 256 个", "detail": "address.c 的 set_chain_addr() 把 32 比特链索引写入 8 比特字节，索引 ≥256 时取模；7/8 个参数集中所有 k 棵树共用同一组 256 个私钥，破坏规范第 3 章安全界所依赖的独立性。全部 8 个参数集、参考与优化实现均受影响。", "by": "shiyuan", "msgs": ["DZLVOKPTO2KZTN76AGZ2SST2T5ZCIUB7"], "verify": "none", "fix": {"state": "open"}, "impl_level": "I1"}, {"id": "CEDRUS-α-2", "kind": "实现", "title": "CEDRUSALPHA-160s/f 的 WOTS 只认证消息前 128 比特", "detail": "WOTS_UINT_WORDS = SPX_N/8 在 n=20 时为 2，chain_lengths() 只读取 msg[0..15]，末 4 字节不受认证；第二原像安全由 2^160 降到 2^128，碰撞由 2^80 降到 2^64。附独立验证程序。", "by": "shiyuan", "msgs": ["S5GGRLD7YZQQRH2VPPYET2GWYTHFWKXR"], "verify": "none", "fix": {"state": "open"}, "impl_level": "I2"}, {"id": "CEDRUS-α-3", "kind": "规范", "title": "规范与实现的哈希实例化不一致", "detail": "规范要求 PK.seed 填充到 64 字节、地址压缩为 22 字节 ADRS^c、PRF 以 PK.seed 为首参数；实现均未这样做，按规范独立实现与参考实现不互通。", "by": "shiyuan", "msgs": ["3PASZVC2PGWVNXMF7K5T7S2KZ2RZRZLX"], "verify": "none", "fix": {"state": "open"}}], "versions": []}, "CS": {"findings": [{"id": "CS-1", "kind": "安全", "title": "验证只看挑战多项式的奇偶，符号位不提供熵：无需签名查询即可伪造", "detail": "验证算法中 c' 只以 c' mod 2 参与判决，有效挑战空间是 C(n,τ) 个支撑集而非 2^τ·C(n,τ)。固定支撑集后对消息做哈希搜索即可以零响应伪造（UF-NMA）；另一报告指出提示无界，可在单个签名内完成搜索，得到预先选定消息的强伪造。经典代价 2^108.08 / 2^212.46 / 2^394.18（声称 128 / 256 / 512），Grover 下减半。修补需区分符号或改用无符号挑战并重选参数。", "by": "haojiang；Kris Kwiatkowski", "msgs": ["NTO6Y2O356CDK6LTC4MA5AQEG6OLINCG", "QLP6C4KVRQYH6DJAORBRYIOY6MXSELSP"], "verify": "none", "fix": {"state": "open"}, "level": "B"}, {"id": "CS-2", "kind": "安全", "level": "A", "title": "压缩公钥方案泄露私钥低位 b₀，约 2^27 个签名即可恢复 b₀ 与 s₁", "detail": "完整（公钥压缩）方案中，验证方重构的 z₂′ 含有 −c_r·b₀ 项，而隐藏的双峰符号聚合 c_r 与公开的 z₀ 统计相关：由 (z₀, c) 估计 E[c_r]，对 z₂′ 回归得到 b₀，再由 z₂′ 与 z₁ 的互矩恢复 s₁。评论方编译提交的 CS-128 参考实现，在维护方生成的测试密钥上用 2^27 个签名（16 核约 3.25 小时），b₀ 与 s₁ 的全部 768 个系数均正确恢复。", "by": "Yijian Liu", "msgs": ["PNQJ4PBNVDPNY624PDPCOO7ZL2GXIP6H"], "verify": "none", "fix": {"state": "open"}}], "versions": []}, "Facto-DSA": {"findings": [{"id": "Facto-DSA-1", "kind": "安全", "title": "隐藏子空间 K2 可通过代数求解直接找到，§3.2.5 的结构安全估计不成立", "detail": "K2 = ker L2 是公钥零点集内的 n 维线性子空间；任取 n+1 维子空间必与之相交，一次 Macaulay/XL 求解即可得到 K2 中向量，再沿规范自己的 Attack D 链恢复密钥结构。按规范成本模型：约 2^55 / 2^96 / 2^185（声称 128 / 256 / 512）。n=5,6,7 的小规模实验 9/9 恢复 K2；未生成伪造签名，求解度外推自小规模实验。问题在中心映射形状，调参无法修补。", "by": "Kris Kwiatkowski", "msgs": ["GG4GJJCDDS2JVZTLHR2KPN26BD5OXGBA"], "verify": "none", "fix": {"state": "open"}, "level": "B"}], "versions": []}, "Galas": {"findings": [{"id": "Galas-1", "kind": "实现", "title": "参考实现密钥生成使用固定种子 0（ngcc.dev sign-12）", "detail": "提交方回应：规范第 7.1 节要求随机生成密钥，参考实现固定种子仅为测试可复现，只要按规范使用密码学安全随机源即不影响安全。", "by": "Markku-Juhani O. Saarinen（ngcc.dev，经提交方论坛回应引用）", "msgs": [], "verify": "none", "fix": {"state": "disputed", "note": "提交方认为属测试设置，不需修订", "msgs": ["HEGWG6PROUQIHDTXIXONQGQMFWC6INE7"]}, "impl_level": "I3"}], "versions": []}, "MORNING-ATLAS": {"findings": [{"id": "MORNING-ATLAS-1", "kind": "实现", "title": "掩码采样 rej_gamma1m1() 覆盖前一个值，两个签名即可恢复私钥 s₁", "detail": "ATLAS-128/192/256 的参考与优化实现中，每个掩码多项式满足 y₂ᵢ = y₂ᵢ₊₁，相邻系数相减消去掩码，得到关于 s₁ 的无噪线性方程；用两个签名即可满秩求解，已在维护方生成的密钥上完整恢复 s₁。ATLAS-512 使用另一采样分支，不受影响。", "by": "Yijian Liu（代表 Xianhui Lu）", "msgs": ["L5UNKA72RZ2TBTCKZYIVJ5KFDU6XTWFB"], "verify": "none", "fix": {"state": "open"}, "impl_level": "I1"}], "versions": []}, "Origami": {"findings": [{"id": "Origami-2", "kind": "安全", "level": "A", "title": "公钥泄露变量代换，任意参数集可实际伪造签名（通用伪造，无需签名查询）", "detail": "Origami 公开了从可签名映射 G 到公钥映射 P 的变量代换 Π_pub，攻击者求逆后得到易解的方程组，伪造代价与用私钥签名相当。Pierre Pébereau 公开了针对 Origami-128 的实现（github.com/pi-r2/UnfoldOrigami），可推广到所有参数集；论坛帖另转述 Jintai Ding 与 Hugo Louiso 在 pqc-forum 宣布的通用伪造：单核笔记本上 Origami-128 约 0.01 秒、Origami-512 约 15 秒。", "by": "Pierre Pébereau；PeigenLi 转述 Jintai Ding、Hugo Louiso", "msgs": ["HTZTMJ42AUXCWEDA3AURP4ZOEGSGSV4Z", "YDMWWEJFJHV4TKUBP4Y53I3CTZJHC3JQ"], "verify": "none", "fix": {"state": "open"}}, {"id": "Origami-1", "kind": "安全", "title": "子代数 K_ij 的选取与签名求解矛盾；修正后 128 比特参数实际复杂度至多约 93 比特", "detail": "K_ji 只有 l_j 个自由度而非 l_j² 维，大量签名可恢复 09-22", "label": "实现修订：修复 ngcc.dev kem-01 报告的两处解密实现错误（附实现包）", "msgs": ["GGSOU5DK46JKEP27W2B3KRRAJWCW7CLZ"]}]}, "Amoeba": {"findings": [{"id": "Amoeba-1", "kind": "实现", "title": "FO 重加密比较只检查每第 4 个密文字节，构成明文检查预言机，可恢复私钥", "detail": "src/backend/ccakem.c 的 cmp() 以 i += 4 步进，Amoeba-576 只比较 1047 字节中的 262 字节。评论方据此构造明文检查预言机，对全部 10 组官方 Amoeba-576 KAT 密钥各用约 3×10^4 次解封装查询恢复了私钥。改为 i++ 即可修复。", "by": "JinnuoLi", "msgs": ["JB6IBZZUEVGTMM2SF6WK5PIYW7ESSPYT"], "verify": "none", "fix": {"state": "open"}, "impl_level": "I1"}, {"id": "Amoeba-2", "kind": "安全", "title": "解密失败率漏计“检测到 2 个错误即拒绝”的事件，实际 DFR 高出约 44–90 比特", "detail": "规范 §2.3.2 只用 ≥3 个错误的概率界定 DFR，但恰好 2 个错误时解码显式拒绝，同样可被解密失败类攻击利用。按提交方自己的噪声模型：Amoeba-576 由 2^-130.27 变为 2^-86.12，其他参数集差 70–90 比特。影响 §3.1.2 中依赖 DFR 的 CCA 安全界；未直接构成攻击，可通过重选参数修补。", "by": "Yijian Liu", "msgs": ["35SR56KWDUXV5KRSKBU6TXO3LW25CMOC"], "verify": "none", "fix": {"state": "open"}, "level": "C"}], "versions": []}, "CheetahKEM": {"findings": [{"id": "CheetahKEM-1", "kind": "安全", "title": "X^640+1 在整数上可分解，投影到 128 次商环后判定问题极弱", "detail": "X^640+1 = (X^128+1)(X^512−X^384+…+1)，两因子模 q=7681 互素。公开数据可直接投影到 128 次商环（系数变为 CBD(5η)），在其上区分即可区分原问题：估计 uSVP 代价 Cheetah128 约 2^27.7、Cheetah256 约 2^67.7、Cheetah384 约 2^99.3、Cheetah512 约 2^133.4（规范给出 2^159 / 2^307 / 2^426 / 2^541）。完整密钥恢复还需解剩余的 512 次分量，代价未给出但低于原 640 次问题。结论基于估计器，未给出实例。", "by": "XuHaomeng", "msgs": ["IKMFXEEH5K427JC75E7364RNOJEO5OK7"], "verify": "none", "fix": {"state": "open"}, "level": "B"}, {"id": "CheetahKEM-2", "kind": "安全", "level": "C", "title": "正确性分析漏计公钥压缩噪声，DFR 高出 44–124 比特", "detail": "规范 §2.2 的正确性推导没有计入算法 15/16 公钥压缩—解压引入的噪声。按 Kyber DFR 脚本的有限分布卷积方法重算：Cheetah128/256/384/512 为 2^-77.8 / 2^-51.5 / 2^-115.1 / 2^-199.0（规范为 2^-129 / 2^-176 / 2^-189 / 2^-243），参数需要重选。", "by": "Yijian Liu", "msgs": ["5TLZROCK6ZQKG6HTV3PNNESJKICDDKGE"], "verify": "none", "fix": {"state": "open"}}], "versions": []}, "CTL": {"findings": [{"id": "CTL-1", "kind": "安全", "title": "32 字节种子确定性生成密钥，CTL-512 的可达公钥空间至多 2^256（ngcc.dev kem-12-1）", "detail" cs.org.cn/niccs/Proposal/Public-Key Cryptographic Algorithms/Round 1 candidates/TriQ-KEX.zip", "aliases": []}], "messages": [{"msg_id": "P4IG2W7BMLGEJGJGAYY73XAEE32GLCAJ", "thread_id": "P4IG2W7BMLGEJGJGAYY73XAEE32GLCAJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:14", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/P4IG2W7BMLGEJGJGAYY73XAEE32GLCAJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: ADKEX (Authenticated Ding Key Exchange)", "algorithm": "ADKEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/P4IG2W7BMLGEJGJGAYY73XAEE32GLCAJ/"}, {"msg_id": "ASJ42PGKD4VB5HP3LPBE22CN2FKALES7", "thread_id": "ASJ42PGKD4VB5HP3LPBE22CN2FKALES7", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:14", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/ASJ42PGKD4VB5HP3LPBE22CN2FKALES7/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: AFS-KEX", "algorithm": "AFS-KEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/ASJ42PGKD4VB5HP3LPBE22CN2FKALES7/"}, {"msg_id": "JETMJLMIPJPLKZMR4QLTU6IKPULYUFIK", "thread_id": "ASJ42PGKD4VB5HP3LPBE22CN2FKALES7", "position": 1, "level": 0, "author": "赵运磊", "sender_time": "2026-09-22 16:59", "pub_utc": "2026-09-22 08:59 UTC", "body": "Regarding the  implementation issue reported by Markku-Juhani O. Saarinen, We agree that the original wrapper did not correctly separate long-term key material from per-session key material.  AFS-KEX is designed for the post-id setting (where the peer’s identity and corresponding long-term public key need not be known at session initiation and can be learned and authenticated during the exchange), whereas the NGCC interface provides the peer’s long-term public key as an input to the message-generation procedures.  The original wrapper with the current implementation  was developed primarily for functional validation under this uniform interface. In that wrapper, we treated cpk_A and cpk_B as pre-established inputs and generated the composite key pairs during initialization, with the aim of facilitating a consistent comparison with other submitted protocols under the same interface.\n\nWe have revised the implementation by moving ephemeral and composite key-pair generation from initialization into the per-session msg_a and msg_b procedures. We will also ensure that per-session secrets, including ephemeral key-generation seeds and composite secret keys, are stored only in session state and securely erased when the session completes or aborts. The updated implementation will be provided soon.\n\nBest regards\nThe AFS-KEX team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/JETMJLMIPJPLKZMR4QLTU6IKPULYUFIK/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: AFS-KEX", "algorithm": "AFS-KEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/ASJ42PGKD4VB5HP3LPBE22CN2FKALES7/"}, {"msg_id": "4ZJG5LZOXOITLEGIL5Y3FQY2PFTC25F4", "thread_id": "ASJ42PGKD4VB5HP3LPBE22CN2FKALES7", "position": 2, "level": 0, "author": "赵运磊", "sender_time": "2026-09-22 17:28", "pub_utc": "2026-09-22 09:28 UTC", "body": "Authentication is a basic functionality  in cryptography.  There are two fundamental authentication approaches: signature-based, and KEM-based.\n\nSignature-based authentication is the traditional one, where the authentication security is owned by authenticator (signer) itself: an attacker trying to  impersonate the signer has to get the signing secret key.\n\nBut, there is security degradation  with traditional KEM-based authentication: To impersonate Alice who has static KEM public key, there are two approaches: （1） Compromising the static secret key of Alice; or (2) compromising the key denoted $ss$ encapsulated by the peer player Bob, which corresponds to a KCI-type attack. Note that for KEM-based authentication, Alice static public key is usually assumed to be known to Bob in advance, and Bob has the motivation to offline computer encapsulation and kept  $ss$  in relatively long period.\n\nThe KCI-type attack described above  is not a genuine KCI attack. The precise name may be “security degradation caused by KEM-based authentication compared to signature-based”. The literature may crave  for  the computation/bandwidth advantage brought by using PQKEM-based authentication, but It appears that the security degradation issue may not be explicitly and fully discussed in the literature.\n\nHere, we would like emphasize three scenarios that may enlarge the risk caused by such a security degradation:\n\nScenario-1: It is just the scenario aimed by LAKE, where nodes are constrained low-power device with relatively weak security protection.\n\nScenario-2: Client/server setting like TLS. That said, the authentication of the server relies not upon its well protection of static sk, but also relies  on millions of low-power and weak-protected clients. This can be a security disaster for certain critical tasks.\n\nScenario-3: Player’s static public-key is known beforehand, e.g., connecting fixed peer/server， etc. In this setting, a low-power device has reasonable motivation to offline compute and store  SS_I or SS_R in order for online efficiency.\n\nIf we remember correctly,  some outdated versions of TLS or IKE ever use KEM-based authentication, and now they all  moveed to SIGMA by using signature-based authenticationm. I am afraid that we are now going back again KEM-based authentication, but without full recognization of the security degradation. The more complex networks and more complicated system applications nowadays  may further worse the inherent drawbacks of KEM-based authentication， and enlarge the security risks or make things more complex and complicated.  Some computation/bandwidth gains obtained by going back KEM-based authentication may come at the cost of messing up the real world security.  We suggest KEM-based authentication standards should make clear clarifications and warnings about the potential security degradation for practical security.\n\nOne of the motivations of AFS-KEX is to avoid the security degradation caused by  KEM-based authentication while improving bandwidth/efficiency simultaneously. We hope AFS-KEM based authentication could be  the right form for authentication based on KEM which provides  security guarantee similar  to signature-base but essentially  reduces bandwidth/computation overhead.\n\nAFS-KEX can be instantiated with LWE-based KEMs, HQC and variants, Isogeny-based NIKE, etc, but we do not know how to instantiate it with NTRU and RLWR-based KEMs.\n\nBest regards\nThe AFS-KEX team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/4ZJG5LZOXOITLEGIL5Y3FQY2PFTC25F4/", "kind": "response", "kind_rule": "该账号此前已被判定为本算法回应方", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: AFS-KEX", "algorithm": "AFS-KEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/ASJ42PGKD4VB5HP3LPBE22CN2FKALES7/"}, {"msg_id": "M4U5QIFRBYA3T6XQ7UCLJV3RDA6J5IIA", "thread_id": "ASJ42PGKD4VB5HP3LPBE22CN2FKALES7", "position": 3, "level": 1, "author": "赵运磊", "sender_time": "2026-09-22 17:36", "pub_utc": "2026-09-22 09:36 UTC", "body": "By \"We hope AFS-KEM based authentication could be  the right form for authentication based on KEM which provides  security guarantee similar  to signature-base..\", we mean to impersonate Alice, compromising only the encapsulated key $ss$ does not work, as the successful AFS-KEM based authentication also need the knowledge of ephemeral secret key seed that is however held by Alice herself.\n\n> -----原始郵件-----\n> 發件人: \"赵运磊 via PKC Forum\"\n> 發送時間:2026-09-22 17:28:41 (星期二)\n> 收件人: pkcforum@list.niccs.org.cn\n> 抄送: 赵运磊\n> 主題: Round1: Public Comment: AFS-KEX, KEM-based authentication vs. Signature-based\n>\n> Authentication is a basic functionality  in cryptography.  There are two fundamental authentication approaches: signature-based, and KEM-based.\n>\n> Signature-based authentication is the traditional one, where the authentication security is owned by authenticator (signer) itself: an attacker trying to  impersonate the signer has to get the signing secret key.\n>\n> But, there is security degradation  with traditional KEM-based authentication: To impersonate Alice who has static KEM public key, there are two approaches: （1） Compromising the static secret key of Alice; or (2) compromising the key denoted $ss$ encapsulated by the peer player Bob, which corresponds to a KCI-type attack. Note that for KEM-based authentication, Alice static public key is usually assumed to be known to Bob in advance, and Bob has the motivation to offline computer encapsulation and kept  $ss$  in relatively long period.\n>\n>\n>\n> The KCI-type attack described above  is not a genuine KCI attack. The precise name may be “security degradation caused by KEM-based authentication compared to signature-based”. The literature may crave  for  the computation/bandwidth advantage brought by using PQKEM-based authentication, but It appears that the security degradation issue may not be explicitly and fully discussed in the literature.\n>\n> Here, we would like emphasize three scenarios that may enlarge the risk caused by such a security degradation:\n>\n> Scenario-1: It is just the scenario aimed by LAKE, where nodes are constrained low-power device with relatively weak security protection.\n>\n> Scenario-2: Client/server setting like TLS. That said, the authentication of the server relies not upon its well protection of static sk, but also relies  on millions of low-power and weak-protected clients. This can be a security disaster for certain critical tasks.\n>\n> Scenario-3: Player’s static public-key is known beforehand, e.g., connecting fixed peer/server， etc. In this setting, a low-power device has reasonable motivation to offline compute and store  SS_I or SS_R in order for online efficiency.\n>\n> If we remember correctly,  some outdated versions of TLS or IKE ever use KEM-based authentication, and now they all  moveed to SIGMA by using signature-based authenticationm. I am afraid that we are now going back again KEM-based authentication, but without full recognization of the security degradation. The more complex networks and more complicated system applications nowadays  may further worse the inherent drawbacks of KEM-based authentication， and enlarge the security risks or make things more complex and complicated.  Some computation/bandwidth gains obtained by going back KEM-based authentication may come at the cost of messing up the real world security.  We suggest KEM-based authentication standards should make clear clarifications and warnings about the potential security degradation for practical security.\n>\n> One of the motivations of AFS-KEX is to avoid the security degradation caused by  KEM-based authentication while improving bandwidth/efficiency simultaneously. We hope AFS-KEM based authentication could be  the right form for authentication based on KEM which provides  security guarantee similar  to signature-base but essentially  reduces bandwidth/computation overhead.\n>\n> AFS-KEX can be instantiated with LWE-based KEMs, HQC and variants, Isogeny-based NIKE, etc, but we do not know how to instantiate it with NTRU and RLWR-based KEMs.\n>\n> Best regards\n> The AFS-KEX team\n>\n> _______________________________________________\n> PKC Forum mailing list -- pkcforum@list.niccs.org.cn\n> To unsubscribe: mailto: pkcforum-unsubscribe@list.niccs.org.cn\n> To view this discussion visit https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn\n>\n>\n>", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/M4U5QIFRBYA3T6XQ7UCLJV3RDA6J5IIA/", "kind": "response", "kind_rule": "该账号此前已被判定为本算法回应方", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: AFS-KEX", "algorithm": "AFS-KEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/ASJ42PGKD4VB5HP3LPBE22CN2FKALES7/"}, {"msg_id": "HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ", "thread_id": "HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:32", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.\nThe algorithm's name is presented in Latex format.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Aigis-Enc$^+$", "algorithm": "Aigis-Enc+", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ/"}, {"msg_id": "GGSOU5DK46JKEP27W2B3KRRAJWCW7CLZ", "thread_id": "HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ", "position": 1, "level": 0, "author": "RunqingXu", "sender_time": "2026-09-22 10:43", "pub_utc": "2026-09-22 02:43 UTC", "body": "Dear all,\n\nWe have fixed the two implementation errors in the decryption implementation reported by Markku-Juhani O. Saarinen in https://ngcc.dev/reports/kem-01.html.\nWe sincerely thank Markku-Juhani O. Saarinen for his prompt feedback and thorough analysis.\n\nWe welcome further analysis and comments from the community.\n\nBest regards,\nThe Aigis-Enc+ Team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/GGSOU5DK46JKEP27W2B3KRRAJWCW7CLZ/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Aigis-Enc$^+$", "algorithm": "Aigis-Enc+", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/HDMMQKVT6UFDKT56DVYCAUBTQ5GWSIFJ/"}, {"msg_id": "HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO", "thread_id": "HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-20 02:16", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.\nThe algorithm's name is presented in Latex format.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Aigis-Sig$^+$", "algorithm": "Aigis-Sig+", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO/"}, {"msg_id": "O4KYBDYZGWSGXUOMEW5GCGXGQ2MY2OBR", "thread_id": "HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO", "position": 1, "level": 0, "author": "RunqingXu", "sender_time": "2026-09-22 11:32", "pub_utc": "2026-09-22 03:32 UTC", "body": "Dear all,\n\nWe have fixed the implementation errors in the signature verification implementation reported by Markku-Juhani O. Saarinen in https://ngcc.dev/reports/sign-01.html.\nWe sincerely thank Markku-Juhani O. Saarinen for his prompt feedback and thorough analysis.\n\nWe welcome further analysis and comments from the community.\n\nBest regards,\nThe Aigis-Sig+ Team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/O4KYBDYZGWSGXUOMEW5GCGXGQ2MY2OBR/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Aigis-Sig$^+$", "algorithm": "Aigis-Sig+", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO/"}, {"msg_id": "2ZTM3BMRATA6QTPA2OZSSSEBVBCTPHM6", "thread_id": "HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO", "position": 2, "level": 0, "author": "askus.li", "sender_time": "2026-09-23 15:39", "pub_utc": "2026-09-23 15:39 UTC", "body": "Hi All,\n\nTwo implementation defects in the\nAigis-Sig$^+$\n reference code are reported below. Runtime witnesses are for parameter set I (Aigis-sig1). The extra `polyz_unpack` is present in the published `polyvec.c` for parameter sets I, II and III.\n\nDetected and reproduced autonomously by Askus Operator using Luna High. Verified by human review\n.\n\nFor the reproduction using ngcc-harness\n \nhttps://github.com/AskusLi/ngcc-harness/tree/Aigis-reproduction/sign-01\n \n\nThe wrapper and the extra unpack were read from the published reference tree:\n\n- `Aigis-Sig+-I/SIG_AlgorithmInstance.c`\n- `Aigis-Sig+-I/polyvec.c`\n- `Aigis-Sig+-I/polyvec.h`\n- `Aigis-Sig+-I/params.h`\n\n`PARAM_L` is 2, 4 and 7 for parameter sets I, II and III.\n\nComplete drivers are included at the end of this message. They expect the harness link shims `link_common.h` / `link_sig.h` and a built `sig_sign` / `sig_verify` shared library.\n\n---\n\n## 1. sig_sign and sig_verify ignore key lengths and unpack short key buffers\n\nThe ICCS entry points take key lengths, but the reference wrapper does not use them. The underlying routines unpack fixed-size keys.\n\n```c\nint sig_sign(\n    unsigned char *sk, unsigned long long sk_len_bytes,\n    unsigned char *m, unsigned long long m_len_bytes,\n    unsigned char *sn, unsigned long long *sn_len_bytes)\n{\n    return msig_sign(sk, m, m_len_bytes, sn, sn_len_bytes);\n}\n\nint sig_verify(\n    unsigned char *pk, unsigned long long pk_len_bytes,\n    unsigned char *sn, unsigned long long sn_len_bytes,\n    unsigned char *m, unsigned long long m_len_bytes)\n{\n    return msig_verf(pk, sn, sn_len_bytes, m, m_len_bytes);\n}\n```\n\n`sk_len_bytes` and `pk_len_bytes` are unused. `sig_get_sk_len_bytes()` and `sig_get_pk_len_bytes()` advertise the fixed sizes (2800 and 928 bytes on Aigis-sig1).\n\n`msig_sign` / `msig_verf` pass the pointer to `unpack_sk` / `unpack_pk` with no length check. Those functions immediately read `SEEDBYTES` bytes from the key (`rho[i] = sk[i]` / `pk[i]`), then continue through the rest of the packed key.\n\nThe short-key driver first completes a full-size keygen / sign / verify. It then calls `sig_sign` and `sig_verify` in separate child processes with a one-byte key placed immediately before a `PROT_NONE` page and with declared length 0. Both children fault (`SIGSEGV` or `SIGBUS`). The only object adjacent to the guard page is the truncated key, so the fault is an access past that object. The test shows at least a two-byte read; the unpack source is what shows a full-key read.\n\nObserved result:\n\n```text\nshort-key-read full=accepted short_sign=guard-fault short_verify=guard-fault\nCONFIRMED: truncated key buffers are unpacked\n```\n\nThis is an out-of-bounds read of the key object. It can crash a process if the next page is inaccessible. It is a denial-of-service risk only if an application forwards an attacker-controlled short key into these functions. The test does not show memory disclosure, code execution, or a network-reachable path. A caller that uses the advertised `sig_get_*_len_bytes()` sizes never hits this behavior.\n\n---\n\n## 2. Honest signing writes one polynomial past polyvecl in polyvecl_uniform_gamma1\n\n`polyvecl` is a vector of `PARAM_L` polynomials. `polyvecl_uniform_gamma1` unpacks `PARAM_L` elements and then calls `polyz_unpack` once more. After the loop, `i == PARAM_L`, so the extra call writes `v->vec[PARAM_L]`.\n\n```c\ntypedef struct {\n  poly vec[PARAM_L];\n} polyvecl;\n\nint polyvecl_uniform_gamma1(polyvecl *v, unsigned char* seed, unsigned int nonce)\n{\n    int i;\n    unsigned char inbuf[SEEDBYTES + CRHBYTES + 2];\n    unsigned char outbuf[SZBITS * PARAM_N / 8 + 1];\n    for (i = 0; i < SEEDBYTES + CRHBYTES; ++i)\n        inbuf[i] = seed[i];\n    for (i = 0; i < PARAM_L ; i++)\n    {\n        inbuf[SEEDBYTES + CRHBYTES] = nonce & 0xFF;\n        inbuf[SEEDBYTES + CRHBYTES + 1] = nonce >> 8;\n        KDF(outbuf, SZBITS * PARAM_N / 8, inbuf, SEEDBYTES + CRHBYTES + 2);\n        polyz_unpack(v->vec + i, outbuf);\n        nonce++;\n    }\n    polyz_unpack(v->vec + i, outbuf); /* i == PARAM_L */\n    return 0;\n}\n```\n\n`polyz_unpack` writes a full polynomial (`PARAM_N = 512` coefficients, 2048 bytes). Neighboring helpers (`polyvecl_uniform_eta1`, `polyvecl_ntt`, and the other `polyvecl_*` loops) stop at `PARAM_L` and have no extra iteration. The extra unpack reuses the last loop `outbuf`, so the written polynomial equals the last valid component of `y`.\n\n`msig_sign` keeps `y` on the stack next to `yhat`, `z`, and `cs1`:\n\n```c\npolyvecl mat[PARAM_K], y, yhat, z, cs1;\n...\npolyvecl_uniform_gamma1(&y, key, nonce);\nyhat = y;\n```\n\nThe overflow driver first completes a full-size sign-and-verify on a control library, then repeats the same valid `sig_sign` against an AddressSanitizer build. It accepts only a diagnostic that contains both `stack-buffer-overflow` and `polyvecl_uniform_gamma1`.\n\nObserved results, parameter set I:\n\n```text\nordinary -O2 keygen/sign/verify: passed\n-O2 + ASan valid sig_sign:      stack-buffer-overflow in polyvecl_uniform_gamma1\nsigning-stack-overflow full-round-trip=passed asan-sign=asan-diagnostic\n```\n\nThe extra store is undefined behavior in C. It is still present at `-O2`: the `-O2` ASan build reports the write. The ordinary `-O2` binary completed a normal keygen / sign / verify round trip, so that run did not turn the write into a visible failure. The next stack object is layout-dependent. If it is `yhat`, the following `yhat = y` overwrites the smashed region. The test does not show a canary abort, controlled corruption, code execution, or key disclosure. An attacker must be able to cause an application to sign. The test does not show that an untrusted remote user can reach that service.\n\nThe extra call should be removed. After the loop, `i` is already `PARAM_L` and `v->vec[0 .. PARAM_L-1]` have been filled.\n\n---\n\nThe first issue is repaired by checking `sk_len_bytes` and `pk_len_bytes` against `SIG_SECRETKEYBYTES` and `SIG_PUBLICKEYBYTES` before unpacking, and rejecting a short buffer. The second issue is repaired by deleting the extra `polyz_unpack`.\n\nOptimized (AVX2 / NEON) copies in the same archive were not checked here. The extra `polyz_unpack` line is in the published reference `polyvec.c` for parameter sets I, II and III. The guard-page driver and both `-O2` signing tests were run on parameter set I.\n\nBest regards", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/2ZTM3BMRATA6QTPA2OZSSSEBVBCTPHM6/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Aigis-Sig$^+$", "algorithm": "Aigis-Sig+", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/HBX64SLYWTSSMTL3LYHBO3BD77ENY7VO/"}, {"msg_id": "OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO", "thread_id": "OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:28", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Amoeba", "algorithm": "Amoeba", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO/"}, {"msg_id": "JB6IBZZUEVGTMM2SF6WK5PIYW7ESSPYT", "thread_id": "OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO", "position": 1, "level": 0, "author": "JinnuoLi", "sender_time": "2026-09-22 10:38", "pub_utc": "2026-09-22 10:38 UTC", "body": "Incomplete FO ciphertext comparison in Amoeba KEM\n\nWe found that the FO re-encryption check in src/backend/ccakem.c compares only every fourth ciphertext byte:\n\nint32_t cmp(uint8_t* c1, uint8_t* c2, int32_t len) {\n    int32_t tag = 0;\n    for (int32_t i = 0; i < len; i += 4) {\n        tag += (c1[i] != c2[i]);  // Do not break: constant time\n    }\n    return tag;\n}\n\nThis incomplete comparison can provide a plaintext-checking oracle, the same primitive exploited by key-mismatch attacks, and enable secret-key recovery.\n\nWe use Amoeba-576 as a concrete example to demonstrate the attack. For this parameter set, only 262 of 1,047 ciphertext bytes are checked. Using a method similar to that described by Das (ePrint 2026/1682), we constructed a plaintext-checking oracle and recovered the secret keys corresponding to all 10 official Amoeba-576 KAT vectors, using about 3 × 10^4 decapsulation queries per key.\n\nChanging i += 4 to i++ prevents the attack. This appears to be a typo; could the authors please confirm?", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/JB6IBZZUEVGTMM2SF6WK5PIYW7ESSPYT/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Amoeba", "algorithm": "Amoeba", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO/"}, {"msg_id": "35SR56KWDUXV5KRSKBU6TXO3LW25CMOC", "thread_id": "OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO", "position": 2, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-23 12:23", "pub_utc": "2026-09-23 12:23 UTC", "body": "Hi, I believe there may be a miscalculation in the decryption failure rate (DFR) reported in the submission. In particular, Section 2.3.2 of the Amoeba specification appears to exclude detected 2-error events from the reported DFR. This is a correctness-accounting issue that remains even if the submission’s Gaussian approximation and independence assumptions are accepted.\n\nThe specification states that its shortened extended Hamming code corrects 1 error, detects 2 errors, and explicitly rejects decryption when exactly 2 errors occur. However, the overall DFR is then bounded using only the probability of at least 3 errors.\n\nIn my view, the 2-error events should also be counted as decryption failures. The adversary does not need the decoder to output an incorrect plaintext for such an event to be relevant. When exactly 2 errors occur, the decoder rejects. Such a rejection would reveal information about the randomness of the ciphertext and its relationship to the secret key, for example, information corresponding to a linear inequality. This type of information may be relevant to standard decryption failure attacks, such as those studied in Decryption Failure Attacks on IND-CCA Secure Lattice-Based Schemes (\nhttps://doi.org/10.1007/978-3-030-17259-6_19\n). Explicit rejection by itself does not eliminate this concern.\n\nThe supplied `noise_estimation.ipynb` reports both the at-least-2-error and at-least-3-error tails. Keeping the authors’ parameters and noise model unchanged, the comparison is:\n\n| Parameter set | log2 Pr[N >= 3] | log2 Pr[N >= 2] | Gap |\n| Amoeba-576 | -130.2722 | -86.1221 | 44.1501 |\n| Amoeba-864 | -208.5810 | -138.3279 | 70.2531 |\n| Amoeba-1152 | -267.9088 | -177.8798 | 90.0290 |\n| Amoeba-1728 | -229.3242 | -152.1567 | 77.1675 |\n| Amoeba-2304 | -205.2841 | -136.1300 | 69.1541 |\n\nHere, N denotes the number of errors.\n\nFor example, under the model used for Amoeba-576, the relevant DFR would be approximately 2^-86.12 rather than the approximately 2^-130.27 quantity obtained from the at-least-three-error tail. This is a difference of about 44 bits in the exponent of the probability. It may not immediately imply a practical attack, but the resulting failure probability is substantially greater than 2^-128. These numbers are comparisons within the authors’ Gaussian/i.i.d. model; they are not measurements or certified bounds for the actual correlated implementation noise. Nevertheless, the counting issue is relevant to the CCA analysis because the security bounds in Section 3.1.2 explicitly depend on the underlying PKE failure probability. Detected rejections of honestly generated ciphertexts should therefore be included in that parameter.\n\nThis issue appears to be fixable, for example, by reselecting the parameters for Amoeba-576 so that the DFR accounting for detected 2-error events could be less than 2^{-128}.\n\nThis analysis was prepared with AI assistance.\n\nBest,\nYijian", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/35SR56KWDUXV5KRSKBU6TXO3LW25CMOC/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Amoeba", "algorithm": "Amoeba", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OXTBKIPREWPX4YRV4BLRMLWND4R4DLTO/"}, {"msg_id": "RIQCA4YWQIPGGI2BOXRMFEYCCHTY3NQY", "thread_id": "RIQCA4YWQIPGGI2BOXRMFEYCCHTY3NQY", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:28", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/RIQCA4YWQIPGGI2BOXRMFEYCCHTY3NQY/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: BAG-Loong", "algorithm": "BAG-Loong", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/RIQCA4YWQIPGGI2BOXRMFEYCCHTY3NQY/"}, {"msg_id": "QUDRCTIJQVCLQNOYCZKNQYUMZO7PPPF6", "thread_id": "QUDRCTIJQVCLQNOYCZKNQYUMZO7PPPF6", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:28", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/arch

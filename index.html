.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/PHFOUHYOCTA42ALMCBKHF5JLD2HQGVXV/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: TRINE", "algorithm": "TRINE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/PHFOUHYOCTA42ALMCBKHF5JLD2HQGVXV/"}, {"msg_id": "BP4QW5XTWWAJOCTHWK64Z6L3LTCXEWIA", "thread_id": "BP4QW5XTWWAJOCTHWK64Z6L3LTCXEWIA", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:37", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/BP4QW5XTWWAJOCTHWK64Z6L3LTCXEWIA/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: TSUOV", "algorithm": "TSUOV", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/BP4QW5XTWWAJOCTHWK64Z6L3LTCXEWIA/"}, {"msg_id": "3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF", "thread_id": "3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:37", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Tins", "algorithm": "Tins", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF/"}, {"msg_id": "ECMH3PMGM2NWJG4JIBQBCKQ6U5CBUDDA", "thread_id": "3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF", "position": 1, "level": 0, "author": "ifeelok", "sender_time": "2026-09-22 14:26", "pub_utc": "2026-09-22 06:26 UTC", "body": "Dear all,\n\nWe found that Tins (submission no. 29, category SIG) is subject to a complete, design-level break. We are reporting it to this list and are notifying the Tins submitters in parallel. The key findings are summarized below.\n\n1. Core Result\n\nFrom\nany single valid signature\n (together with the public key; the signed message is not even needed), the full secret witness (α, β) — the functional equivalent of the private key — can be recovered deterministically. The recovered witness then yields valid signatures on arbitrary messages, and these forgeries are\naccepted by the unmodified official reference verifier\n. The attack works against all three instantiations, Tins128 / Tins256 / Tins512 (verified end-to-end, 9/9 runs).\n\nWe additionally ran the attack on the\nofficial KAT vectors shipped in the submission package\n: for Tins256, all 10 KAT signatures yield exact witness recovery, and signatures forged with the recovered witness on fresh messages are accepted by the reference verifier (10/10). For Tins128, all 10 KAT signatures yield exact witness recovery as well. (Incidentally, we observed that the Tins128 and Tins512 KAT files do not verify under the package's own reference implementation — apparently a code/KAT synchronization issue in the submission, independent of our attack.)\n\n2. Root Cause: Subfield-Confinement of Masks\n\nThe specification's own notation prescribes that all masking material lives in the subfield GF(2^12) ⊂ GF(2^k):\n\n- α_base, β_base ∈ F_{qµ}^{n−2}, δ, δ_base ∈ F_{qµ}, evaluation points φ ∈ F_{qµ} (q = 2, µ = 12);\n- the degree-one witness-embedding polynomials P_α(X) = α·X + α_base (and counterparts) are defined over that subfield;\n- the additive mask δ_acc is XOR-ed only into the\nconstant coefficient\n of p_mid, i.e., it affects just 12 of the k bit positions.\n\nThe verifier-recomputable evaluations satisfy the identity\n\n　　α_eval = α_base ⊕ φ·α　(φ the public challenge point)\n\nSubstituting this into the signer's four-term expression for p_mid and expanding (the pure bilinear monomials cancel in characteristic 2 due to the key equation ua·vb ⊕ ub·va = 0) yields a relation that is\nbit-wise linear in the witness with fully public coefficients\n:\n\n　　p_mid ⊕ L = ⊕_j α_j·(u_j·B(φ) ⊕ v_j·C(φ)) ⊕ ⊕_j β_j·(v_j·A(φ) ⊕ u_j·D(φ)) ⊕ δ\n\nwhere A, B, C, D, L are computable from public data alone, and the only unknown residue δ ∈ GF(2^12) touches the constant coefficient alone.\n\n3. Attack Complexity\n\n- Each parallel execution leaks k − 12 linear equations over GF(2) in the 2d witness bits.\n- For all three parameter sets, 2(k−12) ≥ 2d (slack 252 / 500 / 1020), so\ntwo executions — available within a single signature (τ ≥ 12)\n generically determine the witness uniquely.\n- Observed ranks: exactly k−12 after the first round (264 / 516 / 1032) and exactly 2d after the second (276 / 532 / 1044).\n- Total cost is a single GF(2) Gaussian elimination on 2d ≤ 1044 unknowns — milliseconds, deterministic, succeeds on every signature.\n\nWe welcome comments and corrections from the Tins team and the community.\n\nBest regards,\n\nTianyuan Xie\nSeptember 2026", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/ECMH3PMGM2NWJG4JIBQBCKQ6U5CBUDDA/", "kind": "comment", "kind_rule": "config.message_overrides 指定", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Tins", "algorithm": "Tins", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF/"}, {"msg_id": "AJF5VVYQAJTICBWFFS5DHIO4U2FZZOXT", "thread_id": "3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF", "position": 2, "level": 1, "author": "tins", "sender_time": "2026-09-25 14:03", "pub_utc": "2026-09-25 14:03 UTC", "body": "Dear All:\n\nHappy Mid-Autumn Festival!\n\nAfter verification, the Tins team confirms that the attack on Tins proposed by Tianyuan Xie is valid. As pointed out in her analysis, sampling the polynomial P_{δ}(X) from the space F_{q^µ}[X] is insufficient to hide information about the private key. Our team was aware at the initial design stage that this choice entailed a security risk. The safest and most conservative approach would have been to select P_{δ}(X) uniformly from the full space F_{q^k}[X], but doing so would have significantly degraded the efficiency of the algorithm. Moreover, no effective attack had been identified at the time, so we proceeded with the current design.\n\nGiven that the current design is now shown to be insecure, we hereby withdraw the proposal for this algorithm.\n\nFinally, we sincerely thank the attacker for the effective analysis, which corroborated the risk we had previously identified and laid an analytical foundation for improving the security of the algorithm.\n\nThe Tins Team\nSeptember 25, 2026", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/AJF5VVYQAJTICBWFFS5DHIO4U2FZZOXT/", "kind": "response", "kind_rule": "账号名含算法名", "first_seen": "2026-09-25 22:50:16", "title": "Round1: Public Comment: Tins", "algorithm": "Tins", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3LQUXPLSYUUHSKU4QWDFI6C3O4H3GXKF/"}, {"msg_id": "BKY3EZYVJHKKT2RJKK2IRE2X5V4UN4HO", "thread_id": "BKY3EZYVJHKKT2RJKK2IRE2X5V4UN4HO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:16", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/BKY3EZYVJHKKT2RJKK2IRE2X5V4UN4HO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: TriQ-KEM", "algorithm": "TriQ-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/BKY3EZYVJHKKT2RJKK2IRE2X5V4UN4HO/"}, {"msg_id": "Y7MZTLMKIGHUVZCNIUAJQA33K4KU427Q", "thread_id": "Y7MZTLMKIGHUVZCNIUAJQA33K4KU427Q", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:08", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/Y7MZTLMKIGHUVZCNIUAJQA33K4KU427Q/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: TriQ-KEX", "algorithm": "TriQ-KEX", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/Y7MZTLMKIGHUVZCNIUAJQA33K4KU427Q/"}, {"msg_id": "2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL", "thread_id": "2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:16", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: UVW Key Encapsulation Mechanism", "algorithm": "UVW-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL/"}, {"msg_id": "A6PUI23BHC7YNE5UQ3SMRO33GDBWCF2P", "thread_id": "2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL", "position": 1, "level": 0, "author": "ifeelok", "sender_time": "2026-09-24 19:33", "pub_utc": "2026-09-24 11:33 UTC", "body": "Dear all,\n\nWe found that UVW-KEM (submission no. 38, category KEM) is vulnerable to a\nreaction attack. Under a visible decapsulation reaction signal, such as retry\ncount, timing, or distinguishable failure behavior, we can recover the hidden\ncode structure and then decrypt arbitrary ciphertexts.\n\nWe have verified the full attack end-to-end on UVW-KEM-128. Starting from the\nDear all,\n\nWe found that UVW-KEM (submission no. 38, category KEM) is vulnerable to a\nreaction attack. Under a visible decapsulation reaction signal, such as retry\ncount, timing, or distinguishable failure behavior, we can recover the hidden\ncode structure and then decrypt arbitrary ciphertexts.\n\nWe have verified the full attack end-to-end on UVW-KEM-128. Starting from the\npublic key and chosen-ciphertext decapsulation reactions, the attack recovers\nall hidden column pairs and ratios, constructs the induced GRS image code, and\nthen decrypts a fresh ciphertext generated by the unmodified `kem_enc`. The\nrecovered plaintext `m` and 512-bit session key `K` match the encapsulator's\nvalues byte-for-byte, and the recovered values pass the Fujisaki-Okamoto\nchecks `H1(m) = (r,e)` and `H2(m) = d`.\n\n1. Method\n\nThe attack has four stages.\n\nStage 1 -- Reaction oracle. UVW encryption is\n\n    c1 = r * Gpub + e,   Gpub = [I | T].\n\nThe secret code has the form\n\n    G0 = [ GU          GU ]\n         [ GRS + GW    GW ] * D,\n\nwhere the secret monomial matrix `D` permutes and scales the columns. The\nblock structure induces `n/2` hidden pairs in public coordinates, with one\nsecret ratio per pair.\n\nDecapsulation computes `c1 * D^-1 = (c11 || c12)`, list-decodes `c11 - c12`,\nand then chooses an information set `I1` among positions where `e1 - e2 = 0`.\nA hidden position with\n\n    e1_i = e2_i != 0\n\nlooks clean in `e1 - e2`, but is not actually clean. If the sampled `I1` hits\nsuch a position, that decoding attempt fails and the decoder retries. In\npublic coordinates, this event is equivalent to\n\n    e[a] = gamma * e[b] != 0\n\nfor a hidden public-coordinate pair `(a,b)` and its ratio `gamma`.\n\nThus the retry/failure behavior gives a reaction signal for hidden pair/ratio\nevents.\n\nStage 2 -- Heavy hitters. The attacker chooses `m`, derives `(r,e) = H1(m)`,\nconstructs the corresponding valid ciphertext, and keeps samples that trigger\nthe reaction. For each kept sample, the attacker counts all triples\n\n    (a, b, e[a] / e[b])\n\nwith `a,b` in `supp(e)`. True hidden triples are statistically enriched in\nthe reaction-conditioned samples. For UVW-KEM-128, at 10^4 failures the\nexpected count is about 23 for a true triple and about 0.4 for a false one.\n\nIn our run, with 1.06 x 10^6 chosen ciphertexts producing 15,000 failures,\nwe recovered all 430 hidden pairs and ratios:\n\n    exact_pair_ratio_recovered = 430/430\n    partition_pairs = 430\n    partition_exact = 430\n\nThe few false heavy-hitter candidates are removed by enforcing that the\nhidden pairs partition the 860 coordinates.\n\nStage 3 -- Structure recovery. Once the pairs are known, define\n\n    Delta(x)_i = x[a_i] - gamma_i * x[b_i].\n\nFor every public codeword, this cancels the duplicated random part and maps\nthe public code onto a generalized Reed-Solomon image code of rank `k2 = 215`.\nA Sidelnikov-Shestakov-style cross-ratio computation on a systematic image\ngenerator recovers the GRS evaluation points and column multipliers. The\nrow-reduction history gives a public lift back into the public code, and the\nkernel of `Delta` has dimension `k1 = 215`.\n\nStage 4 -- Decrypting a target ciphertext. For a target `c1`, compute and\ndecode `Delta(c1)` in the recovered GRS code. For UVW-KEM-128 the image error\nweight can be up to `w = 116`, beyond the unique-decoding radius 107 of the\n[430,215] RS code, so we use the submission's own Guruswami-Sudan list decoder\n(`RS_M=4`, `RS_L=5`). The decoded image is lifted back to the public code, and\nthe remaining kernel component is solved from clean pair positions. Candidates\nare filtered by `wt(e) <= w`.\n\nThis yields the exact `(r,e)`, then\n\n    m = c2 xor H3(r,e),\n    K = H4(m,c1,c2).\n\n2. Verification\n\nOn UVW-KEM-128:\n\n- Channel validation on the real `kem_dec`, instrumented only with an attempt\n  counter: clean ciphertexts took exactly 1 attempt in 58/58 cases, while\n  bad-pair ciphertexts averaged 2.0 attempts.\n\n- Heavy-hitter recovery: all 430 hidden pairs and ratios were recovered\n  exactly; the few false heavy-hitter candidates were eliminated by the\n  coordinate-partition constraint.\n\n- Structure recovery: the Delta image has rank 215 and its kernel dimension\n  215, matching k2 and k1 as the method requires; GRS recovery succeeded on\n  the first information set.\n\n- End-to-end target decryption: `uvw_rs_list_decode` returned 3 candidates;\n  the recovered error has `wt(e) = 116`; `H1(m) = (r,e)` and `H2(m) = d`\n  both verified; the recovered `K` equals the session key output by\n  `kem_enc`.\n\nThe observed single-attempt failure rate was 0.0142. The false-clean-pair\ncomponent is consistent with the specification's single-decryption success\nprobability 0.988123 in Sec. 2.2, Theorem 2.\n\nThe structural mechanism is not specific to the 128-bit parameter set, but we\nhave only verified the full end-to-end attack on UVW-KEM-128.\n\n3. Cost\n\nFor UVW-KEM-128:\n\n- About 1.1 x 10^6 chosen-ciphertext decapsulation reactions are sufficient\n  to recover the hidden pairs and ratios.\n- Offline heavy-hitter processing takes about 80 seconds on one core.\n- Structure recovery takes seconds of GF(433) linear algebra.\n- Decrypting a target ciphertext takes one GS list decode plus a kernel solve,\n  about 2 seconds in our implementation.\n\nIn the reproduction package, the high-volume phase uses an exact simulation\nof the first-attempt reaction event for speed; the corresponding retry-count\nchannel is validated directly against the real decapsulator. Running 10^6\nfull GS decapsulations is unnecessary for the demo but would expose the same\nsignal through timing/retry behavior.\n\n4. Reproduction\n\nThe attached package rebuilds the submitted UVW-KEM-128 reference code,\nvalidates the retry-count channel on the real decapsulator, recovers all 430\nhidden pairs and ratios, and decrypts a fresh `kem_enc` ciphertext end-to-end.\nThe final success marker is\n\n    E2E_OK\n\nwith the recovered session key equal to the encapsulator's session key.\n\nDisclosure: the analysis and reproduction code were prepared with GPT-5.5 and Kimi K3.\n\nBest regards,\nTianyuan Xie (on behalf of openHiTLS team)\nSeptember 2026\nshow more\nshow less", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/A6PUI23BHC7YNE5UQ3SMRO33GDBWCF2P/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 22:50:16", "title": "Round1: Public Comment: UVW Key Encapsulation Mechanism", "algorithm": "UVW-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/2N7FVNDINZAC7ZES4OC5GGHIGPQVPCWL/"}, {"msg_id": "KYXKYDE5L3DXFKASFNILENQKW4V73JXN", "thread_id": "KYXKYDE5L3DXFKASFNILENQKW4V73JXN", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:36", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/KYXKYDE5L3DXFKASFNILENQKW4V73JXN/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: UVW signature", "algorithm": "UVW-Sig", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/KYXKYDE5L3DXFKASFNILENQKW4V73JXN/"}, {"msg_id": "VT73TSZCRZVPPQDP3B4NBVVRRF36XVJ6", "thread_id": "KYXKYDE5L3DXFKASFNILENQKW4V73JXN", "position": 1, "level": 0, "author": "LittleQ", "sender_time": "2026-09-23 11:12", "pub_utc": "2026-09-23 11:12 UTC", "body": "Subject: sig_verify always reports a valid signature\n\nIn all six implementations, sig_verify computes the verification result with uvw_verify but ends with return 0. The API defines 0 as a valid signature and -1 as an invalid one, so callers are told that an invalid signature is valid.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/VT73TSZCRZVPPQDP3B4NBVVRRF36XVJ6/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: UVW signature", "algorithm": "UVW-Sig", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/KYXKYDE5L3DXFKASFNILENQKW4V73JXN/"}, {"msg_id": "X2VGTA5L2EJJASOPF5TYJI2GAXDIO677", "thread_id": "X2VGTA5L2EJJASOPF5TYJI2GAXDIO677", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:36", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/X2VGTA5L2EJJASOPF5TYJI2GAXDIO677/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: VDOO: Vinegar-Diagonal-Oil-Oil", "algorithm": "VDOO", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/X2VGTA5L2EJJASOPF5TYJI2GAXDIO677/"}, {"msg_id": "O46LALSXK4OQRHPTYMS4AMD7KAR4PX6L", "thread_id": "X2VGTA5L2EJJASOPF5TYJI2GAXDIO677", "position": 1, "level": 0, "author": "PeigenLi", "sender_time": "2026-09-22 01:00", "pub_utc": null, "body": "We believe that level 5 of VDOO, fails to reach its claimed 512-bit security. We estimate it to be 379. Our team already posted this news on the pqc-forum yesterday.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/O46LALSXK4OQRHPTYMS4AMD7KAR4PX6L/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: VDOO: Vinegar-Diagonal-Oil-Oil", "algorithm": "VDOO", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/X2VGTA5L2EJJASOPF5TYJI2GAXDIO677/"}, {"msg_id": "OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD", "thread_id": "OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:15", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Weaver", "algorithm": "Weaver", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD/"}, {"msg_id": "TYYRYC5JRX3WVQTN3R66KOV2YWDA5EKP", "thread_id": "OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD", "position": 1, "level": 0, "author": "Zidi", "sender_time": "2026-09-24 01:04", "pub_utc": "2026-09-24 01:04 UTC", "body": "Following the report published at\nhttps://ngcc.dev/reports/kem-39.html\n, we have fixed the \"counter reuse\" issue in our reference implementation.\n\nAs stated in the report, our specification requires distinct counters, whereas our reference implementation failed to update the counter in `polyvec_invq`:\n\n```c\nvoid polyvec_invq(polyvec *v,\n                  const uint8_t seed[WEAVER_SYMBYTES],\n                  uint8_t nonce)\n```\n\nTo ensure that our reference implementation is consistent with our specification, we have changed this function to:\n\n```c\nvoid polyvec_invq(polyvec *v,\n                  const uint8_t seed[WEAVER_SYMBYTES],\n                  uint8_t *nonce)\n```\n\nThe relevant callers have been updated accordingly.\n\nWe would like to thank Markku-Juhani O. Saarinen for his review and timely feedback. Further analysis and comments, whether implementation-wise or algorithm-wise, are very welcome.\n\nThe complete updated project can be found on GitHub at\nhttps://github.com/Akutamatsu/weaverkem\n. We will update the submission package in due course.\n\nSincerely,\nThe WEAVER Team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/TYYRYC5JRX3WVQTN3R66KOV2YWDA5EKP/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Weaver", "algorithm": "Weaver", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD/"}, {"msg_id": "DJRC6VQK5TYNKMAJBD2MIKUH7EAZ4VO6", "thread_id": "OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD", "position": 2, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-24 03:48", "pub_utc": "2026-09-24 03:48 UTC", "body": "Hi, I believe there may be a mismatch between the decryption failure rate (DFR) analysis and the submitted WeaverKEM-256 implementation, which corresponds to Weaver-1024 in the specification. In particular, the high-layer BCH decoding step appears to be missing for the 256-bit security parameter set.\n\nTable 3 specifies a high-layer BCH code capable of correcting up to 4 errors for this parameter set, and reports a high-layer DFR of approximately 2^{-233} and an overall DFR of approximately 2^{-231}. The analysis in Theorem 3.7 appears to incorporate this error-correction capability when estimating the probability of high-layer decoding failure.\n\nHowever, in both the reference and optimized implementations, the WEAVER_MODE == 3 branch in msgenc.c does not appear to perform the corresponding high-layer BCH decoding. Specifically, the encoding function poly_frommsg calls encode_bch_high_nibbles to generate the high-layer redundancy, whereas the corresponding branch of poly_tomsg directly copies the high-layer hard-decision bits into the recovered message without calling decode_bch_high_nibbles. The latter function is implemented in bch_high.c, but does not appear to be invoked in this branch.\n\nIf this reading is correct, the implementation does not realize the error-correction capability assumed by the DFR analysis; therefore, the claimed DFR and performance figures for WeaverKEM-256 would not apply to the submitted implementation as written. The issue appears straightforward to fix by adding the missing high-layer BCH decoding step.\n\nThis analysis was prepared with AI assistance.\n\nBest,\nYijian", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/DJRC6VQK5TYNKMAJBD2MIKUH7EAZ4VO6/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: Weaver", "algorithm": "Weaver", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/OMIKZ7ZL4FLNNUIVD7CK7D4CGYJ5L3AD/"}, {"msg_id": "F2PXVI3WBEN5VAK7XPPPHV6MXXALAKFG", "thread_id": "F2PXVI3WBEN5VAK7XPPPHV6MXXALAKFG", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:35", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/F2PXVI3WBEN5VAK7XPPPHV6MXXALAKFG/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: YuanYang.DSA", "algorithm": "YuanYang.DSA", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/F2PXVI3WBEN5VAK7XPPPHV6MXXALAKFG/"}, {"msg_id": "JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW", "thread_id": "JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:15", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: YuanYang.KEM", "algorithm": "YuanYang.KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW/"}, {"msg_id": "FXRFQBH243BPG4XMEBKRPWCAQVGINRWF", "thread_id": "JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW", "position": 1, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-22 10:03", "pub_utc": "2026-09-22 10:03 UTC", "body": "Hi, just a small thing I noticed in yy_encrypt() in kem.c, ring_samp(s, e, &rng) samples both s and e, but it looks like e is never used afterward:\n```\nring_samp(s, e, &rng);\nyuanyang_mul_mod_xn_plus_1_ntt_big(output, h, s);\n......\nt += output[i];\n```\nSo, unless I’m missing something, the implementation currently seems to encrypt using roughly h*s + m*p^{-1} rather than h*s + e + m*p^{-1}. Algorithm 3 in the spec explicitly includes the e term, and the RLWE assumption also uses the distribution (a, a*s + e).\n\nI guess this is probably just a small implementation omission and should be easy to fix, e.g., by adding e[i] before the compression step. Just wanted to flag it.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/FXRFQBH243BPG4XMEBKRPWCAQVGINRWF/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: YuanYang.KEM", "algorithm": "YuanYang.KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/JL5OIS2NICCPYKQGQWMHLTWTGEDK2OCW/"}, {"msg_id": "36OAZIFVEG3DLVR3ZU3TWYDA6KXOKN3T", "thread_id": "36OAZIFVEG3DLVR3ZU3TWYDA6KXOKN3T", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:15", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/36OAZIFVEG3DLVR3ZU3TWYDA6KXOKN3T/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: ZEN", "algorithm": "ZEN", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/36OAZIFVEG3DLVR3ZU3TWYDA6KXOKN3T/"}, {"msg_id": "FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y", "thread_id": "FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y", "position": 0, "level": 0, "author": "mjos", "sender_time": "2026-09-23 07:42", "pub_utc": "2026-09-23 07:42 UTC", "body": "Dear PKC-Forum,\n\nA slightly delayed announcement; some of you have already discovered\nhttps://ngcc.dev/reports/index.html\n -- a website I set up to track vulnerabilities in NGCC submissions. I hope this helps \"deduplicate work\" by letting you easily check for already identified issues. I'm assigning a unique identifier ( \"xxx-yy-z\") for each vulnerability.\n\nScope: I'm emphasizing reproducibility, but \"probable\" indicators are fine as well. Purely theoretical issues, such as correctness issues in security proofs without direct security implications, are not really in scope for that site (though some are included).\n\nMost of the early findings were from me (with AI), but many newer findings have been harvested from these forums (and IACR ePrint, etc.) with appropriate credit. You can also submit directly by raising an issue (basically, copy-paste your report) at:\nhttps://github.com/ngcc-dev/ngcc-harness/issues\n\nCurrently, on day 3, 80 PKC and 24 hash vulnerabilities are tracked across 65 submissions. Of these 104 (PKC+hash) findings, 61 are implementation-only bugs, and 43 are design/specification findings.  I don't think it makes sense to push all of those here to this forum; live status information is available at\nhttps://ngcc.dev\n, and we will prepare an independent Round 1 report as well.\n\nHere's a summary of the most recent update (about an hour ago):\n- Update several findings to critical if a candidate asserts 512-bit security but does not meet it. In realistic terms, 128-, 256-, 512- bit complexity attacks are all \"infeasible\", so this is more of a matter of consistency. By common convention, any proposal that doesn't meet its security claim can be considered \"broken\" in the formal sense.\n- Four already-published IDs updated: hash-31-1 gains a confirmed witness; kem-17-4 gains Tianyuan Xie's scoped proof-gap analysis; kem-29-1gains LittleQ's independent confirmation; and sign-09-1  corrected from Critical forgery to Medium inert-salt/proof mismatch. Amoeba's Critical upgrade is already on the website from late yesterday.\n- Design or parameter findings: Iphe hash-12-1 (cross-profile relation); Viper kem-21-1 and NTRE kem-27-1 (2²⁵⁶ seed-search ceilings, not executed at full size); NIIKE kex-08-1 (raw-key distinguisher, not recovery); Octarine sign-16-1 (proof gap, not a forgery).\n- Memory safety or availability: C-Multi-UR-AG kem-10-1, DTRU kem-14-1, QIMEN-PIKE kem-31-1, SQIsignTriangle sign-27-1.\n- Low-impact error handling: AXIS hash-02-1, FEILIAN hash-10-1, TaiChi hash-25-1.\n\nGood luck to all!\n\nBest Regards,\n-markku\n\nDr. Markku-Juhani O. Saarinen <markku-juhani.saarinen@tuni.fi>", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "ngcc.dev -- tracking site for vulnerabilities", "algorithm": "（其他）", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y/"}, {"msg_id": "MFTVB4PE54ZG2R4V75MZJZZLP3RLFKZO", "thread_id": "FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y", "position": 1, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-24 08:32", "pub_utc": "2026-09-24 08:32 UTC", "body": "Dr. Markku-Juhani O. Saarinen,\n\nThank you for your efforts in tracking and validating vulnerabilities identified in NGCC submissions.\n\nWe warmly welcome researchers to share their analyses and findings in the PKC Forum, so that discussions can be conducted openly, promptly, and thoroughly by submitters and subscribers.\n\nBest regards,\nICCS", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/MFTVB4PE54ZG2R4V75MZJZZLP3RLFKZO/", "kind": "notice", "kind_rule": "组织方账号", "first_seen": "2026-09-25 05:49:30", "title": "ngcc.dev -- tracking site for vulnerabilities", "algorithm": "（其他）", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/FV4MR5CVVJ2Q7GJGNELWLZU75O3T6B6Y/"}], "drafts": [], "i18n": {"family": {"Aigis-Sig+": "Lattice (MLWE/MSIS, Fiat-Shamir)", "BiT": "Lattice", "CEDRUS+C": "Hash-based (stateless)", "CEDRUS-α": "Hash-based", "Chinith": "MPC/VOLE-in-the-head", "COMPASS-SIG": "Lattice", "CS": "Lattice (MLWE, Fiat-Shamir)", "DARTS": "Lattice", "DOVE": "Multivariate (Double OV)", "Facto-DSA": "Multivariate (cubic factorisation)", "FlexTree": "Hash-based (stateless)", "Galas": "Symmetric (MPC/VOLE-in-the-head)", "GreatWall": "MPC/VOLE-in-the-head", "Lynxer": "MPC/VOLE-in-the-head", "MORNING-ATLAS": "Lattice (MLWR, Fiat-Shamir)", "Octarine": "Lattice", "OPS": "Lattice", "Origami": "MPC-in-the-head", "Phoenix": "Hash-based", "Qing Luan": "Code-based", "ReSolveD-α": "Code-based / VOLE-in-the-head", "Rhyme": "Lattice", "Shuttle": "Lattice", "Sigurd": "VOLE-in-the-head", "SQIsign2D²": "Isogeny", "SQIsign2D-push½": "Isogeny", "SQIsignTriangle": "Isogeny", "SYDO": "Code-based / MPC-in-the-head", "Tins": "Multivariate (MPC-in-the-head)", "TRINE": "Multivariate / MPC-in-the-head", "TSUOV": "Multivariate", "UVW-Sig": "Multivariate (F3)", "VDOO": "Multivariate (UOV family)", "YuanYang.DSA": "Lattice (NTRU hash-and-sign)", "Aigis-Enc+": "Lattice (MLWE)", "Amoeba": "Lattice (RLWE)", "BAG-Loong": "Code-based (rank metric)", "BAG-Piglet": "Code-based (rank metric)", "BIKE-MLThre": "Code-based", "BRA": "Code-based (rank metric)", "BRQC": "Code-based (rank metric)", "BW-KEM": "Lattice", "CheetahKEM": "Lattice (Ring/Module-LWE)", "C-Multi-UR-AG": "Code-based (rank metric)", "COMPASS-KEM": "Lattice", "CTL": "Lattice", "DKEM": "Lattice", "DTRU": "Lattice (NTRU)", "FLIT": "Lattice", "HARE": "Code-based", "HEP-QC": "Code-based (quasi-cyclic)", "LoongKEM": "Lattice (LWE)", "Lore": "Lattice", "MAMBA-Frost": "Lattice", "MAMBA-Viper": "Lattice (Module-LWQ)", "Mithril": "Lattice", "Mito": "Code-based", "MORNING-Scabbard": "Lattice (MLWR)", "NEV": "Lattice", "NSS-HQC": "Code-based", "NTRE": "Lattice (NTRU)", "OAEP-NTRU": "Lattice", "Polar-KEM": "Lattice (polar-code defined)", "PolarLAC": "Lattice", "QIMEN-PIKE": "Isogeny", "QCTM": "Code-based (quasi-cyclic twisted McEliece)", "QUBE": "Code-based", "Rudraksh2": "Lattice", "Scloud+": "Lattice", "TRIKE": "Code-based", "TriQ-KEM": "Code-based", "UVW-KEM": "Code-based", "Weaver": "Lattice (MLWR)", "YuanYang.KEM": "Lattice (NTRU)", "ZEN": "Lattice", "ADKEX": "Lattice (AKE)", "AFS-KEX": "Lattice (MLWE AKE)", "CreTAKE": "Lattice (KEM + signature composite AKE)", "DKEX": "Lattice (AKE)", "Loom": "Lattice (hybrid KEM/signature AKE)", "MAMBA-NIKE": "Lattice (NIKE)", "NEV-AKE": "Lattice (NTRU/RLWE AKE)", "NIIKE": "Isogeny (NIKE)", "TriQ-KEX": "Code-based (AKE)"}, "findings": {"Aigis-Sig+-1": {"title": "Signature-verification implementation errors (ngcc.dev sign-01)", "detail": "The submitters report fixing the signature-verification implementation errors from ngcc.dev sign-01 and attached a new implementation and test-vector package to the forum post.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": ""}, "Aigis-Sig+-2": {"title": "API ignores key lengths (out-of-bounds read); polyvecl_uniform_gamma1 writes one extra polynomial during signing (stack overflow write)", "detail": "sig_sign/sig_verify ignore the sk/pk length arguments, so short buffers are unpacked at full size (out-of-bounds read, can crash); polyvecl_uniform_gamma1 calls polyz_unpack once more after its loop and writes v->vec[PARAM_L], in parameter sets I/II/III. Reproducible drivers are provided.", "by": "askus.li", "fix_note": ""}, "BiT-1": {"title": "Bimodal rejection sampling on the triangular distribution has potential security issues; submitters switch to a parabolic distribution", "detail": "During their own analysis the submitters found potential security issues in the bimodal rejection sampling on the triangular distribution and replaced it with a construction based on a parabolic distribution; the specification, security analysis and implementation are being revised and have not been released.", "by": "Submitters (self-reported)", "fix_note": "Revision direction announced; new documents and implementation pending"}, "CEDRUS+C-1": {"title": "Hypertree index forced to zero, so few-time signing keys are reused (ngcc.dev sign-03)", "detail": "A debugging leftover *tree = 0 in hash_sm3.c skips the tree index in the message digest; missing parentheses in SPX_BOTTOM_TREE_HEIGHT also give wrong index widths. All 8 parameter sets (SPX_D > 1) are affected.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": "Reference and optimized implementations fixed, test vectors updated, code published on GitHub"}, "CEDRUS-α-1": {"title": "FORC address truncated to 8 bits: each FORC instance's secret-key space collapses to at most 256 keys", "detail": "set_chain_addr() in address.c writes a 32-bit chain index into one byte, so indices ≥ 256 wrap; in 7 of 8 parameter sets all k trees share the same 256 secret keys, breaking the independence that the Chapter 3 security bound relies on. All 8 parameter sets, reference and optimized, are affected.", "by": "shiyuan", "fix_note": ""}, "CEDRUS-α-2": {"title": "CEDRUSALPHA-160s/f WOTS authenticates only the first 128 bits of the message", "detail": "WOTS_UINT_WORDS = SPX_N/8 is 2 for n = 20, so chain_lengths() reads only msg[0..15] and the last 4 bytes are unauthenticated; second-preimage security drops from 2^160 to 2^128 and collision security from 2^80 to 2^64. A standalone verification program is attached.", "by": "shiyuan", "fix_note": ""}, "CEDRUS-α-3": {"title": "Hash instantiation differs between specification and implementation", "detail": "The specification pads PK.seed to 64 bytes, compresses addresses to a 22-byte ADRS^c and passes PK.seed first to PRF; the implementation does none of these, so an implementation written from the specification does not interoperate with the reference code.", "by": "shiyuan", "fix_note": ""}, "CS-1": {"title": "Verification sees only the parity of the challenge polynomial, so sign bits add no entropy: forgery without signing queries", "detail": "c' enters verification only as c' mod 2, so the effective challenge space is the C(n,τ) supports rather than 2^τ·C(n,τ). Fixing a support and grinding over messages yields a zero-response forgery (UF-NMA); a second report shows the unbounded hint allows grinding within one signature, giving strong forgeries on pre-chosen messages. Classical cost 2^108.08 / 2^212.46 / 2^394.18 (claimed 128 / 256 / 512), halved under Grover. A fix requires distinguishing signs or an unsigned challenge with new parameters.", "by": "haojiang; Kris Kwiatkowski", "fix_note": ""}, "CS-2": {"title": "The compressed-key scheme leaks the secret low bits b₀; about 2^27 signatures recover b₀ and s₁", "detail": "In the full (public-key-compressed) scheme the verifier's reconstruction z₂′ contains a −c_r·b₀ term, and the hidden bimodal sign aggregate c_r correlates with the public z₀: estimating E[c_r] from (z₀, c) and regressing z₂′ gives b₀, and the cross moment of z₂′ and z₁ gives s₁. Using the submitted CS-128 reference implementation and a locally generated test key, 2^27 signatures (about 3.25 hours on 16 cores) recovered all 768 coefficients of both b₀ and s₁.", "by": "Yijian Liu", "fix_note": ""}, "Facto-DSA-1": {"title": "The hidden subspace K2 is found by algebraic solving; the structural estimate of §3.2.5 does not hold", "detail": "K2 = ker L2 is an n-dimensional linear subspace inside the public zero locus; any (n+1)-dimensional subspace meets it, so one Macaulay/XL solve gives a vector of K2, after which the specification's own Attack D chain recovers the key structure. In the specification's cost model: about 2^55 / 2^96 / 2^185 (claimed 128 / 256 / 512). Small-scale experiments at n = 5, 6, 7 recovered K2 in 9/9 runs; no forged signature was produced and the solving degree is extrapolated. The defect lies in the shape of the central map and cannot be fixed by parameters.", "by": "Kris Kwiatkowski", "fix_note": ""}, "Galas-1": {"title": "Reference key generation uses a fixed seed 0 (ngcc.dev sign-12)", "detail": "The submitters reply that §7.1 of the specification requires random key generation; the fixed seed is only for reproducible testing and does not affect security when a cryptographically secure random source is used as specified.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": "The submitters consider it a test setting and see no need to revise"}, "MORNING-ATLAS-1": {"title": "Mask sampler rej_gamma1m1() overwrites the previous value: two signatures recover the secret key s₁", "detail": "In the reference and optimized implementations of ATLAS-128/192/256, every mask polynomial satisfies y₂ᵢ = y₂ᵢ₊₁; subtracting adjacent coefficients removes the mask and gives noiseless linear equations in s₁. Two signatures give full rank, and s₁ was fully recovered on locally generated keys. ATLAS-512 uses a different sampling branch and is unaffected.", "by": "Yijian Liu (on behalf of Xianhui Lu)", "fix_note": ""}, "Origami-2": {"title": "The public key discloses the change of variables: practical universal forgery for every parameter set, no signing queries", "detail": "Origami publishes the change of variables Π_pub from the signable map G to the public map P; inverting it yields an easy system, so forging costs about as much as signing with the secret key. Pierre Pébereau released an implementation for Origami-128 (github.com/pi-r2/UnfoldOrigami) that adapts to all sets; the thread also relays the universal forgery announced by Jintai Ding and Hugo Louiso on pqc-forum: about 0.01 s for Origami-128 and 15 s for Origami-512 on one laptop core.", "by": "Pierre Pébereau; Jintai Ding and Hugo Louiso as relayed by PeigenLi", "fix_note": ""}, "Origami-1": {"title": "Choice of subalgebra K_ij conflicts with signature solving; after correction the 128-bit parameters give at most about 93 bits", "detail": "K_ji has only l_j degrees of freedom rather than l_j² dimensions, so many signatures reveal K_ji, and the blocks Z_j found during signing cannot lie in K_ji. The commenters suggest using the full matrix ring, but even then the 128-bit parameters give at most about 93 bits; other levels have similar problems.", "by": "PeigenLi", "fix_note": "The submitters clarify that Origami-128 claims 64-bit quantum (128-bit classical) security, acknowledge the forgery issue and say an updated algorithm will follow within days"}, "Tins-1": {"title": "Any single valid signature reveals the full secret witness, allowing forgeries on arbitrary messages", "detail": "Masking material is confined to the subfield GF(2^12), so p_mid is bitwise linear in the witness with public coefficients, and one signature (with the public key) determines (α, β). Verified end to end on Tins128/256/512 (9/9); on the official KATs, Tins256 witnesses were recovered and forged in 10/10 cases, and the forgeries are accepted by the unmodified official verifier.", "by": "ifeelok", "fix_note": ""}, "Tins-2": {"title": "Tins128 and Tins512 KATs do not verify with the package's own reference implementation", "detail": "Noticed by the commenters while running the attack; the code and KATs are out of sync.", "by": "ifeelok", "fix_note": ""}, "UVW-Sig-1": {"title": "sig_verify always returns 0 (valid), so every signature is accepted", "detail": "In all six implementations sig_verify computes the result with uvw_verify but then returns 0; the API defines 0 as valid and −1 as invalid.", "by": "LittleQ", "fix_note": ""}, "VDOO-1": {"title": "Level-5 parameters fall short of the claimed 512-bit security; estimated at about 379 bits", "detail": "The commenters say the analysis was posted on pqc-forum; the forum post gives only the conclusion.", "by": "PeigenLi", "fix_note": ""}, "Aigis-Enc+-1": {"title": "Two errors in the decryption implementation (ngcc.dev kem-01)", "detail": "The submitters report fixing them and attached a new implementation package to the forum post.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": ""}, "Amoeba-1": {"title": "FO re-encryption check compares only every fourth ciphertext byte, giving a plaintext-checking oracle and key recovery", "detail": "cmp() in src/backend/ccakem.c steps by i += 4, so Amoeba-576 compares only 262 of 1047 bytes. The commenters built a plaintext-checking oracle and recovered the secret keys of all 10 official Amoeba-576 KAT key pairs with about 3×10^4 decapsulation queries each. Changing to i++ fixes it.", "by": "JinnuoLi", "fix_note": ""}, "Amoeba-2": {"title": "Decryption failure rate omits detected 2-error rejections; the actual DFR is 44–90 bits higher", "detail": "§2.3.2 bounds the DFR by the probability of ≥ 3 errors only, but decoding explicitly rejects when exactly 2 errors occur, which decryption-failure attacks can also exploit. Under the submitters' own noise model, Amoeba-576 goes from 2^-130.27 to 2^-86.12, other sets by 70–90 bits. This affects the CCA bounds of §3.1.2 that depend on the DFR; not an attack by itself, fixable by reselecting parameters.", "by": "Yijian Liu", "fix_note": ""}, "CheetahKEM-1": {"title": "X^640+1 factors over the integers; projecting to the degree-128 quotient ring makes the decision problem very weak", "detail": "X^640+1 = (X^128+1)(X^512−X^384+…+1), with coprime factors mod q = 7681. Public data projects directly to the degree-128 ring (coefficients become CBD(5η)), where distinguishing suffices for the original problem: estimated uSVP cost about 2^27.7 for Cheetah128, 2^67.7 / 2^99.3 / 2^133.4 for Cheetah256/384/512 (specification: 2^159 / 2^307 / 2^426 / 2^541). Full key recovery also needs the remaining degree-512 component, not quantified but cheaper than the original degree-640 problem. Estimator-based; no instance given.", "by": "XuHaomeng", "fix_note": ""}, "CheetahKEM-2": {"title": "Correctness analysis omits public-key compression noise; the DFR is 44–124 bits higher", "detail": "The correctness derivation in §2.2 ignores the noise from public-key compression and decompression (Algorithms 15/16). Recomputed with the finite-distribution convolution of the Kyber DFR script: 2^-77.8 / 2^-51.5 / 2^-115.1 / 2^-199.0 for Cheetah128/256/384/512 (specification: 2^-129 / 2^-176 / 2^-189 / 2^-243); the parameters need to be reselected.", "by": "Yijian Liu", "fix_note": ""}, "CTL-1": {"title": "Keys derived deterministically from a 32-byte seed cap CTL-512's reachable public keys at 2^256 (ngcc.dev kem-12-1)", "detail": "The submitters acknowledge that CTL-512 therefore misses its claimed 512-bit classical security and plan a 64-byte seed with a matching expansion and private-key encoding.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": "Acknowledged by the submitters; revision in progress"}, "CTL-2": {"title": "48-byte shared secret and c₂ length handling inconsistent with the specification (ngcc.dev kem-12-2)", "detail": "The specification gives a 64-byte c₂ for CTL-512 while the implementation differs. Acknowledged by the submitters; implementation and specification will be revised together.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": ""}, "HEP-QC-1": {"title": "Column multiplicities of the public key leak the hidden code: EPC-P is distinguished in practice, T is recovered, residual search 2^84.1 / 2^131.0 / 2^198.7", "detail": "The inner Reed–Muller code is used with repetition, so column-value multiplicities of G′ form a fixed fingerprint that distinguishes keys from uniform with advantage close to 1 in one hash-table pass (< 50 ms), refuting EPC-P; the hidden blocks and the secret transformation T are then recovered exactly by sparse linear algebra (35/35 instances). The only remaining secret is the identification of frame blocks, with search spaces 2^84.1, 2^131.0 and 2^198.7 for HEP-QC-1/3/5 (claimed 128 / 192 / 256). The post also notes that the Game-2 step of Theorem 6.3.1 needs an unstated decisional assumption. PoC attached.", "by": "Tianyuan Xie (ifeelok)", "fix_note": ""}, "Lore-1": {"title": "x^768+1 of Lore-512 factors over the integers; quotient-ring projection lowers key recovery to about 451 bits classical / 391 quantum", "detail": "x^768+1 = (x^256+1)(x^512−x^256+1), coprime mod 1028, so the secret can be recovered separately in the degree-256 and degree-512 rings and recombined by CRT. Following §4.3 of the specification, full recovery costs about 2^451 classical and 2^391 quantum, about 129 / 119 bits below Table 2 (claimed 512-bit level). Suggested fix: a power-of-two cyclotomic or Φ_2304.", "by": "XuHaomeng", "fix_note": ""}, "Mithril-1": {"title": "Sign error in one term of Mithril.PKE.Dec", "detail": "“p/(2t) − q/(2p)” should read “q/(2p) − p/(2t)”. The latest design paper is IACR ePrint 2026/2078.", "by": "Submitters (self-reported, ARCANE Team)", "fix_note": ""}, "Polar-KEM-1": {"title": "The public key carries the transform seed in the clear, so the shared secret follows from (pk, ct) alone", "detail": "In all submitted implementations (PolarKEM-128/256/512, reference and optimized) the public key embeds the transform seed, so the public function polarkem_recover_message(pk, ct, μ) recovers the encapsulated message without the secret key, and the shared secret XOF(\"PolarKEM-SS-v1\"‖μ‖SM3(ct)) follows. The commenter considers it a design issue in the key/ciphertext structure; 60/60 trials across six builds succeeded, PoC available.", "by": "LittleQ", "fix_note": ""}, "Weaver-1": {"title": "polyvec_invq does not advance its counter, so sampling counters are reused (ngcc.dev kem-39)", "detail": "The specification requires distinct counters but the reference implementation did not update the nonce; the submitters now pass it by pointer and updated the callers.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": "Fixed code published on GitHub; the submission package will be updated later"}, "Weaver-2": {"title": "WeaverKEM-256 implementation lacks the high-layer BCH decoding, so the DFR analysis does not apply to it", "detail": "Table 3 specifies a high-layer BCH code correcting 4 errors for this set (Weaver-1024 in the specification), DFR about 2^-231; in the WEAVER_MODE == 3 branch the reference and optimized implementations call encode_bch_high_nibbles when encoding but copy the hard-decision bits when decoding, never calling decode_bch_high_nibbles.", "by": "Yijian Liu", "fix_note": ""}, "YuanYang.KEM-1": {"title": "Encryption samples the error e but never uses it", "detail": "In yy_encrypt(), ring_samp(s, e, &rng) produces e, but only h·s + m·p⁻¹ is computed, without the e term of Algorithm 3. The commenter believes it is an implementation omission.", "by": "Yijian Liu", "fix_note": ""}, "AFS-KEX-1": {"title": "Wrapper does not separate long-term and per-session key material (ngcc.dev)", "detail": "The submitters acknowledge that the wrapper generated ephemeral and composite key pairs at initialization; they have moved this into the per-session msg_a / msg_b procedures and will erase session secrets on completion or abort; the updated implementation is not yet released. They also posted a discussion of KEM-based versus signature-based authentication.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": "Revised by the submitters; new implementation not yet released"}, "CreTAKE-1": {"title": "Hash/XOF calls pass byte counts where bit counts are expected, reducing the ephemeral secret to 64 bits (ngcc.dev kex-03-1)", "detail": "The submitters confirm an implementation oversight; correcting the length arguments restores the specified behaviour without changing the protocol or parameters. It will be fixed, with regenerated test vectors, in the next permitted implementation update.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": ""}, "CreTAKE-2": {"title": "Final key derivation of K2S / S2K / S2S omits the signatures", "detail": "The submitters found a typographical omission: the final hash input should include the signatures to bind the session key to the full transcript; corrected formulas are given in the forum post.", "by": "Submitters (self-reported)", "fix_note": ""}, "NEV-AKE-1": {"title": "Identities set to zero when generating the KATs (ngcc.dev kex-07)", "detail": "The submitters report it fixed.", "by": "Markku-Juhani O. Saarinen (ngcc.dev, as cited in the submitters' forum response)", "fix_note": ""}}, "versions": {"Aigis-Sig+|v1.1": "Implementation revision: fixes the signature-verification errors from ngcc.dev sign-01 (implementation and test vectors attached)", "CEDRUS+C|v1.1": "Implementation revision: fixed hypertree/leaf index decoding, updated test vectors (GitHub: zhong-h/CEDRUSPLUSC-SM3)", "Aigis-Enc+|v1.1": "Implementation revision: fixes the two decryption errors from ngcc.dev kem-01 (implementation package attached)", "Mithril|v1.0 勘误": "Specification erratum: sign in PKE.Dec; design paper updated as ePrint 2026/2078", "Weaver|v1.1": "Implementation revision: fixed counter reuse in polyvec_invq (GitHub: Akutamatsu/weaverkem)", "CreTAKE|v1.0 勘误": "Specification erratum: signatures added to the final key derivation of K2S / S2K / S2S", "NEV-AKE|v1.1": "KAT revision: fixed zero identity setting"}, "summaries": {}, "highlights": {}, "definitions": {"levels": {"A": {"name": "Practical attack", "desc": "A practically executable attack on the full submitted scheme (specified parameters, official interface) — key recovery, signature forgery, plaintext or shared-secret recovery, or an IND-CPA/CCA distinguisher — with a concrete instance or a reproducible construction."}, "B": {"name": "Below claimed security", "desc": "An attack or cost estimate below the security strength claimed by the submitters, without a practically executed instance. Strength is always compared as classical attack cost against the claimed classical security level (quantum costs are only mentioned in the details). Estimates already in the practical range but without an instance are also B, noted in the detail."}, "C": {"name": "Structural finding", "desc": "Distinguishers, weak-key classes, errors in decryption-failure accounting, potential issues acknowledged by the submitters, and similar findings that do not directly refute a security claim."}}, "fix": {"open": {"name": "Awaiting response", "desc": "The submitters have not responded."}, "ack": {"name": "Acknowledged, not revised", "desc": "The submitters acknowledge the issue and have announced a direction but not yet released the revision, or consider it harmless."}, "disputed": {"name": "Disputed", "desc": "The submitters disagree with the conclusion."}, "claimed": {"name": "Revised", "desc": "The submitters have released a revision (erratum, new specification, implementation or KATs). Whether it is effective is recorded separately."}, "verified": {"name": "Revised, verified", "desc": "A review (analysis or testing) confirmed that the revision removes the issue."}, "failed": {"name": "Revision ineffective", "desc": "A review found that the revision does not remove the issue or introduces a new one."}}, "verify": {"rep": {"name": "Reproduced", "desc": "The maintainers reproduced the attack or values with the submitters' implementation."}, "ok": {"name": "Checked", "desc": "Confirmed against the specification and source code, or by independent computation."}, "part": {"name": "Partly reproduced", "desc": "The main claim holds; some parts could not be completed."}, "none": {"name": "Not verified", "desc": "Not independently checked; restated from the forum post."}}, "overall": "The security analysis status is determined by security issues only: the highest level (A > B > C) among security issues that are not yet removed. Findings whose fix is “Revised, verified” do not count; if the submitters have released revisions for all of them the status shows “Revised (formerly X)”. With no remaining security issue the status is “No security issue”; algorithms with no third-party comments or submitter updates on the forum are marked “No public analysis yet”. Specification issues are listed separately and not graded; implementation issues have their own column graded I1/I2/I3 and also do not affect the algorithm level. Strength is compared as classical cost against the claimed classical level.", "kinds": {"安全": {"name": "Security issue", "desc": "Findings on the design or specified parameters (hardness assumptions, parameter choice, the construction itself), graded A/B/C. The security analysis status depends only on these."}, "规范": {"name": "Specification issue", "desc": "Internal contradictions or typos in the specification, or mismatches between specification and implementation. Not graded."}, "实现": {"name": "Implementation issue", "desc": "Defects in the submitted implementation (reference/optimized code, API wrappers, KATs). They are removed by fixing the code and do not involve the design, so they do not count toward the security analysis status; they have their own column graded I1/I2/I3."}}, "impl_levels": {"I1": {"name": "Directly exploitable", "desc": "Directly exploitable in the submitted implementation: recovery of the secret or shared key, signature forgery, verification that always passes, collapsed key space, truncated secret entropy, etc."}, "I2": {"name": "Reduced margin", "desc": "A security impact that is not directly exploitable, or a deviation from the specification that affects security parameters (fewer authenticated bits, counter reuse, missing error correction, memory-safety bugs)."}, "I3": {"name": "Functional / consistency", "desc": "KATs inconsistent with the implementation, API or test-setting issues; no security impact."}}}}};

  const ID_ORDER = a => { const m = /^(sign|kem|kex)-(\d+)/.exec(a.id || ""); return m ? ({sign:0, kem:100, kex:200}[m[1]] + +m[2]) : 999; };
  function tinfo(m){

    a.nC = talk.filter(m => m.kind === "comment").length; a.nR = talk.filter(m => m.kind === "response").length;
    const last = talk[talk.length-1];

  function viewCandidates(){
    const t = T();
    const segs = [["all",t.all,algs.length],["A","A",acnt("A")],["B","B",acnt("B")],["P",t.ana.P,acnt("P")],["C","C",acnt("C")],["OK",t.ana.OK,acnt("OK")+acnt("NA")]];
    const tsegs = [["all",t.all,algs.length]].concat(TYPES.map(x => [x, typ(x), algs.filter(a => a.type === x).length]));
    const fsegs = [["all",t.all,algs.length],["pend",t.fstat.pend,algs.filter(a=>a.status==="pend").length],["ok",t.fstat.ok,algs.filter(a=>a.status==="ok").length],["none",t.fstat.none,algs.filter(a=>a.status==="none").length]];
    return `<section class="panel"><div class="panel-h"><h2>${t.tabs.candidates} <small id="shown"></small></h2>
      <div class="controls">
        <div class="seg" id="f-type">${tsegs.map(([k,l,n]) => `<button type="button" data-k="${esc(k)}" aria-pressed="${state.type===k}">${esc(l)}<span class="c">${n}</span></button>`).join("")}</div>
        <div class="seg" id="f-ana">${segs.map(([k,l,n]) => `<button type="button" data-k="${k}" aria-pressed="${state.ana===k}">${esc(l)}<span class="c">${n}</span></button>`).join("")}</div>
        <div class="seg" id="f-st">${fsegs.map(([k,l,n]) => `<button type="button" data-k="${k}" aria-pressed="${state.fstat===k}">${esc(l)}<span class="c">${n}</span></button>`).join("")}</div>
        <input type="search" id="q" placeholder="${esc(t.search)}" value="${esc(state.q)}" aria-label="${esc(t.search)}">
        <select id="sort" aria-label="sort">${Object.entries(t.sort).map(([k,v]) => `<option value="${k}" ${state.sort===k?"selected":""}>${esc(v)}</option>`).join("")}</select>
      </div></div>
      <div class="tbl-wrap"><table><thead><tr>${t.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="no-rows" hidden>${t.none}</div></div></section>`;
  }
  function renderRows(){
    const t = T(); const q = state.q.toLowerCase();
    let list = algs.filter(a => (state.ana === "all" || a.ana === state.ana || (state.ana === "OK" && a.ana === "NA")) &&
      (state.fstat === "all" || a.status === state.fstat) &&
      (state.type === "all" || a.type === state.type) &&
      (!q || [a.name, a.id, a.type, typ(a.type), a.family, fam(a), ...(a.aliases||[])].join(" ").toLowerCase().includes(q)));
    const by = {
      active:(x,y) => (y.status!=="none") - (x.status!=="none") || y.lastKey.localeCompare(x.lastKey) || x.name.localeCompare(y.name),
      comments:(x,y) => (y.nC+y.nR) - (x.nC+x.nR) || x.name.localeCompare(y.name),
      name:(x,y) => x.name.localeCompare(y.name,"en",{sensitivity:"base"}),
      ana:(x,y) => ANA_ORDER[x.ana] - ANA_ORDER[y.ana] || y.lastKey.localeCompare(x.lastKey) || x.name.localeCompare(y.name),
      id:(x,y) => ID_ORDER(x) - ID_ORDER(y) || x.name.localeCompare(y.name),
      impl:(x,y) => (({I1:3,I2:2,I3:1})[y.implLv]||0) - (({I1:3,I2:2,I3:1})[x.implLv]||0) || y.implOpen - x.implOpen || y.impl.length - x.impl.length || x.name.localeCompare(y.name) }[state.sort];
    list.sort(by);
    $("#shown").textContent = t.shown(list.length, algs.length);
    $("#no-rows").hidden = list.length > 0;
    $("#rows").innerHTML = list.map(a => {
      const talk = a.nC + a.nR > 0; const lm = a.last;
      const sub = a.nSpec ? `${t.spec} ${a.nSpec}` : "";
      return `<tr data-alg="${esc(a.name)}" tabindex="0">
        <td class="alg">${esc(a.name)}<span class="sub mono">${esc(a.id || "")}</span></td>
        <td>${tyTag(a)}</td>
        <td>${anaPill(a)}${sub ? `<span class="small">${esc(sub)}</span>` : ""}</td>
        <td>${implCell(a)}</td>
        <td><span class="ver">${a.versions.length > 1 ? `<span class="up">${esc(a.curVer)}</span> ↑` : esc(a.curVer)}</span></td>
        <td><span class="pill ${a.status}"><i class="dot ${a.status}"></i>${esc(t.fstat[a.status])}</span></td>
        <td><div class="cr"><span class="n num">${a.nC} / ${a.nR}</span>${bars(a)}</div></td>
        <td>${talk && lm ? `<span class="when">${esc(lm.t.label)}</span><span class="small">${esc(t.kind[lm.kind])} · ${esc(lm.author)}</span>` : `<span class="when" style="color:var(--muted)">${t.open} ${esc(lm ? lm.t.label : "")}</span>`}</td>
        <td><div class="mode" style="max-width:220px" title="${esc(fam(a))}">${esc(fam(a) || "—")}</div></td></tr>`;
    }).join("");
  }
  function viewForum(){
    const t = T();
    const acc = new Map();
    for (const m of talkAll){ const x = acc.get(m.author) || {c:0,r:0}; m.kind === "response" ? x.r++ : x.c++; acc.set(m.author, x); }
    const accs = [...acc.entries()].sort((a,b) => (b[1].c+b[1].r) - (a[1].c+a[1].r)); const mx = Math.max(1, ...accs.map(([,v]) => v.c+v.r));
    const names = [...new Set(talkAll.map(m => m.algorithm))].sort((a,b) => a.localeCompare(b));
    return `<div class="grid2"><section class="panel"><div class="panel-h"><h2>${t.tabs.forum} <small>${t.excerpt}</small></h2>
      <div class="controls"><div class="seg" id="f-kind">${[["all",t.forumAll],["comment",t.forumC],["response",t.forumR]].map(([k,l]) => `<button type="button" data-k="${k}" aria-pressed="${state.fkind===k}">${esc(l)}</button>`).join("")}</div>
      <select id="f-alg" aria-label="algorithm"><option value="all">${t.forumAlg}</option>${names.map(n => `<option ${state.falg===n?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
      <ul class="feed" id="feed"></ul></section>
      <div class="stack"><section class="panel"><div class="panel-h"><h2>${t.accounts} <small>${t.byCount}</small></h2></div>
        <ul class="who-list">${accs.map(([n,v]) => `<li><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="track"><i class="c" style="width:${v.c/mx*100}%"></i><i class="r" style="width:${v.r/mx*100}%"></i></span><span class="ct">${v.c+v.r}</span></li>`).join("")}</ul></section>
      ${others.length ? `<section class="panel"><div class="panel-h"><h2>${t.other}</h2></div><ul class="feed">${others.sort(cmp).reverse().map(feedItem).join("")}</ul></section>` : ""}</div></div>`;
  }
  function renderFeed(){
    const list = talkAll.filter(m => (state.fkind === "all" || m.kind === state.fkind) && (state.falg === "all" || m.algorithm === state.falg)).slice().reverse();
    $("#feed").innerHTML = list.map(m => feedItem({...m, body: m.body})).join("") || `<li><div></div><div class="empty">—</div></li>`;
  }
  function viewAbout(){
    const t = T(); const d = DEF(); const a = t.about;
    const dl = (obj, fmt) => `<dl>${Object.entries(obj || {}).map(([k,v]) => `<dt>${fmt(k,v)}</dt><dd>${esc(v.desc)}</dd>`).join("")}</dl>`;
    return `<section class="panel doc">
      <h3>${a.disclaimer}</h3><p>${esc(t.disclaimerText)}</p>
      <h3>${a.method}</h3><ul>${t.methodText.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <h3>${a.overall}</h3><p>${esc(d.overall || "")}</p>
      <h3>${a.kinds}</h3>${dl(d.kinds, (k,v) => `<span class="lv lv-K">${esc(v.name)}</span>`)}
      <h3>${a.levels}</h3>${dl(d.levels, (k,v) => `<span class="lv lv-${k}"><b>${k}</b>${esc(v.name)}</span>`)}
      <h3>${a.impls}</h3>${dl(d.impl_levels, (k,v) => `<span class="lv lv-${k}"><b>${k}</b>${esc(v.name)}</span>`)}
      <h3>${a.fixes}</h3>${dl(d.fix, (k,v) => `<span class="fx fx-${k}">${esc(v.name)}</span>`)}
      <h3>${a.verifies}</h3><p>${esc(t.card.vtip)}.</p>${dl(d.verify, (k,v) => esc(v.name))}
    </section>`;
  }

  // ---------- drawer
  function openAlg(name){
    const a = byAlg.get(name); if (!a) return; const t = T(); const c = t.card;
    const facts = [[c.facts.id, a.id],[c.facts.type, typ(a.type)],[c.facts.family, fam(a)]].filter(([,v]) => v);
    const srcLinks = ids => (ids || []).map(id => `<a href="${esc(MSGURL(id))}" target="_blank" rel="noopener">${esc(id.slice(0,8))} ↗</a>`).join(" ");
    const KORD = {"安全":0,"规范":1,"实现":2};
    const kindTag = f => f.kind === "实现" ? `<span class="lv lv-K">${esc(((DEF().kinds||{})["实现"]||{}).name || "实现")}</span>${f.impl_level ? iTag(f.impl_level) : ""}` : (f.kind && f.kind !== "安全") ? `<span class="lv lv-K">${esc(((d => (d.kinds||{})[f.kind]||{})(DEF())).name || f.kind)}</span>` : `<span class="lv lv-${esc(f.level)}"><b>${esc(f.level)}</b>${esc(lvName(f.level))}</span>`;
    const fs = [...a.findings].sort((x,y) => (KORD[x.kind||"安全"] - KORD[y.kind||"安全"]) || (RANK[y.level]||0) - (RANK[x.level]||0));
    const fHtml = fs.length ? `<ul class="fd">${fs.map(f => { const fx = f.fix || {}; const s = fT(f);
      return `<li><div class="t1">${kindTag(f)}<span class="ttl">${esc(s.title)}</span><span class="fx fx-${esc(st(f))}">${esc(fxName(st(f)))}${fx.version ? " · " + esc(fx.version) : ""}</span></div>
        ${s.detail ? `<p class="dt">${esc(s.detail)}</p>` : ""}${s.note ? `<p class="dt">${["claimed","verified","failed"].includes(st(f)) ? c.noteRev : c.noteResp}: ${esc(s.note)}</p>` : ""}
        <div class="src"><span>${c.src}: ${esc(s.by || "—")}</span>${srcLinks(f.msgs)}${fx.msgs ? `<span>${c.resp}</span>` + srcLinks(fx.msgs) : ""}${f.verify ? `<span class="vtag" title="${esc(c.vtip)}">${c.verify}: ${esc(vfName(f.verify))}</span>` : ""}</div></li>`; }).join("")}</ul>`
      : `<p class="vf" style="margin:0;color:var(--muted)">${a.ana === "NA" ? c.nofind.NA : c.nofind.x}</p>`;
    const docLi = (cat, text, url, sz) => `<li><span class="cat">${esc(cat)}</span><a href="${url}" target="_blank" rel="noopener" title="${esc(text)}">${esc(text)}</a>${sz ? `<span class="sz">${esc(sz)}</span>` : ""}</li>`;
    const usedAtt = new Set();
    const tl = a.versions.map((v, i) => {
      let ds = "";
      if (v.sub) ds = `<ul class="docs">${a.zip ? docLi("zip", c.zip.replace(" ↗",""), esc(encodeURI(a.zip)), "") : ""}${a.subDocs.map(d => docLi(L==="en" ? "PDF" : (d.category || "PDF"), (d.title || d.name) + ".pdf", href(d.path), fmtB(d.bytes))).join("")}</ul>`;
      else { const fd = a.forumDocs.filter(d => (v.msgs || []).includes(d.msg_id)); fd.forEach(d => usedAtt.add(d.msg_id + d.name));
        const lk = (v.links || []).map(l => docLi(L==="en" ? "link" : "链接", tx(l.label, l.label_en), esc(l.url), ""));
        if (fd.length || lk.length) ds = `<ul class="docs">${fd.map(d => docLi(L==="en"?"attachment":"论坛附件", d.name, esc(d.url), d.size || fmtB(d.bytes))).join("")}${lk.join("")}</ul>`; }
      const cur = i === a.versions.length - 1;
      return `<li class="${cur ? "cur" : ""}"><div class="vh"><b>${esc(v.v)}</b>${v.date ? `<span class="small" style="margin:0">${esc(v.date)}</span>` : ""}${cur ? `<span class="fx fx-claimed">${c.cur}</span>` : ""}${(v.msgs||[]).length ? `<span class="small" style="margin:0">${c.ann} ${srcLinks(v.msgs)}</span>` : ""}</div>
        <div class="vl">${esc(vLabel(a, v))}</div>${ds}</li>`;
    }).join("");
    const body = `<h4 class="sec-h">${c.info}</h4><dl class="facts">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${hl(a) ? `<h4 class="sec-h">${c.hl}<span class="vtag" title="${esc(c.vtip)}">${L==="en"?"maintainers' view":"维护方观点"}</span></h4><p class="hl">${esc(hl(a))}</p>` : ""}
      <h4 class="sec-h">${c.status}</h4><div class="stbox"><div class="st1">${anaPill(a)}<span>${esc(statusShort(a))}</span></div>${summary(a) ? `<p>${esc(summary(a))}</p>` : ""}</div>
      <h4 class="sec-h">${c.pub}<span class="small" style="margin:0">${c.counts(a.findings.length, a.nC, a.nR)}</span></h4>${fHtml}
      <h4 class="sec-h">${c.vers}</h4><ul class="tl">${tl}</ul>
      ${(r => r.length ? `<h4 class="sec-h">${c.fatt}</h4><ul class="docs">${r.map(d => `<li><span class="cat">${esc(t.kind[d.kind] || d.kind || "")} · ${esc(d.author || "")}</span><a href="${esc(d.url)}" target="_blank" rel="noopener" title="${esc(d.name)}">${esc(d.name)}</a><span class="sz">${esc(d.size || fmtB(d.bytes))}</span><a class="sz" href="${esc(d.msg_url)}" target="_blank" rel="noopener">${t.orig}</a></li>`).join("")}</ul>` : "")(a.forumDocs.filter(d => !usedAtt.has(d.msg_id + d.name)))}
      <h4 class="sec-h">${c.thread} (${a.msgs.length})${a.thread ? `<a href="${esc(a.thread)}" target="_blank" rel="noopener" style="font-weight:400;font-size:12px">${c.openThread}</a>` : ""}</h4>
      ${a.msgs.length ? a.msgs.map(m => `<article class="msg ${m.kind}"><div class="msg-h"><span class="kind ${m.kind}">${esc(t.kind[m.kind] || m.kind)}</span><b>${esc(m.author)}</b><span class="t">${esc(m.t.label)}</span><a class="lk" href="${esc(m.url)}" target="_blank" rel="noopener">${t.orig}</a></div>
        <div class="msg-body">${linkify(excerpt(m.body, 600))}</div></article>`).join("") : `<p style="color:var(--muted)">${c.noThread}</p>`}`;
    lastFocus = document.activeElement;
    $("#dr-title").textContent = a.name;
    $("#dr-status").innerHTML = `${tyTag(a)} ${anaPill(a)} <span class="ver" style="margin-left:6px">${esc(a.curVer)}</span> <span class="pill ${a.status}" style="margin-left:6px"><i class="dot ${a.status}"></i>${esc(t.fstat[a.status])}</span>`;
    $("#dr-body").innerHTML = body; $("#dr-body").scrollTop = 0;
    $("#scrim").hidden = false; $("#drawer").hidden = false; $("#dr-close").focus(); openName = a.name;
  }
  let lastFocus = null, openName = null;
  function closeDr(){ $("#scrim").hidden = true; $("#drawer").hidden = true; openName = null; if (lastFocus) lastFocus.focus(); }
  $("#dr-close").addEventListener("click", closeDr); $("#scrim").addEventListener("click", closeDr);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden) closeDr(); });

  // ---------- render
  function render(){
    const t = T();
    document.documentElement.lang = L === "zh" ? "zh-CN" : "en";
    $("#h1").textContent = t.title;
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
    $("#gen").textContent = `${t.gen} ${DATA.generated}`;
    const cnt = {candidates: algs.length, forum: talkAll.length};
    $("#tabs").innerHTML = TABS.map(k => `<button type="button" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${t.tabs[k]}${cnt[k] ? `<span class="c">${cnt[k]}</span>` : ""}</button>`).join("");
    const note = `<div class="note-bar"><span>ⓘ</span><span>${t.disclaimer}</span></div>`;
    $("#view").innerHTML = (state.tab === "overview" || state.tab === "about" ? note : "") +
      ({overview:viewOverview, candidates:viewCandidates, forum:viewForum, about:viewAbout})[state.tab]();
    if (state.tab === "candidates") renderRows();
    if (state.tab === "forum") renderFeed();
    $("#foot").innerHTML = `<span>${t.foot}</span><span><a href="${esc(DATA.source)}" target="_blank" rel="noopener">list.niccs.org.cn</a></span>`;
    if (openName) openAlg(openName);
  }
  function go(tab){ state.tab = tab; try{ history.replaceState(null, "", "#" + tab); }catch(e){} render(); window.scrollTo(0,0); }

  document.addEventListener("click", e => {
    const lb = e.target.closest(".lang button"); if (lb){ L = lb.dataset.lang; store.set("ngcc.lang", L); render(); return; }
    const tb = e.target.closest("[data-tab]"); if (tb){ e.preventDefault(); go(tb.dataset.tab); return; }
    const g = e.target.closest("[data-go]"); if (g){ const k = g.dataset.go; state.fstat = "all"; state.ana = "all";
      if (k === "pend") state.fstat = "pend"; else state.ana = k; go("candidates"); return; }
    const fa = e.target.closest("#f-ana button"); if (fa){ state.ana = fa.dataset.k; render(); return; }
    const fs = e.target.closest("#f-st button"); if (fs){ state.fstat = fs.dataset.k; render(); return; }
    const ft = e.target.closest("#f-type button"); if (ft){ state.type = ft.dataset.k; render(); return; }
    const fk = e.target.closest("#f-kind button"); if (fk){ state.fkind = fk.dataset.k; document.querySelectorAll("#f-kind button").forEach(b => b.setAttribute("aria-pressed", b === fk)); renderFeed(); return; }
    const al = e.target.closest("[data-alg]"); if (al && !e.target.closest("a")){ openAlg(al.dataset.alg); }
  });
  document.addEventListener("keydown", e => { const r = e.target.closest && e.target.closest("tr[data-alg]"); if (r && e.key === "Enter") openAlg(r.dataset.alg); });
  document.addEventListener("input", e => { if (e.target.id === "q"){ state.q = e.target.value.trim(); renderRows(); } });
  document.addEventListener("change", e => {
    if (e.target.id === "sort"){ state.sort = e.target.value; store.set("ngccpkc.sort", state.sort); renderRows(); }
    if (e.target.id === "f-alg"){ state.falg = e.target.value; renderFeed(); }
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== state.tab){ state.tab = h; render(); } });
  render();
})();
</script>

</body>
</html>

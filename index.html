"first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: DOVE", "algorithm": "DOVE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/PK36WEI2O5J6TBSBL5MRRDYPATRYYPIT/"}, {"msg_id": "7OIHLWTGECH3FYCUM3BEBJDAHMMLZRZK", "thread_id": "7OIHLWTGECH3FYCUM3BEBJDAHMMLZRZK", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:24", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/7OIHLWTGECH3FYCUM3BEBJDAHMMLZRZK/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: DTRU", "algorithm": "DTRU", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7OIHLWTGECH3FYCUM3BEBJDAHMMLZRZK/"}, {"msg_id": "H6SZDCUAWCTVQD7QOP7XDVHAHGWXHKHZ", "thread_id": "H6SZDCUAWCTVQD7QOP7XDVHAHGWXHKHZ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:24", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/H6SZDCUAWCTVQD7QOP7XDVHAHGWXHKHZ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: FLIT", "algorithm": "FLIT", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/H6SZDCUAWCTVQD7QOP7XDVHAHGWXHKHZ/"}, {"msg_id": "X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6", "thread_id": "X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:46", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Facto-DSA", "algorithm": "Facto-DSA", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6/"}, {"msg_id": "GG4GJJCDDS2JVZTLHR2KPN26BD5OXGBA", "thread_id": "X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6", "position": 1, "level": 0, "author": "kriskwiatkowski1", "sender_time": "2026-09-22 06:41", "pub_utc": "2026-09-22 06:41 UTC", "body": "**The structural security estimate in §3.2.5 is incorrect. `K2 = ker L2` is not\nfound by search, and the 160 / 272 / 512-bit \"one vector\" figures do not hold.**\n\n§3.2.5 correctly identifies `K2` as the critical hidden structure and notes that\n\"one vector in `K2` can reveal the whole zero subspace by public linear\nalgebra\". It then prices that vector as a random guess — \"`Pr[z ∈ K2 \\ {0}] ≈\nq^{-n}` … the classical cost of this structural search is thus `q^n`\" — and this\nis the only quantitative defence of the hidden subspace.\n\n`K2` is not an unstructured set of `q^n` points. It is an **`n`-dimensional\nlinear subspace contained in the zero locus of the public map**, with `n = r/2`,\nbecause `F(X, 0) = 0`. Since `n + (n+1) > 2n`, a random linear subspace `L` of\ndimension `n+1` meets `K2` in a line *with certainty*. Restricting the public\nsystem to `L` therefore gives `m` homogeneous cubics in `n+1` variables with a\nguaranteed `F_q`-rational solution — the point of `K2 ∩ L`. The search is\nreplaced by one Macaulay/XL solve in `n` variables.\n\nIn the specification's own cost model (§3.2.1, `C(vars+d, d)^3`) with the\nsolving degree `d = n+1` measured experimentally:\n\n| instance | claimed | §3.2.6 cheapest | §3.2.5 \"one vector\" | this attack |\n|---|---|---|---|---|\n| Facto-DSA-128 | 128 | 129 | 160 | ≈ 55 |\n| Facto-DSA-256 | 256 | 265 | 272 | ≈ 96 |\n| Facto-DSA-512 | 512 | 512 | 512 | ≈ 185 |\n\nFor Facto-DSA-512 the \"one vector\" row is tied as the cheapest listed attack, so\nstriking it lowers the claimed level directly.\n\n**Evidence.** We reimplemented Facto-DSA from the specification and confirmed at\nall three submitted parameter sets that `dim ker L2 = n` with `P` vanishing\nidentically on it (key sizes reproduce Table 2 exactly). The algebraic step was\nrun at n = 5, 6, 7 with three keys each: `K2` was recovered exactly — checked\nagainst the secret `L2` — in all nine runs, at solving degrees 6, 7, 8. The\nquotient dimension was exactly `2^n + 1` each time, reflecting a second\ncomponent `W = {Q(X) + R(Y) = 0}` of the zero locus that the specification does\nnot mention. Continuing along the submission's own Attack D chain (§3.2.2) then\nrecovered the input separation, the hidden quadratic space, the symmetriser and\nan equivalent triangular central map that inverts under Algorithm 7.\n\n**Limitations.** (i) `d = n+1` is extrapolated from n = 5, 6, 7, not proved.\n(ii) Only the `s = 1` shape (`m ≈ 2n`, that of Facto-DSA-256/-512) was reached;\nFacto-DSA-128 is less overdetermined, so its ≈55 should be read as \"far below\n128\" rather than a precise cost. (iii) No forged signature is emitted: the final\nrational-normal-curve/GRS identification was not re-implemented, though it is\nthe submitter's own tool (§3.2.2 Attack A step 3) and is used there to break the\nearlier variants.\n\n**Repair.** The defect is in the shape of the central map, not the parameters:\nany `(Q(X)+R(Y))·Y` construction forces a half-dimensional linear subspace into\nthe public zero locus. The `R(Y)` term added in §2.4 blocks the derivative route\nto `K1 = ker L1`; it does not affect `K2`.\n\nCryptanalysis:\n\nhttps://github.com/kriskwiatkowski/ngcc-harness/tree/main/sign-10/cryptanaly...", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/GG4GJJCDDS2JVZTLHR2KPN26BD5OXGBA/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Facto-DSA", "algorithm": "Facto-DSA", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/X63HQQDTUFPQQGA4DJAHSAISTNYZUVC6/"}, {"msg_id": "5DSK4DF2SIKI6RNI6NC5RYXOJG73DMAJ", "thread_id": "5DSK4DF2SIKI6RNI6NC5RYXOJG73DMAJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:46", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/5DSK4DF2SIKI6RNI6NC5RYXOJG73DMAJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: FlexTree", "algorithm": "FlexTree", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/5DSK4DF2SIKI6RNI6NC5RYXOJG73DMAJ/"}, {"msg_id": "3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY", "thread_id": "3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:46", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Galas Signature Scheme", "algorithm": "Galas", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY/"}, {"msg_id": "HEGWG6PROUQIHDTXIXONQGQMFWC6INE7", "thread_id": "3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY", "position": 1, "level": 0, "author": "Galas-Team", "sender_time": "2026-09-22 07:27", "pub_utc": "2026-09-22 07:27 UTC", "body": "We sincerely thank Markku-Juhani O. Saarinen for his careful feedback and analysis [1]. In response to his comment on randomness usage in key generation, we would like to clarify the following.\n\nIn symmetric-based signature schemes such as GALAS, the signing secret key is itself a symmetric encryption key, and its secrecy is therefore essential to the security of the scheme. Accordingly, Section 7.1 (Algorithm 19) of the GALAS specification requires\n that the secret key\nk\n and the public input\nx\n be randomly sampled, subject to the specified validity conditions. To ensure reproducibility of test instances, we deliberately fixed the default seed to 0 in the reference implementation. This deterministic\n setting is intended solely for testing purposes; it does not affect the security of GALAS, provided that keys are generated using a cryptographically secure random source, as required by the specification.\n\nWe welcome further analysis and comments from the community.\n\n[1] Markku-Juhani O. Saarinen,\n\nhttps://ngcc.dev/reports/sign-12.html\n.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/HEGWG6PROUQIHDTXIXONQGQMFWC6INE7/", "kind": "response", "kind_rule": "账号名含算法名", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Galas Signature Scheme", "algorithm": "Galas", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3FJV2IP2L5BFKAPR364ISD45Z7UJBJUY/"}, {"msg_id": "5IGQ6ZDNGTS7TSTFXE3PFVHHJL7BM2LJ", "thread_id": "5IGQ6ZDNGTS7TSTFXE3PFVHHJL7BM2LJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:46", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/5IGQ6ZDNGTS7TSTFXE3PFVHHJL7BM2LJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: GreatWall Signature Algorithm", "algorithm": "GreatWall", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/5IGQ6ZDNGTS7TSTFXE3PFVHHJL7BM2LJ/"}, {"msg_id": "2Q2SLLCRMEJ2FOLOTDPGM7IUUZKUPUKF", "thread_id": "2Q2SLLCRMEJ2FOLOTDPGM7IUUZKUPUKF", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:24", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/2Q2SLLCRMEJ2FOLOTDPGM7IUUZKUPUKF/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: HARE", "algorithm": "HARE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/2Q2SLLCRMEJ2FOLOTDPGM7IUUZKUPUKF/"}, {"msg_id": "2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU", "thread_id": "2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:23", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Hybrid Equivalent Punctured and Quasi-Cyclic", "algorithm": "HEP-QC", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU/"}, {"msg_id": "XQ3A3A3IGNRQDLEQ6BD73ENALBGSDEO6", "thread_id": "2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU", "position": 1, "level": 0, "author": "ifeelok", "sender_time": "2026-09-22 22:38", "pub_utc": "2026-09-22 14:38 UTC", "body": "Dear all,\nWe found that HEP-QC (submission kem-17, category KEM) has a structural weakness in its hidden-code layer: the secret equivalence structure can be recovered from the public key alone, and the EPC-P assumption on which the scheme's first security bound relies does not hold. All results below are verified on keys generated with the official reference implementation. The key findings are summarized below.\n1. Core Result\nThe public matrix G′ leaks the hidden code structure through column multiplicities. Because the inner Reed–Muller code is used with repetition, G′ contains n1 × 128 distinct column values each appearing exactly MULT times, plus 64 singleton columns — a rigid fingerprint that distinguishes HEP-QC instances from uniform matrices with advantage ≈ 1 in a single hash-table pass (< 50 ms). This breaks the EPC-P assumption outright.\nBuilding on the fingerprint, the n1 hidden 128-element blocks are recoverable as affine flats (35/35 instances), and the secret transformation T is recovered exactly by sparse linear algebra (35/35 instances, full column rank; 3.2 s for HEP-QC-1, up to 127 s for HEP-QC-7). A negative control with deliberately wrong block matchings yields inconsistent equation systems in 38/38 runs. An end-to-end break of a scaled-down toy instance (exact bit-wise T recovery, all 66,169 wrong matchings rejected) confirms the full pipeline.\n2. Residual Security\nAfter this recovery, the only remaining secret is the identification of the frame blocks, with search space P(n1, ks): 2^84.1 for HEP-QC-1 (claimed 128-bit), 2^131.0 for HEP-QC-3 (claimed 192-bit), 2^198.7 for HEP-QC-5 (claimed 256-bit). We can also show that no rank-based or linear fingerprint can reduce this search further.\n3. Proof-Level Issue\nIndependently of the attack, the Game-2 step of the specification's Theorem 6.3.1 (first bound) is not statistically justified: in Game 2 the term s·r2 + e is a biased sparse convolution, so the ciphertext distribution does depend on the challenge bit; closing the step requires a decisional-QCSD-type assumption that is not stated. Consequently, the IND-CPA security of HEP-QC rests entirely on the same 2/3-DQCSD-P assumptions as HQC — with public keys 127×–256× larger.\nAttached is a self-contained, dependency-free PoC (18 KB) that reproduces the EPC-P distinguishing attack in under a second, on the enclosed public key or on any freshly generated one (--pk mode).\nWe hope these results are useful to the evaluation process and welcome any feedback or correction.\nBest regards, Tianyuan Xie", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/XQ3A3A3IGNRQDLEQ6BD73ENALBGSDEO6/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Hybrid Equivalent Punctured and Quasi-Cyclic", "algorithm": "HEP-QC", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/2FLYI6DJUQ3YKJZXVGFFN4IQNPKXSHWU/"}, {"msg_id": "QD663UPHHV3JOP7IEQUTEESR4LCALIDJ", "thread_id": "QD663UPHHV3JOP7IEQUTEESR4LCALIDJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:13", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/QD663UPHHV3JOP7IEQUTEESR4LCALIDJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Loom", "algorithm": "Loom", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/QD663UPHHV3JOP7IEQUTEESR4LCALIDJ/"}, {"msg_id": "G7IDTLL5NJ46PSNDO6ZVKFN5L4LPRS7N", "thread_id": "G7IDTLL5NJ46PSNDO6ZVKFN5L4LPRS7N", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:23", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/G7IDTLL5NJ46PSNDO6ZVKFN5L4LPRS7N/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: LoongKEM", "algorithm": "LoongKEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/G7IDTLL5NJ46PSNDO6ZVKFN5L4LPRS7N/"}, {"msg_id": "37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X", "thread_id": "37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:22", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Lore", "algorithm": "Lore", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X/"}, {"msg_id": "US6X74OOCAN377LPXHUOJBHR7BSOQ3EB", "thread_id": "37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X", "position": 1, "level": 0, "author": "XuHaomeng", "sender_time": "2026-09-23 14:56", "pub_utc": "2026-09-23 14:56 UTC", "body": "We found that the defining polynomial of the ring \\(R=\\mathbb{Z}_{1028}[x]/(x^{768}+1)\\) used by Lore-512 is reducible over the integers, with the following factorization:\n$$x^{768}+1=(x^{256}+1)(x^{512}-x^{256}+1).$$\n\nThe two factors are coprime modulo 1028. Therefore, the original ring can be decomposed into two quotient rings of degrees 256 and 512, respectively. This structure gives rise to a reduction attack based on quotient-ring projections, referred to as a “subfield attack”: the public-key relation can be projected into two lower-dimensional quotient rings, while the secret and rounding errors remain small. The security evaluation in the original paper, which considers only generic lattice attacks based on the full ring dimension, should therefore be supplemented with an analysis of this structural attack.\n\nDuring key recovery, the secret components in the two quotient rings can be solved independently and then reconstructed into the original secret through the Chinese Remainder Theorem (CRT). The module rank of Lore-512 is 3, so the corresponding secret scalar dimensions of the two components are:\n$$3 \\times 256=768$$\nand\n$$3 \\times 512=1536,$$\n\nrespectively. Under the independent-coefficient approximation described below, the recovery cost of the degree-256 component is significantly lower than that of the degree-512 component, while the CRT recombination introduces only polynomial overhead. Therefore, the total key-recovery cost is\n$$T_{KR}=T_{256}+T_{512}+T_{CRT}.$$\n\nSince the degree-512 component dominates the cost, its recovery complexity can be used to represent the exponential complexity of the complete recovery process.\n\nWe follow the unstructured LWE estimation approach described in Section 4.3 of the original paper and adopt the GSA geometric approximation. Classical costs are evaluated using the MATZOV model, while quantum costs are evaluated using the ChaLoy21 model. The two quotient-ring components are modeled separately, with the projected marginal variances used under the independent-coefficient approximation. We retain the total modulus \\(1028\\) and accordingly adjust the secret dimensions, the number of available relations, and the variances of the secret and error distributions. After numerically evaluating both the primal-uSVP and non-hybrid primal-BDD recovery approaches, we take the lower-cost result between the two. The results are shown below. All costs in the table are expressed as base-2 logarithms of the computational work factor.\n\n| Evaluation target                                             | Secret scalar dimension | Classical cost (bits) |  Quantum cost (bits) |\n| ------------------------------------------------------------- | ----------------------: | --------------------: | -------------------: |\n| Original Table 2 reported value: full ring                    |                    2304 |                580.32 |               509.47 |\n| Baseline of the two primal approaches in this work: full ring |                    2304 |                630.48 |               554.09 |\n| Degree-256 quotient-ring component                            |                     768 |                233.65 |               191.47 |\n| Degree-512 quotient-ring component                            |                    1536 |                451.35 |               390.90 |\n| Recovery of both components followed by CRT recombination     |                    2304 |  approximately 451.35 | approximately 390.90 |\n\nUnder this evaluation framework, the ring structure reduces the estimated cost of full secret recovery to approximately 451 bits for classical attacks and 391 bits for quantum attacks, which are about 129 bits and 119 bits lower than the values reported in the original paper, respectively. Compared with the baseline evaluation of the two primal approaches under the same methodology, the reduction is also substantial. This demonstrates that a security estimate based solely on the original full-ring dimension overlooks a significantly lower-cost structural recovery path. Therefore, the original security-strength claim of Lore-512 should be reconsidered by incorporating this attack.\n\nWe recommend modifying the underlying ring construction by adopting a power-of-two cyclotomic polynomial of the form\n$$x^{2^r}+1,$$\nor, while retaining degree 768, using the degree-768 cyclotomic polynomial\n$$\\Phi_{2304}(x)=x^{768}-x^{384}+1.$$\n\nBoth choices are irreducible over the integers and eliminate the quotient-ring projection attack channel arising directly from integer factorization of the defining polynomial. After modification, the security strength and decryption correctness should still be reevaluated based on the actual modulus, module rank, and sampling distributions.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/US6X74OOCAN377LPXHUOJBHR7BSOQ3EB/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:37:39", "title": "Round1: Public Comment: Lore", "algorithm": "Lore", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/37LSSFEFLBIAAXOMJXYRFAAYG5DRNK4X/"}, {"msg_id": "A3VK2RZD6XCJB5YBKZN2OSDSYMSVFUL6", "thread_id": "A3VK2RZD6XCJB5YBKZN2OSDSYMSVFUL6", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:45", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/A3VK2RZD6XCJB5YBKZN2OSDSYMSVFUL6/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Lynxer", "algorithm": "Lynxer", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/A3VK2RZD6XCJB5YBKZN2OSDSYMSVFUL6/"}, {"msg_id": "DZASROHH4W6G64UKMRCCQJGQEUHQO4TC", "thread_id": "DZASROHH4W6G64UKMRCCQJGQEUHQO4TC", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:22", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/DZASROHH4W6G64UKMRCCQJGQEUHQO4TC/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MAMBA-Frost", "algorithm": "MAMBA-Frost", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/DZASROHH4W6G64UKMRCCQJGQEUHQO4TC/"}, {"msg_id": "75NMUIOPYDJXY5WRYIBQ6FET6Z57UMPG", "thread_id": "75NMUIOPYDJXY5WRYIBQ6FET6Z57UMPG", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:13", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/75NMUIOPYDJXY5WRYIBQ6FET6Z57UMPG/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MAMBA-NIKE", "algorithm": "MAMBA-NIKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/75NMUIOPYDJXY5WRYIBQ6FET6Z57UMPG/"}, {"msg_id": "GVM4FAYEOQ7SAF5BDM6SKPLOTA547A5X", "thread_id": "GVM4FAYEOQ7SAF5BDM6SKPLOTA547A5X", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:22", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/GVM4FAYEOQ7SAF5BDM6SKPLOTA547A5X/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MAMBA-Viper", "algorithm": "MAMBA-Viper", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/GVM4FAYEOQ7SAF5BDM6SKPLOTA547A5X/"}, {"msg_id": "WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U", "thread_id": "WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:44", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MORNING-ATLAS", "algorithm": "MORNING-ATLAS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U/"}, {"msg_id": "L5UNKA72RZ2TBTCKZYIVJ5KFDU6XTWFB", "thread_id": "WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U", "position": 1, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-23 08:46", "pub_utc": "2026-09-23 08:46 UTC", "body": "Hi, we found an issue in the submitted implementations of ATLAS-128, ATLAS-192, and ATLAS-256.\n\nIn both the Reference and Optimized implementations, rej_gamma1m1() decodes two 20-bit values from 5 bytes, but the second assignment overwrites the first value stored in t. Both accepted coefficients are then written using this same value of t. As a result, every sampled masking polynomial satisfies y₂ᵢ = y₂ᵢ₊₁. The ATLAS-512 implementations use a separate 3-byte sampling branch and are unaffected by this issue.\n\nFor a valid signature, z = y + c·s₁ in Z_q[x]/(x^N + 1). Subtracting adjacent coefficients therefore eliminates the mask exactly: z₂ᵢ − z₂ᵢ₊₁ = (c·s₁)₂ᵢ − (c·s₁)₂ᵢ₊₁. These are public, noiseless linear equations in the secret key s₁.\n\nWe compiled the submitted reference code and generated valid signatures using locally generated test keys. With two signatures, the stacked linear systems had full column rank and recovered every coefficient of s₁ exactly: 6 polynomials for ATLAS-128, 10 for ATLAS-192, and 7 for ATLAS-256. The recovered values also satisfied the equations derived from two additional signatures, with zero integer residuals. This demonstrates a concrete recovery of s₁.\n\nThe immediate fix is to retain the first 20-bit value in t, decode the second value into t2, and apply the rejection test and output assignment independently to each value.\n\nThis analysis was prepared with AI assistance. The source behavior and key recovery were independently checked by compiling the submitted C code and using locally generated test signatures.\n\nBest,\nYijian (on behalf of Xianhui Lu)", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/L5UNKA72RZ2TBTCKZYIVJ5KFDU6XTWFB/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MORNING-ATLAS", "algorithm": "MORNING-ATLAS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/WOOBB3WCRHGVXKSTYQBTVMTW6HKPMX2U/"}, {"msg_id": "4KFYAFY5ZWKVT2D47LSNZP2LKIHBGPV7", "thread_id": "4KFYAFY5ZWKVT2D47LSNZP2LKIHBGPV7", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:21", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/4KFYAFY5ZWKVT2D47LSNZP2LKIHBGPV7/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: MORNING-Scabbard", "algorithm": "MORNING-Scabbard", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/4KFYAFY5ZWKVT2D47LSNZP2LKIHBGPV7/"}, {"msg_id": "Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO", "thread_id": "Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:22", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Mithril", "algorithm": "Mithril", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO/"}, {"msg_id": "UHIZACEJZNSFKFHTOIVXXSCCU6BVDF6Q", "thread_id": "Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO", "position": 1, "level": 0, "author": "RocWang", "sender_time": "2026-09-22 01:05", "pub_utc": null, "body": "Hi all,\n\nWe would like to report an erratum in the Mithril specification.\n\nIn Mithril.PKE.Dec, the term\n“p/(2t) - q/(2p)”\nshould be\n“q/(2p) - p/(2t)”.\n\nThe latest version of the Mithril and Octarine design paper is available on IACR ePrint:\n\nhttps://eprint.iacr.org/2026/2078\n\nMore comprehensive documentation and implementation code will also be made available on our forthcoming ARCANE websites:\n\nhttps://soc.ucas.ac.cn/index.php/zh/ARCANE\n\nhttps://www.pq-arcane.org\n\nWe welcome comments, feedback, and independent analysis.\n\nBest regards,\nThe ARCANE Team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/UHIZACEJZNSFKFHTOIVXXSCCU6BVDF6Q/", "kind": "response", "kind_rule": "config.responders 指定", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Mithril", "algorithm": "Mithril", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/Z26K5NHQNMT4NHBNWZT7G6IZVVRCCZKO/"}, {"msg_id": "NPRY7XDT2ABEJK5GBZS53L4FW7VDZYMZ", "thread_id": "NPRY7XDT 5V", "position": 1, "level": 0, "author": "RunqingXu", "sender_time": "2026-09-22 11:14", "pub_utc": "2026-09-22 03:14 UTC", "body": "Dear all,\n\nWe have fixed the zero-identity setting issue in the generation of the KAT files reported by Markku-Juhani O. Saarinen at https://ngcc.dev/reports/kex-07.html.\nWe sincerely thank Markku-Juhani O. Saarinen for his prompt feedback and thorough analysis.\n\nWe welcome further analysis and comments from the community.\n\nBest regards,\nThe NEV-AKE Team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/PFXL57I3TX6SVEHBKQAIEDJIFJLUP242/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: NEV-AKE", "algorithm": "NEV-AKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/VIYUCIMGK6I63JRWXBAM6FJ7U2XLGB5V/"}, {"msg_id": "6WRSHMUQOXTR62HBG3HEUHZEIYAIROLO", "thread_id": "6WRSHMUQOXTR62HBG3HEUHZEIYAIROLO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:08", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/6WRSHMUQOXTR62HBG3HEUHZEIYAIROLO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: NIIKE", "algorithm": "NIIKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/6WRSHMUQOXTR62HBG3HEUHZEIYAIROLO/"}, {"msg_id": "P63ZUXHRI7QQZJ3YC6QXJYUXNGF5MMCO", "thread_id": "P63ZUXHRI7QQZJ3YC6QXJYUXNGF5MMCO", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:20", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/P63ZUXHRI7QQZJ3YC6QXJYUXNGF5MMCO/", "kind": "call", "kind_rule": "组织方开帖", "first_seen" 方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: OPS Digital Signature Algorithm", "algorithm": "OPS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/PPO3KFSJJPUVKQEVPCPOP3A3IL2DRHOQ/"}, {"msg_id": "J32MD6K6AUGKHVUOZX6M4OJHWNPNCLWQ", "thread_id": "J32MD6K6AUGKHVUOZX6M4OJHWNPNCLWQ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:44", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/J32MD6K6AUGKHVUOZX6M4OJHWNPNCLWQ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Octarine", "algorithm": "Octarine", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/J32MD6K6AUGKHVUOZX6M4OJHWNPNCLWQ/"}, {"msg_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "thread_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:44", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Origami", "algorithm": "Origami", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/"}, {"msg_id": "7LD2222NOYVSL3KXW4UQCLPHMU7JFKQW", "thread_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "position": 1, "level": 0, "author": "PeigenLi", "sender_time": "2026-09-22 13:48", "pub_utc": "2026-09-22 13:48 UTC", "body": "Based on our understanding of Origami, we have identified the following issues:\n\nIn the signature space, choosing K_ij as the subalgebra conflicts with both the way the signature size is ultimately computed and the method for solving for the signature.\n\nBecause each K_ji has only l_j dimensions, hiding the subalgebra K_ji is ineffective, even though this is what the designer intends: when a public–private key pair is used to generate signatures, we obtain a large number of elements in the space K_ij, from which K_ji can easily be recovered.\n\nSecond, in the signing process, we solve for W_j by solving linear equations, but in the end each block of Z_j recovered through \\rho is supposed to lie in K_ji. This is impossible, and the reason is again that K_ji has only l_j degrees of freedom, not the l_j^2 dimensions claimed by the designer.\n\nFor the computation of the signature size and the signature-solving process to be sound, K_ji should therefore be abandoned and the matrix ring should be used directly.\n\nUnfortunately, although this makes the signature scheme more coherent, it still poses security risks. Our team analyzed the 128-bit parameters and found that the actual complexity is at most 93 bits. Similar problems exist for the parameters at other security levels.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/7LD2222NOYVSL3KXW4UQCLPHMU7JFKQW/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Origami", "algorithm": "Origami", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/"}, {"msg_id": "UDPVTMF6PCXSDEAGVE2IWZSBUKVMNVNW", "thread_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "position": 2, "level": 1, "author": "Song-Anxiao", "sender_time": "2026-09-24 05:31", "pub_utc": "2026-09-24 05:31 UTC", "body": "Hi PeigenLi:\n\n     Could you clarify whether the “128-bit parameters” you analyzed refer to Origami-128?\nIf so, our claimed quantum security strength for Origami-128 is 64 bits, assuming 128-bit classical security under the standard Grover model, as shown in Table 14 of \"A Security Strength Statement for Origami Submission\".\n    Regarding the other issue, we agree with your analysis. We  acknowledge the existence of the only signature-forgery attack. Accordingly, we will provide an updated secure algorithm within the next few days.\n\nThank You!", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/UDPVTMF6PCXSDEAGVE2IWZSBUKVMNVNW/", "kind": "response", "kind_rule": "config.responders 指定", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: Origami", "algorithm": "Origami", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/"}, {"msg_id": "YDMWWEJFJHV4TKUBP4Y53I3CTZJHC3JQ", "thread_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "position": 3, "level": 2, "author": "PeigenLi", "sender_time": "2026-09-24 08:38", "pub_utc": "2026-09-24 08:38 UTC", "body": "Hi Anxiao,\n\n     Jintai Ding and Hugo Louiso have already announced on pqc-forum@list.gov.cn that signatures can be forged within seconds this morning. They have found a universal forgery against Origami (NGCC round-1 candidate sign-18). Given only a public key, an attacker can sign any message of their choice, with no signing queries. In practice a forgery takes about 0.01 s for Origami-128 and about 15 s for Origami-512 on a single laptop core, roughly the cost of one verification at each level.\n\nThey should be releasing their code soon. Our understanding of Origami is that you want it to be like Rainbow, but you expose too much secret information in your public keys. This is a problem with the structure itself, not something caused by your parameters, because parameters at other levels have similar issues as well.\n\nBest wishes!\n\nPeigen Li", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/YDMWWEJFJHV4TKUBP4Y53I3CTZJHC3JQ/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: Origami", "algorithm": "Origami", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/"}, {"msg_id": "HTZTMJ42AUXCWEDA3AURP4ZOEGSGSV4Z", "thread_id": "7Z47WGTALXYFJS5YRRGDL65NJUG3CU56", "position": 4, "level": 0, "author": "PierrePebereau", "sender_time": "2026-09-24 09:22", "pub_utc": "2026-09-24 09:22 UTC", "body": "The Origami scheme discloses the change of variables from the signable map G to the public map P, which is noted Pi_pub.\nInverting it can thus be done by an attacker and yields a system that is easy to solve: essentially the same complexity as signing a message with the secret key.\nThis is a practical forgery attack on any parameter set.\nMy implementation is targeted for Origami-128 but can be adapted to all parameter sets.\nThe code is available at\nhttps://github.com/pi-r2/UnfoldOrigami\n.\n\nPierre Pébereau", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/HTZTMJ42AUXCWEDA3AURP4ZOEGSGSV4Z/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: Origami", "algorithm": "Origami", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/7Z47WGTALXYFJS5YRRGDL65NJUG3CU56/"}, {"msg_id": "M3XAI6VRCGWEXYF5YOYXWH25JFDYAWVZ", "thread_id": "M3XAI6VRCGWEXYF5YOYXWH25JFDYAWVZ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:43", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/M3XAI6VRCGWEXYF5YOYXWH25JFDYAWVZ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Phoenix", "algorithm": "Phoenix", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/M3XAI6VRCGWEXYF5YOYXWH25JFDYAWVZ/"}, {"msg_id": "SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ", "thread_id": "SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:19", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Polar-KEM", "algorithm": "Polar-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ/"}, {"msg_id": "AK5EF3YMTS3ND3WAA4DH3VYX5OHQLFGT", "thread_id": "SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ", "position": 1, "level": 0, "author": "LittleQ", "sender_time": "2026-09-22 00:42", "pub_utc": null, "body": "PolarKEM: shared secret recoverable from (pk, ct) alone\n\nIn all submitted C implementations (PolarKEM-128/256/512, reference and optimized), the public key embeds the transform seed in the clear, so the public function polarkem_recover_message(pk, ct, mu) recovers the encapsulated message without any secret. Since a valid ciphertext's shared secret is just XOF(\"PolarKEM-SS-v1\" || mu || SM3(ct)), anyone observing (pk, ct) recomputes it exactly — the only secret in sk is the rejection seed z, which is irrelevant for valid ciphertexts. This fully breaks key confidentiality of the implementation; it is a design issue in the key/ciphertext structure. Verified dynamically: 60/60 trials across all six builds recovered the exact shared secret (PoC available).\n\n#include <errno.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#include \"auxfunc.h\"\nPolarKEM: shared secret recoverable from (pk, ct) alone\n\nIn all submitted C implementations (PolarKEM-128/256/512, reference and optimized), the public key embeds the transform seed in the clear, so the public function polarkem_recover_message(pk, ct, mu) recovers the encapsulated message without any secret. Since a valid ciphertext's shared secret is just XOF(\"PolarKEM-SS-v1\" || mu || SM3(ct)), anyone observing (pk, ct) recomputes it exactly — the only secret in sk is the rejection seed z, which is irrelevant for valid ciphertexts. This fully breaks key confidentiality of the implementation; it is a design issue in the key/ciphertext structure. Verified dynamically: 60/60 trials across all six builds recovered the exact shared secret (PoC available).\n\n#include <errno.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#include \"auxfunc.h\"\n#include \"polarkem_core.h\"\n#include \"polarkem_ct.h\"\n\n#ifdef PROBE_OPTIMIZED\n#define IMPLEMENTATION_NAME \"optimized\"\n#else\n#define IMPLEMENTATION_NAME \"reference\"\n#endif\n\nstatic int recover_public_secret(const unsigned char pk[POLARKEM_PK_BYTES],\n                                 const unsigned char ct[POLARKEM_CT_BYTES],\n                                 unsigned char ss[POLARKEM_SS_BYTES])\n{\n    static const unsigned char domain[] = \"PolarKEM-SS-v1\";\n    unsigned char mu[POLARKEM_MESSAGE_BYTES];\n    unsigned char digest[32];\n    unsigned char input[(sizeof(domain) - 1u) + POLARKEM_MESSAGE_BYTES + 32u];\n\n#ifdef PROBE_OPTIMIZED\n    if (polarkem_recover_message(mu, pk, ct) != 0) {\n#else\n    if (polarkem_recover_message(pk, ct, mu) != 0) {\n#endif\n        return -1;\n    }\n    if (sm3hash(256, ct, (unsigned long long)POLARKEM_CT_BYTES * 8ull,\n                digest) != 0) {\n        return -1;\n    }\n    memcpy(input, domain, sizeof(domain) - 1u);\n    memcpy(input + sizeof(domain) - 1u, mu, sizeof(mu));\n    memcpy(input + sizeof(domain) - 1u + sizeof(mu), digest, sizeof(digest));\n    return pseudoXOF((unsigned long long)POLARKEM_SS_BYTES * 8ull,\n                     input, (unsigned long long)sizeof(input) * 8ull, ss);\n}\n\nint main(int argc, char **argv)\n{\n    DRNG_ctx drng;\n    unsigned char seed[64];\n    unsigned char pk[POLARKEM_PK_BYTES];\n    unsigned char sk[POLARKEM_SK_BYTES];\n    unsigned char ct[POLARKEM_CT_BYTES];\n    unsigned char encapsulated[POLARKEM_SS_BYTES];\n    unsigned char recovered[POLARKEM_SS_BYTES];\n    unsigned char decapsulated[POLARKEM_SS_BYTES];\n    unsigned long trials = 3;\n    unsigned long trial;\n    size_t i;\n\n    if (argc > 2) {\n        fprintf(stderr, \"usage: %s [trials (1..1000)]\\n\", argv[0]);\n        return 2;\n    }\n    if (argc == 2) {\n        char *end;\n\n        errno = 0;\n        trials = strtoul(argv[1], &end, 10);\n        if (errno != 0 || end == argv[1] || *end != '\\0' ||\n            trials < 1 || trials > 1000) {\n            fprintf(stderr, \"trials must be an integer from 1 to 1000\\n\");\n            return 2;\n        }\n    }\n\n    for (i = 0; i < sizeof(seed); ++i) {\n        seed[i] = (unsigned char)(i * 17u + 3u);\n    }\n    if (init_random_number(&drng, seed, sizeof(seed)) != 0) {\n        fprintf(stderr, \"DRNG initialization failed\\n\");\n        return 1;\n    }\n\n    for (trial = 0; trial < trials; ++trial) {\n        if (polarkem_keygen(pk, sk, &drng) != 0 ||\n            polarkem_enc(pk, encapsulated, ct, &drng) != 0) {\n            fprintf(stderr, \"keygen/encapsulation failed at trial %lu\\n\", trial);\n            return 1;\n        }\n        if (recover_public_secret(pk, ct, recovered) != 0) {\n            fprintf(stderr, \"public recovery failed at trial %lu\\n\", trial);\n            return 1;\n        }\n        if (polarkem_dec(sk, ct, decapsulated) != 0 ||\n            memcmp(encapsulated, decapsulated, POLARKEM_SS_BYTES) != 0) {\n            fprintf(stderr, \"control decapsulation failed at trial %lu\\n\", trial);\n            return 1;\n        }\n        if (memcmp(encapsulated, recovered, POLARKEM_SS_BYTES) != 0) {\n            fprintf(stderr, \"publicly recovered secret differs at trial %lu\\n\", trial);\n            return 1;\n        }\n        if (trial == 0) {\n            printf(\"%s %s first recovered ss: \", POLARKEM_INSTANCE_NAME,\n                   IMPLEMENTATION_NAME);\n            for (i = 0; i < POLARKEM_SS_BYTES; ++i) {\n                printf(\"%02x\", recovered[i]);\n            }\n            putchar('\\n');\n        }\n    }\n\n    printf(\"%s %s: %lu/%lu matched using pk + ct only\\n\",\n           POLARKEM_INSTANCE_NAME, IMPLEMENTATION_NAME, trials, trials);\n    return 0;\n}\nshow more\nshow less", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/AK5EF3YMTS3ND3WAA4DH3VYX5OHQLFGT/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Polar-KEM", "algorithm": "Polar-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/SUWKT64BKLBIPDQMHPOBL3FDM4MRPVBJ/"}, {"msg_id": "VWVCIBQ3M7NQOWU25P7SY3XK3PCAJT4X", "thread_id": "VWVCIBQ3M7NQOWU25P7SY3XK3PCAJT4X", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:19", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/VWVCIBQ3M7NQOWU25P7SY3XK3PCAJT4X/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: PolarLAC", "algorithm": "PolarLAC", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/VWVCIBQ3M7NQOWU25P7SY3XK3PCAJT4X/"}, {"msg_id": "BKERBYXMUT27H3ZUTLBHCM7YJB5KVGZI", "thread_id": "BKERBYXMUT27H3ZUTLBHCM7YJB5KVGZI", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:18", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/BKERBYXMUT27H3ZUTLBHCM7YJB5KVGZI/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Quasi-Cyclic Tw

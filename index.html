es/list/pkcforum@list.niccs.org.cn/message/LA7GLQRH3VS64ISSPP6BPZ6QR75PAOVA/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: BRQC", "algorithm": "BRQC", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/LA7GLQRH3VS64ISSPP6BPZ6QR75PAOVA/"}, {"msg_id": "WBK2RG2XR5VZVITNS53TVFJDBGER7T7P", "thread_id": "WBK2RG2XR5VZVITNS53TVFJDBGER7T7P", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:26", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/WBK2RG2XR5VZVITNS53TVFJDBGER7T7P/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: BW-KEM", "algorithm": "BW-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/WBK2RG2XR5VZVITNS53TVFJDBGER7T7P/"}, {"msg_id": "U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY", "thread_id": "U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:50", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: BIT", "algorithm": "BiT", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY/"}, {"msg_id": "XNS2SJQ4CUQDWP3IF6AQAMGAYSL5GQ3D", "thread_id": "U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY", "position": 1, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-22 00:26", "pub_utc": null, "body": "Update on the sampling mechanism of BiT\n\nDuring our continued security analysis of BiT, we identified potential security issues associated with the bimodal rejection sampling on the triangular distribution.\n\nWe have therefore revised this component and replaced it with a construction based on a parabolic distribution. The modification is localized to the sampling mechanism and does not affect the overall framework or the main design structure of BiT.\n\nWe are currently revising the specification, security analysis, and implementation to reflect this change. Updated documentation and related materials will be released subsequently.\n\nWe welcome further analysis and comments from the community.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/XNS2SJQ4CUQDWP3IF6AQAMGAYSL5GQ3D/", "kind": "response", "kind_rule": "config.message_overrides 指定", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: BIT", "algorithm": "BiT", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/U7FSJZ6KONWY36MQDOVDDB7IHHORNAJY/"}, {"msg_id": "CDFH64HLL4OC7ABIDEASAHDTDQI4O3RU", "thread_id": "CDFH64HLL4OC7ABIDEASAHDTDQI4O3RU", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:25", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/CDFH64HLL4OC7ABIDEASAHDTDQI4O3RU/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: C-Multi-UR-AG", "algorithm": "C-Multi-UR-AG", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/CDFH64HLL4OC7ABIDEASAHDTDQI4O3RU/"}, {"msg_id": "UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD", "thread_id": "UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:50", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.\nThe algorithm's name is presented in Latex format.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^+$C", "algorithm": "CEDRUS+C", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD/"}, {"msg_id": "DGLHBHCEFFVRVX335CUGVWEZGRYW6D4O", "thread_id": "UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD", "position": 1, "level": 0, "author": "qinzhen", "sender_time": "2026-09-22 07:25", "pub_utc": "2026-09-22 07:25 UTC", "body": "We became aware of the implementation issues in our CEDRUS+C submission through the report published on\nhttps://ngcc.dev/reports/sign-03.html\n. We sincerely thank Markku-Juhani O. Saarinen for his careful analysis and for bringing these issues to our attention. We have reviewed the findings and corrected the affected implementations.\n\nThe original index-processing code in hash_sm3.c contained the following:\n\n*tree = 0;\nbufp += SPX_TREE_BYTES;\n\n*leaf_idx = bytes_to_ull(bufp, SPX_LEAF_BYTES);\n*leaf_idx &= (~(uint32_t)0) >> (32 - SPX_LEAF_BITS);\n\nThe unconditional assignment *tree = 0 was introduced temporarily during debugging and was inadvertently left in the submitted implementation. As a result, the tree-index bytes in the message digest were skipped rather than decoded.\n\nThe corrected index-processing code is:\n\n#if SPX_D == 1\n    *tree = 0;\n#else\n    *tree = bytes_to_ull(bufp, SPX_TREE_BYTES);\n    *tree &= (~(uint64_t)0) >> (64 - SPX_TREE_BITS);\n#endif\nbufp += SPX_TREE_BYTES;\n\n*leaf_idx = (uint32_t)bytes_to_ull(bufp, SPX_LEAF_BYTES);\n*leaf_idx &= (~(uint32_t)0) >> (32 - SPX_LEAF_BITS);\n\nThis follows the single-layer/multilayer distinction used in the SPHINCS+ reference implementation, expressed here as a compile-time conditional. All eight submitted CEDRUS+C parameter sets have SPX_D > 1, so their tree indices are now decoded from the message digest.\n\nWe have also corrected the missing parentheses in SPX_BOTTOM_TREE_HEIGHT and the associated index-width definitions. In accordance with the CEDRUS+C specification, the tree index retains h − h₀ bits and the leaf index retains h₀ bits, where h₀ denotes the bottom-layer tree height.\n\nThese corrections have been applied to both the reference and optimized implementations for all eight parameter sets. We have updated the test vectors and verified the corrected implementations through regression tests, signing and verification tests, and cross-implementation consistency checks. The changes restore the indexing behavior specified in the original design without altering the algorithm parameters.\n\nThe complete updated project is available on GitHub:\nhttps://github.com/zhong-h/CEDRUSPLUSC-SM3\n.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/DGLHBHCEFFVRVX335CUGVWEZGRYW6D4O/", "kind": "response", "kind_rule": "config.responders 指定", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^+$C", "algorithm": "CEDRUS+C", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/UFWXT6DHJ56SDI6DD3NJ6JK2PFIXCMXD/"}, {"msg_id": "QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ", "thread_id": "QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:49", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.\nThe algorithm's name is presented in Latex format.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^{\\alpha}$", "algorithm": "CEDRUS-α", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ/"}, {"msg_id": "S5GGRLD7YZQQRH2VPPYET2GWYTHFWKXR", "thread_id": "QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ", "position": 1, "level": 0, "author": "shiyuan", "sender_time": "2026-09-22 15:26", "pub_utc": "2026-09-22 07:26 UTC", "body": "Public Comment on CEDRUS^{\\alpha} (sign-04): 32-Bit Message Truncation in WOTS for CEDRUSALPHA-160\n\nTarget Algorithm: CEDRUS^{\\alpha} (sign-04)\nTarget Implementations: Reference_Implementation and Optimized_Implementation for CEDRUSALPHA-160s and CEDRUSALPHA-160f\nClassification: Implementation Defect / Cryptographic Security Reduction\nAffected Files: wots.c (Lines 27, 159-163)\n\n======================================================================\n1. Executive Summary\n======================================================================\nIn the submitted reference and optimized implementations of CEDRUS^{\\alpha} for parameter sets CEDRUSALPHA-160s and CEDRUSALPHA-160f (n = 20 bytes / 160 bits), an integer division in wots.c leads to the silent discarding of the final 4 bytes (32 bits) of any message passed to WOTS+.\n\nSpecifically, `#define WOTS_UINT_WORDS (SPX_N / 8)` evaluates to `20 / 8 = 2` (16 bytes). Consequently, chain_lengths() only ingests msg[0..15], leaving msg[16..19] completely unauthenticated and ignored by the signature verification logic. In the context of the hypertree, intermediate XMSS and FORC roots authenticated via WOTS can have their last 4 bytes altered arbitrarily with zero effect on signature validity, reducing the second-preimage security from 2^160 to 2^128 and collision security from 2^80 to 2^64.\n\n======================================================================\n2. Root Cause Analysis\n======================================================================\nIn wots.c:\n\n    // Line 27:\n    #define WOTS_UINT_WORDS (SPX_N / 8)\n\n    // Line 29:\n    typedef uint64_t wots_uint_t[WOTS_UINT_WORDS];\n\nWhen n = 20 (as in CEDRUSALPHA-160s and 160f):\n* `SPX_N / 8` performs C integer division, resulting in 2.\n* `wots_uint_t` is defined as uint64_t[2], accommodating only 2 * 8 = 16 bytes.\n\nIn the function chain_lengths():\n\n    // Lines 154-166 in wots.c:\n    void chain_lengths(unsigned int *lengths, const unsigned char *msg)\n    {\n        wots_uint_t m;\n\n        wots_uint_set0(&m);\n        for (int i = 0; i < SPX_N/8; i++)\n        {\n            m[i] = bytes_to_ull(msg+i*8, 8);\n        }\n\n        encode(lengths, &m, SPX_WOTS_LEN);\n    }\n\nBecause `i < SPX_N / 8` only iterates for i in {0, 1}, it reads msg[0..7] into m[0] and msg[8..15] into m[1].\nBytes msg[16..19] are never loaded into m and are completely ignored.\n\n======================================================================\n3. Discrepancy with the Algorithm Specification\n======================================================================\nAccording to the official algorithm specification (Algorithm specifications.pdf):\n* Section 1.1.2 & Algorithm 1 (toInt):\n  The function toInt(X) takes an n-byte string and interprets it as an unsigned integer base-256 over all n bytes:\n  toInt(X) = \\sum_{i=0}^{n-1} X[i] * 256^{n-1-i}\n* Section 1.3 & Algorithms 6, 7:\n  chain_lengths is specified to convert the full n-byte message into base-w coefficients using the full n-byte value.\n\nFor n = 20, the specification requires encoding a 160-bit integer. However, the C implementation only converts a 128-bit integer.\n\n======================================================================\n4. Security and Cryptographic Impact\n======================================================================\n1. Hypertree Integrity Compromise:\n   In SPHINCS+/CEDRUS^{\\alpha}, WOTS+ is used to sign:\n   - The root of the FORC few-time signature scheme.\n   - The root of child XMSS trees in upper hypertree layers.\n   Since WOTS+ ignores bytes 16..19 of the root being signed, an attacker can modify the last 32 bits of any child tree root or FORC root to any arbitrary value. The WOTS signature remains perfectly valid for the modified root.\n\n2. Degradation of Security Strength:\n   - Second-Preimage Resistance: Dropped from 2^160 to 2^128 (reduction factor of 2^32 approx 4.29 * 10^9).\n   - Classical Collision Resistance: Dropped from 2^80 to 2^64 (reduction factor of 2^16 = 65,536).\n   This puts the collision security of CEDRUSALPHA-160 well below the accepted security margins for Category 1 primitives.\n\n3. Why KAT (Known Answer Tests) Passed:\n   Both wots_sign() and wots_pk_from_sig() depend on the identical chain_lengths() implementation. Consequently, signer and verifier both consistently ignore the last 4 bytes, yielding matching KAT outputs despite the underlying cryptographic truncation.\n\n======================================================================\n5. Proposed Fix\n======================================================================\n1. Define WOTS_UINT_WORDS using ceiling division:\n   #define WOTS_UINT_WORDS ((SPX_N + 7) / 8)\n\n2. Update chain_lengths() to load the remaining bytes:\n   for (int i = 0; i < WOTS_UINT_WORDS; i++) {\n       unsigned int rem = SPX_N - i * 8;\n       unsigned int chunk = rem >= 8 ? 8 : rem;\n       m[i] = bytes_to_ull(msg + i * 8, chunk);\n   }\n\nThe reproducers and patch are attached:\n- verify_standalone.c: Minimal standalone zero-dependency test.\n- verify_in_tree.c: In-tree test for Reference_Implementation/CEDRUSALPHA-160s/.\n- wots_truncation_fix.patch: Unified diff patch.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/S5GGRLD7YZQQRH2VPPYET2GWYTHFWKXR/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^{\\alpha}$", "algorithm": "CEDRUS-α", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ/"}, {"msg_id": "DZLVOKPTO2KZTN76AGZ2SST2T5ZCIUB7", "thread_id": "QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ", "position": 2, "level": 0, "author": "shiyuan", "sender_time": "2026-09-22 18:24", "pub_utc": "2026-09-22 10:24 UTC", "body": "Public Comment on CEDRUS-alpha (sign-04): Catastrophic FORC Secret Key Space Collapse via 8-Bit Address Truncation\n\nTarget Algorithm: CEDRUS-alpha (sign-04)\nTarget Implementations: All 8 parameter sets (CEDRUSALPHA-160s/f, 256s/f, 384s/f, 512s/f) across both Reference_Implementation and Optimized_Implementation (16 configurations in total)\nClassification: Severe Implementation Defect / Cryptographic Key Space Collapse / Specification-Implementation Inconsistency\nAffected Files: address.c (lines 79-82), sm3_offsets.h (line 14), fors.c (lines 52, 122, 182)\n\n====================================================================\n1. Executive Summary\n====================================================================\n\nIn all reference and optimized implementations of the CEDRUS-alpha signature scheme submitted to the National Cryptographic Contest (NGCC / PKC), a silent 8-bit integer truncation bug exists in the address generation logic for the FORC (Forest of Random Chains) few-time signature component.\n\nSpecifically, in address.c, the function set_chain_addr() assigns a 32-bit uint32_t chain index to an 8-bit unsigned char array element (addr[27]). Consequently, any chain or leaf index exceeding 255 is truncated modulo 256 (chain & 0xFF).\n\nThis truncation causes:\n1. Intra-Tree Collapse: Within each FORC tree, leaf indices j and j + 256*m produce 100% bit-for-bit identical PRF addresses, identical secret keys, and identical Merkle leaf hashes.\n2. Inter-Tree Collapse: In 7 out of 8 parameter sets, the tree leaf capacity 2^a is a multiple of 256. Therefore, the tree offset idx_offset = i * 2^a = 0 (mod 256). As a result, all k trees in a FORC instance share the exact same 256 secret keys.\n3. Catastrophic Key Space Reduction: The intended FORC secret key space of k * 2^a keys collapses down to at most 256 unique secret keys in every single parameter set (a reduction factor of up to 1504x in CEDRUSALPHA-512s).\n4. Invalidation of the Security Proof: The concrete security bound and reduction stated in Chapter 3 (Equation 3.2, page 45 of the specification) relies strictly on the mutual independence of the k trees and their k * 2^a distinct secret keys. Under this defect, an attacker observing fewer than 100 signatures can recover 100% of all secret keys in a given FORC instance via the standard Coupon Collector's process.\n\nDespite this fatal reduction, official Known Answer Tests (KAT) pass completely because both signing (fors_sign, fors_gen_leafx1) and verification (fors_pk_from_sig) share the identical truncated address calculation.\n\n====================================================================\n2. Root Cause Analysis\n====================================================================\n\nIn CEDRUS-alpha, FORC introduces Winternitz-style chains to FORS leaves. To uniquely identify each chain, the global leaf index addr_idx = indices[i] + idx_offset is passed to set_chain_addr().\n\nIn address.c (lines 79-82):\nvoid set_chain_addr(uint32_t addr[8], uint32_t chain)\n{\n    ((unsigned char *)addr)[SPX_OFFSET_CHAIN_ADDR] = chain;\n}\n\nIn sm3_offsets.h (line 14):\n#define SPX_OFFSET_CHAIN_ADDR 27\n\nIn fors.c (lines 52-55, 121-123):\n// fors_gen_leafx1:\nset_chain_addr(fors_leaf_addr, addr_idx);\nset_hash_addr(fors_leaf_addr, 0);\nset_type(fors_leaf_addr, SPX_ADDR_TYPE_FORSPRF);\nfors_gen_sk(leaf, sk_seed, fors_leaf_addr);\n\n// fors_sign:\nset_hash_addr(fors_leaf_addr, 0);\nset_chain_addr(fors_leaf_addr, indices[i] + idx_offset);//???\n\nThe Mechanism of Failure:\n1. SPX_OFFSET_CHAIN_ADDR is index 27, pointing to a single 1-byte storage cell inherited from the classic SPHINCS+ WOTS+ implementation (where w <= 256).\n2. In C, assigning uint32_t chain to ((unsigned char *)addr)[27] truncates chain to its least significant 8 bits (chain & 0xFF). The remaining 24 bits are discarded.\n3. In fors.c line 122, the author explicitly added a \"//???\" comment, confirming uncertainty regarding whether set_chain_addr was suitable for multi-tree indexing.\n4. During secret key derivation, prf_addr() computes sk = SM3(sk_seed || addr). Because addr is completely identical for any two inputs c1 = c2 (mod 256), the PRF outputs identical secret keys.\n5. During leaf node computation, thash() computes the FORC hash chain using the same truncated addr. Thus, the Merkle tree leaf hashes also collide identically.\n\n====================================================================\n3. Discrepancy with Algorithm Specification\n====================================================================\n\nAccording to the official CEDRUS-alpha specification (Algorithm specifications.pdf):\n\n- Section 1.5 (Address Scheme, Pages 18 & 20):\n  \"The structure of an ADRS conforms to word boundaries, with each word being 4 bytes long and the values of the data fields in ADRS are encoded as unsigned integers.\"\n  Figure 1.8 (FORC Secret Key Generation Address) and Figure 1.9 (FORC Hash Chain Address) explicitly define:\n    Word 4: addrType (4 bytes)\n    Word 5: keyPairAddr (4 bytes)\n    Word 6: chainAddr (4 bytes)\n    Word 7: hashAddr (4 bytes)\n  Page 20 explicitly defines the domain of chainAddr:\n    chainAddr in {0, ..., k * 2^a - 1}\n\nThe implementation violates the specification: instead of writing a 32-bit integer into Word 6 (bytes 24-27), the code writes an 8-bit integer into byte 27, causing catastrophic modular reduction.\n\n====================================================================\n4. Quantitative Impact Across All Parameter Sets\n====================================================================\n\nFor any parameter set where the tree size 2^a is divisible by 256, the tree offset satisfies:\n  idx_offset = i * 2^a = 0 (mod 256) for all i in [0, k-1]\n\nThis means that tree indices are completely erased, and every tree in the FORC instance draws its leaves from the exact same 256 keys.\n\nParameter Set        Height a  Leaves/Tree (2^a)  Trees k  Spec Unique Keys  Actual Unique Keys  Collapse Ratio\n-----------------------------------------------------------------------------------------------------------\nCEDRUSALPHA-160s        10          1,024           16          16,384              256              64.0x (2^6)\nCEDRUSALPHA-160f         7            128           28           3,584              256              14.0x\nCEDRUSALPHA-256s        12          4,096           23          94,208              256             368.0x\nCEDRUSALPHA-256f         8            256           45          11,520              256              45.0x\nCEDRUSALPHA-384s        12          4,096           38         155,648              256             608.0x\nCEDRUSALPHA-384f        10          1,024           51          52,224              256             204.0x\nCEDRUSALPHA-512s        13          8,192           47         385,024              256            1504.0x\nCEDRUSALPHA-512f        10          1,024           66          67,584              256             264.0x\n\n====================================================================\n5. Cryptographic Consequences\n====================================================================\n\n1. Total Failure of Security Reduction (Equation 3.2)\nOn page 45 of the specification, the probability of forging a FORC instance after q signature queries is claimed to be:\n  p_Succ_FTS(q) = (1 - (1 - (1/2^a) * ((w'+1)/(2w')))^q)^k\nThis formula strictly assumes that an adversary must independently hit k distinct secret values across k independent trees. Because the implementation collapses all k trees into a shared pool of 256 keys, this independence assumption is completely violated.\n\n2. Secret Key Recovery via Coupon Collector's Process\nIn each signature, k FORC chain values are published:\n- In CEDRUSALPHA-160s, each signature reveals up to 16 keys from the 256 pool. By the classic coupon collector's expectation (E[T] ~ 256 ln 256 ~ 1422 draws), an attacker observing only ~88 signatures on the same FORC instance will observe the entire secret key set!\n- In CEDRUSALPHA-512f (k = 66), only ~22 signatures are required to completely compromise the entire secret key set of that FORC instance.\n\n3. False Assurance from Known Answer Tests (KAT)\nThe official KAT vectors gave zero warning of this defect because fors_pk_from_sig() executes the identical set_chain_addr() truncation as fors_sign(). The verifier reconstructs the collapsed leaf and checks it against the collapsed tree root.\n\n====================================================================\n6. Empirical Verification\n====================================================================\n\nVerified using GCC on CEDRUSALPHA-160s:\n\nLeaf Position                Derived Secret Key (SM3 PRF)\n------------------------------------------------------------------------------------\nTree 0, Leaf 0   (idx 0)     e5224076a5bed3be2472a37f918f082a74023f69\nTree 0, Leaf 256 (idx 256)   e5224076a5bed3be2472a37f918f082a74023f69\nTree 0, Leaf 512 (idx 512)   e5224076a5bed3be2472a37f918f082a74023f69\nTree 1, Leaf 0   (idx 1024)  e5224076a5bed3be2472a37f918f082a74023f69\nTree 2, Leaf 0   (idx 2048)  e5224076a5bed3be2472a37f918f082a74023f69\nTree 15,Leaf 768 (idx 16128) e5224076a5bed3be2472a37f918f082a74023f69\n\nLeaf Position                Derived Merkle Leaf Hash (FORC Chain)\n------------------------------------------------------------------------------------\nTree 0, Leaf 0   (idx 0)     fa4de0206b9aab4191aebecd3298617a5bb9378b\nTree 0, Leaf 256 (idx 256)   fa4de0206b9aab4191aebecd3298617a5bb9378b\nTree 0, Leaf 512 (idx 512)   fa4de0206b9aab4191aebecd3298617a5bb9378b\nTree 1, Leaf 0   (idx 1024)  fa4de0206b9aab4191aebecd3298617a5bb9378b\nTree 2, Leaf 0   (idx 2048)  fa4de0206b9aab4191aebecd3298617a5bb9378b\nTree 15,Leaf 768 (idx 16128) fa4de0206b9aab4191aebecd3298617a5bb9378b\n\nCollisions relative to Tree 0 Leaf 0 (idx 0):\n  Tree 0, Leaf 256 (idx 256)   -> SK Collision: YES | Leaf Hash Collision: YES\n  Tree 0, Leaf 512 (idx 512)   -> SK Collision: YES | Leaf Hash Collision: YES\n  Tree 1, Leaf 0   (idx 1024)  -> SK Collision: YES | Leaf Hash Collision: YES\n  Tree 2, Leaf 0   (idx 2048)  -> SK Collision: YES | Leaf Hash Collision: YES\n  Tree 15,Leaf 768 (idx 16128) -> SK Collision: YES | Leaf Hash Collision: YES\n\n====================================================================\n7. Proposed Remediation\n====================================================================\n\nIn sm3_offsets.h:\nChange SPX_OFFSET_CHAIN_ADDR from 27 to 24 (start of 4-byte Word 6).\n\nIn address.c:\nChange set_chain_addr() to write a full 32-bit big-endian integer:\nvoid set_chain_addr(uint32_t addr[8], uint32_t chain)\n{\n    u32_to_bytes(&((unsigned char *)addr)[SPX_OFFSET_CHAIN_ADDR], chain);\n}\n\nA standalone reproducer (verify_standalone.c), an in-tree verification script (verify_in_tree.c), and the patch (forc_address_truncation_fix.patch) are attached.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/DZLVOKPTO2KZTN76AGZ2SST2T5ZCIUB7/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^{\\alpha}$", "algorithm": "CEDRUS-α", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ/"}, {"msg_id": "3PASZVC2PGWVNXMF7K5T7S2KZ2RZRZLX", "thread_id": "QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ", "position": 3, "level": 0, "author": "shiyuan", "sender_time": "2026-09-22 19:06", "pub_utc": "2026-09-22 11:06 UTC", "body": "CEDRUS-alpha: Discrepancy between Specification and Implementation in Hash Functions\n\nTarget Algorithm: CEDRUS-alpha (sign-04)\nTarget Implementations: Reference and Optimized implementations across all 8 parameter sets (160s/f, 256s/f, 384s/f, 512s/f)\nClassification: Specification-Implementation Inconsistency\nRelevant Documents & Files:\n- Specification: \"Algorithm specifications.pdf\" (Section 1.11, p. 35; Table 1.2, p. 38; Table 1.3, p. 39; Algorithms 5, 6, 13)\n- Source Code: thash_sm3_simple.c (Lines 12-21), hash_sm3.c (Lines 12-17, 22-30)\n\n======================================================================\n1. Executive Summary\n======================================================================\nWhile reviewing the CEDRUS-alpha submission, we noticed an inconsistency between the design specification (\"Algorithm specifications.pdf\") and the C reference implementations regarding the instantiation of the core hash functions (F, H, T_l, and PRF).\n\nIn Section 1.11 (p. 35) and Table 1.2 (p. 38), the specification outlines a dedicated optimization for the Merkle-Damgard mode of SM3:\n1. Padding PK.seed with zeros to 64 bytes (toByte(0, 64 - n)) to facilitate precomputing and caching the intermediate hash state after the first block.\n2. Compressing the 32-byte address into a 22-byte structure ADRS^c so that F evaluates within one single additional SM3 compression block.\n3. Supplying PK.seed as the leading argument to PRF(PK.seed, SK.seed, ADRS).\n\nIn the submitted C codebase, however:\n- PK.seed is not padded to 64 bytes in thash (SPX_N bytes are copied directly).\n- Full 32-byte uncompressed addresses are passed to SM3 without the ADRS^c compression.\n- PK.seed is omitted in prf_addr() and not included in the hash input.\n\nAs a result, an independent implementation developed strictly from the specification document will produce different hash inputs and digests from the official reference code, leading to interoperability differences.\n\n======================================================================\n2. Detailed Comparison (Specification vs Code)\n======================================================================\n\n1. PK.seed 64-Byte Padding\n- Specification (Section 1.11, p. 35, Paragraph 2 & Table 1.2, p. 38):\n  \"To increase their efficiency, we pad the PK.seed input to one message block (i.e., 64 bytes) when the functions are instantiated with SM3 (see Table 1.2)...\"\n  Formula: F(PK.seed, ADRS, M1) = Trunc_n(SM3(PK.seed || toByte(0, 64 - n) || ADRS^c || M1, 8n))\n- Code (thash_sm3_simple.c, line 17):\n  memcpy(buf, pub_seed, SPX_N);\n  Only SPX_N bytes (20 bytes for 160, 32 bytes for 256) are copied directly without zero padding.\n\n2. 22-Byte Compressed Address ADRS^c\n- Specification (Section 1.11, p. 35, Paragraph 2):\n  \"Finally, ADRS^c in Table 1.2 represent the compression address of ADRS, where ADRS^c.layerAddr is the lowest byte of ADRS.layerAddr and ADRS^c.addrType is lowest byte of ADRS.addrType, ADRS^c.treeAddr is the lowest 8 bytes of ADRS.treeAddr. Therefore, the size of ADRS^c is 22-byte, reducing the number of calls SM3.\"\n- Code (thash_sm3_simple.c, line 18):\n  memcpy(buf + SPX_N, addr, SPX_ADDR_BYTES);\n  Full 32 bytes (SPX_ADDR_BYTES = 32) are copied. ADRS^c compression is not present in the codebase.\n\n3. PRF Input Signature and Key Material\n- Specification (Algorithms 5, 6, 13; Tables 1.2 & 1.3):\n  sk <- PRF(PK.seed, SK.seed, skADRS)\n  Table 1.2: PRF(PK.seed, SK.seed, ADRS) = Trunc_n(SM3(PK.seed || toByte(0, 64-n) || ADRS^c || SK.seed, 8n))\n  Table 1.3: PRF(PK.seed, SK.seed, ADRS) = XOF_SM3(PK.seed || ADRS || SK.seed, 8n)\n  PK.seed is specified as the first argument across all parameter sets.\n- Code (hash_sm3.c, lines 22-30):\n  void prf_addr(unsigned char *out, const unsigned char *key, const uint32_t addr[8]) {\n      memcpy(buf, key, SPX_N);                   // key is sk_seed\n      memcpy(buf + SPX_N, addr, SPX_ADDR_BYTES); // full 32 bytes\n  }\n  PK.seed is neither passed to prf_addr() nor hashed. Lines 12-17 explicitly suppress pub_seed:\n  void initialize_hash_function(...) { (void)pub_seed; (void)sk_seed; }\n\n======================================================================\n3. Buffer Layout Comparison (CEDRUSALPHA-160s, n = 20)\n======================================================================\n\nFunction F / thash:\n- Spec Input Buffer (106 bytes): [PK.seed (20B) || 0x00*44 (44B) || ADRS^c (22B) || M1 (20B)]\n- Code Input Buffer ( 72 bytes): [pub_seed (20B) || addr (32B) || in (20B)]\n\nFunction PRF / prf_addr:\n- Spec Input Buffer (106 bytes): [PK.seed (20B) || 0x00*44 (44B) || ADRS^c (22B) || SK.seed (20B)]\n- Code Input Buffer ( 52 bytes): [sk_seed (20B) || addr (32B)]  (PK.seed omitted)\n\n======================================================================\n4. Practical Impact\n======================================================================\n1. Interoperability:\n   Third-party software or hardware implementations following the specification document will compute different hash values and public keys, preventing cross-verification with the reference implementation.\n\n2. Performance Realization:\n   The structural optimization described in Section 1.11 (saving SM3 block calls by caching the first block of padded PK.seed and compressing ADRS to 22 bytes) is currently not utilized in the C reference code.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3PASZVC2PGWVNXMF7K5T7S2KZ2RZRZLX/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CEDRUS$^{\\alpha}$", "algorithm": "CEDRUS-α", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/QTJJOIBU56LBGJ2JRXKKH5OX3ZIW3OQJ/"}, {"msg_id": "3ZXFAPIPIO3CVJHCQJ5AQ44UNTBIY4OP", "thread_id": "3ZXFAPIPIO3CVJHCQJ5AQ44UNTBIY4OP", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:25", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3ZXFAPIPIO3CVJHCQJ5AQ44UNTBIY4OP/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: COMPASS-KEM", "algorithm": "COMPASS-KEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3ZXFAPIPIO3CVJHCQJ5AQ44UNTBIY4OP/"}, {"msg_id": "FACKHS3U2WG66C763VRSC44CEH7NIYHY", "thread_id": "FACKHS3U2WG66C763VRSC44CEH7NIYHY", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:48", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/FACKHS3U2WG66C763VRSC44CEH7NIYHY/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: COMPASS-SIG", "algorithm": "COMPASS-SIG", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/FACKHS3U2WG66C763VRSC44CEH7NIYHY/"}, {"msg_id": "6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS", "thread_id": "6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:47", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CS", "algorithm": "CS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS/"}, {"msg_id": "NTO6Y2O356CDK6LTC4MA5AQEG6OLINCG", "thread_id": "6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS", "position": 1, "level": 0, "author": "haojiang", "sender_time": "2026-09-22 02:29", "pub_utc": "2026-09-22 02:29 UTC", "body": "The verifier discards challenge signs, enabling new-message forgery against all three parameter sets. This scheme samples τ signed nonzero challenge coefficients (§2.4, Algorithm 1, p. 9), and counts their signs toward challenge entropy (§3.5, Table 3, p. 23). In verification, multiplication by q modulo 2q and the LSB check both treat +1 and −1 identically (§3.3, Algorithm 12, p. 20). The effective challenge space therefore consists of only C(n,τ) supports, rather than 2^τC(n,τ) signed challenges.\n\nAn adversary fixes a support, computes the verifier commitment induced by zero responses on that support, and tries fresh messages until the hash-derived challenge has that support. The adversary then submits the resulting hash with zero responses. Verification reconstructs an exactly zero response, and both the hash and norm checks pass, regardless of the public key (§2.5, Definition 2.2, p. 9; §3.3, Algorithm 12, p. 20). A trial succeeds with probability 1/C(n,τ), so the expected classical work is C(n,τ) hash trials. No signing query is needed (UF-NMA forgery).\n\n| Parameter set | n, τ (§3.5, Table 3, p. 23) | Expected classical queries, calculated here | Shortfall from label |\n|---|---:|---:|---:|\n| CS-128 | 256, 23 | **2^108.08** | 19.92 bits |\n| CS-256 | 512, 44 | **2^212.46** | 43.54 bits |\n| CS-512 | 512, 118 | **2^394.18** | 117.82 bits |\n\nThe query exponents are log₂ C(n,τ). Lemma 4.1 identifies the same support, different sign event but treats it as asymptotically negligible (§4.2, p. 25). Applied to this forgery, Lemma 4.2's extraction produces y=z=0 (§4.2, p. 27), which fails Definition 5's nonzero BSTMSIS witness requirement (§4.1, p. 24). Repair requires verification to distinguish the signs, or an unsigned challenge with new parameters. Either change requires renewed correctness and security analyses.\n\nThis finding was identified by GPT 5.6 Sol and verified by us.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/NTO6Y2O356CDK6LTC4MA5AQEG6OLINCG/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CS", "algorithm": "CS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS/"}, {"msg_id": "QLP6C4KVRQYH6DJAORBRYIOY6MXSELSP", "thread_id": "6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS", "position": 2, "level": 1, "author": "kriskwiatkowski1", "sender_time": "2026-09-22 06:31", "pub_utc": "2026-09-22 06:31 UTC", "body": "Summary\n=======\n\nCS_Verify reads the challenge polynomial c only through c mod 2, so the tau\nsign bits CS gains by drawing c from {0,+-1}^n rather than {0,1}^n -- its\nsection 1.1 \"larger challenge-polynomial space\" -- are invisible to the\nverifier.  The challenge space a forger must hit is the set of supports,\nC(n,tau), and not the C(n,tau)*2^tau whose logarithm is the \"Entropy of c\"\nrow of Table 3:\n\nSummary\n=======\n\nCS_Verify reads the challenge polynomial c only through c mod 2, so the tau\nsign bits CS gains by drawing c from {0,+-1}^n rather than {0,1}^n -- its\nsection 1.1 \"larger challenge-polynomial space\" -- are invisible to the\nverifier.  The challenge space a forger must hit is the set of supports,\nC(n,tau), and not the C(n,tau)*2^tau whose logarithm is the \"Entropy of c\"\nrow of Table 3:\n\n                       Table 3 claims   effective (= log2 C(n,tau))\n        CS-128           131.08            108.08\n        CS-256           256.46            212.46\n        CS-512           512.18            394.18\n\nThat alone gives a forgery.  This comment is about the fact that it gives the\nstrong kind: the hint is unbounded, and the bound on the reconstructed z2'\ncontains the term alpha/4 by construction, which leaves enough free choice\ninside a single signature to do the grinding there rather than over messages.\nThe forged message is then chosen in advance -- no secret key, no signing\nquery, no lattice reduction -- at expected cost C(n,tau) hash calls, halved\nin the exponent by Grover:\n\n        CS-128   2^108.08 classical   2^54.04  quantum   [claimed 128]\n        CS-256   2^212.46 classical   2^106.23 quantum   [claimed 256]\n        CS-512   2^394.18 classical   2^197.09 quantum   [claimed 512]\n\n1.  Verification only sees c mod 2\n==================================\n\nIn Algorithm 12, c' reaches the accept decision through exactly two\nexpressions:\n\n  - line 8:   v := A0*z0' + A1*z1' - q*c'*j  mod 2q\n  - line 10:  wbar' := LSB(z0' - c')\n\nIn line 8, q*c'_m mod 2q = q*(c'_m mod 2), because -q = q (mod 2q) -- the\ncongruence the bimodal design is built on, so that term can never depend on\nmore than the parity of c'.  Line 10 is a function of c' mod 2 as well.  The\nremaining lines use only v, h, z0', z1' and ctilde.  Verification factors\nthrough the support of c'.\n\nThis is why DDLL/BLISS and HAETAE draw challenges from {0,1}: under the\nmodulus 2q, sign information on c is free to an adversary.  Section 4.1 comes\nclose to the same statement -- the MSIS-to-BSTMSIS reduction bounds\nPr[c' = c mod 2] by 2^{-lambda+tau} and calls it negligible -- but that\nquantity is not a proof artefact, it is the cost of the forgery below.\n\n2.  Grinding messages gives only an existential forgery\n=======================================================\n\nFix a support S, set z0 = z1 = 0 and the hint to zero.  Then v = q*chi_S*j,\nindependent of the public key, the reconstructed z2' is exactly zero, and\nevery norm check in Algorithm 12 passes.  What remains is to find a message\nwhose challenge has support S: C(n,tau) hashes.\n\nThis already defeats the claimed level, but the adversary does not choose the\nmessage -- it is whichever trial string hashed into S.  Against a real target\none would need C(n,tau) semantically acceptable variants of a document.\n\n3.  Grinding the hint gives a universal forgery\n===============================================\n\nThe message can instead be fixed in advance, because the freedom needed for\nthe grind is already present inside one signature.\n\nThe hint is neither bounded nor weight-checked, so w1 = (HighBits_h(v) + h)\nmod p is entirely attacker-chosen, and the only tie between w1 and v is\n\n    ||z2'||_inf <= B2' = B2 - tau + alpha/4 + 1 + tau*2^(beta-1),\n    z2' = (alpha*w1 + LSB(z0-c)*j - v)/2.\n\nAttainable values of alpha*w1 are alpha apart in Z_2q, so this is satisfiable\nfor every v once alpha <= 4*B2' -- and B2' contains alpha/4 by construction,\nbeing exactly the slack correctness needs to absorb LowBits_h(w).  The\ncondition therefore holds at any parameter choice, with margins 5.6x, 3.6x\nand 12.5x.  The k-block of the verification equation constrains nothing.\n\nSo for a target message M chosen by the adversary, and any support S:\n\n  1. Put z0 = z1 = 0, wbar' = chi_S, v = q*chi_S*j mod 2q.\n  2. For each of the k*n coefficients, list the w1 in [0,p) that keep z2'\n     inside B2' -- with z = 0 there are 5, 3 and 13 of them respectively.\n  3. Draw w1 from that product set, set h = w1 - HighBits_h(v) mod+- p, and\n     compute ctilde = H(mu, w1, wbar'), mu = H(H(pk) || M).\n  4. Repeat 3 until SampleInBall(ctilde, tau) has support S.  Emit\n     sigma = (rANS(0), rANS(0), h, ctilde).\n\nEvery draw is a complete norm-legal transcript; the loop only changes which\none is presented.  At CS-128 the pool is 2^1783 hints, 2^406 of them also\ncompressible inside the fixed hint area, against 2^108.08 trials needed --\nand the forged h never exceeds 2 in absolute value, inside the rANS alphabet\nof +-3, so it encodes.\n\nThree things follow from grinding here rather than over messages.  The forged\nmessage is arbitrary, so the attack applies to a specific document.  The\nwitness is nonzero, so it is a genuine BSTMSIS solution at the submitted\nparameters: the assumption does not hold at the claimed level.  And the loop\nis a preimage-style search over a Boolean predicate, so Grover applies.\n\nEach w1 commits to one support and cannot be reused for another, so C(n,tau)\nappears tight.  CS-512 is within a factor of about 1.3 of having the two\nadmissible windows overlap, at which point no search is needed at all.\n\n4.  Verification\n================\n\nI implemented Algorithms 1-12 and confirmed honest signatures verify.  With H\nprogrammed as a random oracle at the single point the attack queries, the\nforgery is accepted at all three parameter sets.  Run to completion against\nthe real hash on scaled-down sets (n and tau reduced, all else as CS-128), 12\nforgeries were produced and accepted, with trial counts matching a geometric\ndistribution of mean C(n,tau) and inconsistent with C(n,tau)*2^tau.  Against\nthe submitted reference implementation compiled from its own sources, an\ninstance with tau lowered to 3 -- only the support size scaled, the cost\nbeing exactly C(n,tau) -- has its own sig_verify() accept a signature on a\nmessage that was never signed, in about two seconds.\n\nThe implementation of the forgery can be found here:\n\nhttps://github.com/kriskwiatkowski/ngcc-harness/blob/main/sign-07/forgery.c\nshow more\nshow less", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/QLP6C4KVRQYH6DJAORBRYIOY6MXSELSP/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CS", "algorithm": "CS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS/"}, {"msg_id": "PNQJ4PBNVDPNY624PDPCOO7ZL2GXIP6H", "thread_id": "6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS", "position": 3, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-24 07:42", "pub_utc": "2026-09-24 07:42 UTC", "body": "Hi, we found a leakage issue in the CS signature scheme and verified it against the submitted CS-128 reference implementation. The issue appears in the full compressed scheme, where public-key compression leaves a term involving the secret low bits b_0 coupled with the hidden signing randomness c_r.\n\nAt a high level, the attack proceeds as follows:\n\n1. From the public values (z_0, c), estimate the posterior expectation of the hidden bimodal aggregate c_r.\n2. Use the public verifier reconstruction of z_2' from Algorithm 12 to recover b_0 from the correlation between z_2' and this estimate of c_r.\n3. Use the public cross moment between z_2' and z_1 to recover s_1.\n\nIn the simplified scheme, the key equation is\n\n    A s = q j  (mod 2q).\n\nIn the full compressed scheme, with b = 2^beta b_1 + b_0, this becomes\n\n    A s = q j + 2 b_0  (mod 2q).\n\nThe signing algorithm uses iterative bimodal rejection sampling and returns\n\n    z = y + c_r s,\n\nwhere\n\n    c_r = sum_i (-1)^(bit_i) c_i'.\n\nAlthough the accepted z may have the intended marginal distribution, the hidden bimodal signs are not independent of the accepted public value z_0. In the compressed full signature, the verifier reconstructs a public value satisfying\n\n    z_2' = z_2 - c_r b_0 + (-LowBits_h(w, alpha) + LSB(w)) / 2  (mod ±q).\n\nThus, the public transcript contains a hidden term involving the secret low bits b_0. Since c_r is statistically correlated with the accepted public z_0, an attacker can estimate E[c_r | z_0, c] and regress z_2' against this public estimate to recover b_0.\n\nA second public cross moment,\n\n    E[ hat(z_2') * conjugate(hat(z_1)) ],\n\nhas the approximate rank-one form\n\n    E[ hat(z_2') * conjugate(hat(z_1)) ] ≈ -tau * hat(b_0) * conjugate(hat(s_1)),\n\nwhere tau is the public challenge weight. For CS-128, tau = 23, so the scale of the recovered s_1 estimate is publicly determined.\n\nWe compiled the submitted CS-128 reference implementation and generated signatures under a locally generated test key. Using 2^27 signatures, generated in approximately 3.25 hours on 16 cores, our streaming experiment used only public transcript data for the estimators and obtained the following results:\n\n- b_0: Direct rounding produced 3 coefficient errors out of 768. With one scalar normalization of the regression estimate, all 768 coefficients were recovered correctly.\n- s_1: Direct rounding produced 197 coefficient errors because the raw estimator is scaled by approximately tau. Dividing by the public value tau = 23 produced correct recovery of all 768 coefficients.\n\nOnce s_1 and b_0 are known, the remaining short vector s_2 is determined from the public relation\n\n    b = 2^beta b_1 + b_0 = A' s_1 + s_2,\n\nusing the centered representative.\n\nThis gives a concrete secret-key recovery path for the tested CS-128 parameter set.\n\nThis analysis was prepared with AI assistance. The issue was initially identified with assistance from Doubao, and the experimental implementation was developed with assistance from GPT.\n\nBest,\nYijian (on behalf of Xianhui Lu)", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/PNQJ4PBNVDPNY624PDPCOO7ZL2GXIP6H/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: CS", "algorithm": "CS", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/6Y7RS3WZHP5HOVGHOSW64T4DZNPSAXDS/"}, {"msg_id": "XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI", "thread_id": "XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:25", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CTL Algorithm", "algorithm": "CTL", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI/"}, {"msg_id": "H47RU2HKEEAZQOJNKMUFWNEJEHHSLPQQ", "thread_id": "XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI", "position": 1, "level": 0, "author": "Bo_Peng", "sender_time": "2026-09-23 08:40", "pub_utc": "2026-09-23 08:40 UTC", "body": "We acknowledge the issues identified in the report.\n\nRegarding kem-12-1, we agree with the observation that the 32-byte seed currently used for deterministic key generation limits the set of generated public keys to at most (2^{256}), and therefore does not provide the intended 512-bit classical security level for CTL-512. This is an issue in the current seed-based key-generation design and short private-key format, and we acknowledge that the entropy budget was not handled consistently with the claimed security level.\n\nWe are revising CTL-512 accordingly. In particular, we intend to use a 64-byte key-generation seed together with an expansion mechanism that preserves the required security level, and to update the corresponding private-key encoding and deterministic regeneration procedures. We will also verify the complete entropy path, rather than treating the issue as only a change of the seed-buffer length.\n\nThe issue identified here concerns the entropy available to the key-generation procedure and the resulting size of the reachable key space, rather than the underlying NTRU/lattice hardness assumption itself. Nevertheless, we agree that this limitation must be corrected in order for CTL-512 to support its intended security claim.\n\nRegarding kem-12-2, we also acknowledge the inconsistency involving the 48-byte shared secret and (c_2) in the current implementation, in particular the discrepancy with the 64-byte (c_2) specified for CTL-512. We are reviewing the relevant length handling and key-derivation procedures and will revise the implementation and specification as necessary to make them fully consistent.\n\nAfter completing these revisions, we will update the corresponding documentation and test vectors and perform further validation before providing the revised version.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/H47RU2HKEEAZQOJNKMUFWNEJEHHSLPQQ/", "kind": "response", "kind_rule": "config.responders 指定", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CTL Algorithm", "algorithm": "CTL", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/XYXBZWLCJXTUZTNUFJCPYLEST5CC56AI/"}, {"msg_id": "3OMMI24JGKESHSRUVA5NJANKRHTQY7RM", "thread_id": "3OMMI24JGKESHSRUVA5NJANKRHTQY7RM", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:26", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3OMMI24JGKESHSRUVA5NJANKRHTQY7RM/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CheetahKEM", "algorithm": "CheetahKEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3OMMI24JGKESHSRUVA5NJANKRHTQY7RM/"}, {"msg_id": "IKMFXEEH5K427JC75E7364RNOJEO5OK7", "thread_id": "3OMMI24JGKESHSRUVA5NJANKRHTQY7RM", "position": 1, "level": 0, "author": "XuHaomeng", "sender_time": "2026-09-22 01:23", "pub_utc": "2026-09-22 01:23 UTC", "body": "CheetahKEM Subfield Attack on Degree-128 Quotient-Ring: Distinguishing and Recovery of the Remaining Degree-512 Secret\n\nCheetahKEM’s security evaluation needs to distinguish between “sample distinguishing” and “full secret-key recovery.” The former only requires exploiting the degree-128 quotient ring; the latter, after recovering that component, must additionally solve for the remaining degree-512 component. Neither problem can be adequately evaluated using only a \\(640k\\)-dimensional estimate that ignores the underlying algebraic structure.\n\nThe scheme uses modulus \\(q = 7681\\), and its modulus polynomial admits the following factorization over the integers:\n\n$$\nX^{640}+1\n=\n(X^{128}+1)\n\\times\n(X^{512}-X^{384}+X^{256}-X^{128}+1).\n$$\n\nLet the two factors be denoted by \\(g\\) and \\(h\\), of degrees 128 and 512, respectively. Since they are coprime modulo \\(q\\), the original ring decomposes into these two components via the Chinese Remainder Theorem.\n\n### (1) A distinguishing attack only needs to target the degree-128 quotient ring\n\nStarting from the public relation\n\n$$\nb = As + e,\n$$\n\nwe can further reduce the polynomials modulo \\(g\\), obtaining\n\n$$\nb' = A's' + e'.\n$$\n\nThis projection can be computed directly from the public data. Specifically, split the 640 coefficients of each polynomial into five blocks and combine them with alternating signs, “plus, minus, plus, minus, plus”:\n\n$$\na'[j]\n=\na[j]\n-\na[j+128]\n+\na[j+256]\n-\na[j+384]\n+\na[j+512].\n$$\n\nThe original secret and error coefficients follow a \\(\\mathrm{CBD}(\\eta)\\) distribution. Combining five independent coefficients in this way yields exactly a \\(\\mathrm{CBD}(5\\eta)\\) distribution. Thus, the number of secret coefficients is reduced from \\(640k\\) to \\(128k\\), while the error standard deviation increases by only a factor of \\(\\sqrt{5}\\).\n\nFor the standard uncompressed decisional problem, uniformly random samples remain uniform under this projection. Therefore, if an attacker can distinguish real samples from random samples in the degree-128 quotient ring, the same distinguishing advantage immediately applies to the original problem. There is no need to recover or solve the other degree-512 component.\n\nUsing the lattice estimator under its approximate noise model, the estimated costs of attacks on the quotient-ring component, compared with the original estimates in the specification, are as follows:\n\n| Parameter  | Quotient-Ring Degree | uSVP Estimate | dual-hybrid Estimate | Original Specification Estimate |\n| ---------- | -------------------: | ------------: | -------------------: | ------------------------------: |\n| Cheetah128 |                  128 |  \\(2^{27.7}\\) |         \\(2^{32.6}\\) |                     \\(2^{159}\\) |\n| Cheetah256 |                  256 |  \\(2^{67.7}\\) |         \\(2^{71.0}\\) |                     \\(2^{307}\\) |\n| Cheetah384 |                  384 |  \\(2^{99.3}\\) |        \\(2^{103.4}\\) |                     \\(2^{426}\\) |\n| Cheetah512 |                  512 | \\(2^{133.4}\\) |        \\(2^{138.4}\\) |                     \\(2^{541}\\) |\n\nThe security implication is clear: decisional security is bounded by the publicly extractable weak component. Even if the other component remains difficult to solve, that does not prevent an attacker from distinguishing the full samples by exploiting only the degree-128 component. An evaluation based solely on the \\(640k\\) secret coefficients therefore misses this attack path.\n\n### (2) Full secret-key recovery leaves a degree-512 residual problem\n\nSecret-key recovery requires more information than a distinguishing attack. Under the component-wise recovery approach, the first stage recovers\n\n$$\ns \\bmod g.\n$$\n\nThe central remaining task for full key recovery is then to solve the noisy problem over the degree-512 ring, namely to recover\n\n$$\ns \\bmod h,\n$$\n\nand subsequently combine the two components using the Chinese Remainder Theorem.\n\nFor this two-stage recovery strategy, the total cost should therefore be evaluated as\n\n$$\n\\text{Full recovery cost}\n=\n\\text{degree-128 component recovery cost}\n+\n\\text{degree-512 residual problem cost}\n+\n\\text{reconstruction overhead}.\n$$\n\nThe reconstruction step consists only of polynomial operations; the main quantity that needs to be evaluated is the cost of solving the residual problem. However, solving the problem over the degree-512 ring is significantly cheaper than solving it over the original degree-640 ring, so the original parameters would no longer meet their claimed security requirements.\n\nTechniques for evaluating the structured-lattice security of odd-degree cyclotomic fields are still at an early stage of development (\nhttps://eprint.iacr.org/2025/2195\n). For this reason, we have not simply applied a conventional unstructured lattice estimator to derive a security bound for the residual component. Nevertheless, there is evidence that the structure of this fifth cyclotomic ring may lead to a further reduction in security strength, which deserves careful attention.\n\nAccordingly, the security analysis of CheetahKEM should clearly distinguish between two conclusions: a distinguishing attack can be carried out using only the weak degree-128 component, whereas full secret-key recovery additionally requires solving the remaining degree-512 component. The original \\(640k\\)-dimensional security table, which ignores this factorization, cannot substitute for either of these two analyses.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/IKMFXEEH5K427JC75E7364RNOJEO5OK7/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CheetahKEM", "algorithm": "CheetahKEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3OMMI24JGKESHSRUVA5NJANKRHTQY7RM/"}, {"msg_id": "5TLZROCK6ZQKG6HTV3PNNESJKICDDKGE", "thread_id": "3OMMI24JGKESHSRUVA5NJANKRHTQY7RM", "position": 2, "level": 0, "author": "Yijian_Liu", "sender_time": "2026-09-24 11:07", "pub_utc": "2026-09-24 11:07 UTC", "body": "Hi, I believe the decryption failure rate (DFR) analysis reported in the submission may omit the contribution from public-key compression.\n\nIn particular, the “Correctness” derivation in Section 2.2 of the Cheetah algorithm specification appears not to account for the effect of public-key compression. Algorithm 15 compresses the public key, and Algorithm 16 decompresses it before it is used in encryption. The resulting decryption noise should therefore include an additional term arising from public-key compression.\n\nAs a numerical cross-check, I performed a local calculation using the finite-distribution convolution approach employed by the Kyber DFR script:\nhttps://github.com/pq-crystals/security-estimates/blob/master/Kyber_failure....\n. The results I obtain are:\n\nParameter set   Submission log2(DFR)   Estimated log2(DFR)   Gap\n-------------   --------------------   -------------------   --------\nCheetah128                  -129              -77.8499        51.1501\nCheetah256                  -176              -51.5415       124.4585\nCheetah384                  -189             -115.0663        73.9337\nCheetah512                  -243             -198.9608        44.0392\n\nThese estimates are based on the stated noise model, with the public-key compression contribution included. The resulting DFRs are substantially higher than those reported in the submission, and the parameter sets would need to be reconsidered to meet the claimed DFR targets.\n\nThis analysis was prepared with AI assistance.\n\nBest,\nYijian", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/5TLZROCK6ZQKG6HTV3PNNESJKICDDKGE/", "kind": "comment", "kind_rule": "默认", "first_seen": "2026-09-25 05:49:30", "title": "Round1: Public Comment: CheetahKEM", "algorithm": "CheetahKEM", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/3OMMI24JGKESHSRUVA5NJANKRHTQY7RM/"}, {"msg_id": "UBKP5VIJTAKEWQGN7R6C2UZ7OGW2XYRB", "thread_id": "UBKP5VIJTAKEWQGN7R6C2UZ7OGW2XYRB", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:48", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/UBKP5VIJTAKEWQGN7R6C2UZ7OGW2XYRB/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: Chinith", "algorithm": "Chinith", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/UBKP5VIJTAKEWQGN7R6C2UZ7OGW2XYRB/"}, {"msg_id": "MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX", "thread_id": "MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:14", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CreTAKE", "algorithm": "CreTAKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX/"}, {"msg_id": "VA3RWZW4X6UM4AWNSRJLETVHPYFM7ML5", "thread_id": "MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX", "position": 1, "level": 0, "author": "JingnanHe", "sender_time": "2026-09-22 06:27", "pub_utc": "2026-09-22 06:27 UTC", "body": "Dear all,\n\nWe thank Markku-Juhani O. Saarinen for identifying and reporting the implementation issue described in the external report “CreTAKE (kex-03), kex-03-1: Bits-versus-bytes error reduces the ephemeral secret to 64 bits.”\n\nWe confirm that some hash/XOF calls in the implementation pass byte counts where the corresponding interfaces expect bit counts. This was an implementation oversight. Correcting these input-length arguments restores processing of the complete inputs as intended by the specification, without requiring any change to the CreTAKE protocol design or its parameter sets.\n\nWe will incorporate these corrections, together with regenerated test vectors, in the next permitted implementation update.\n\nWe appreciate the helpful feedback and welcome further comments on our submission.\n\nBest regards,\nThe CreTAKE team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/VA3RWZW4X6UM4AWNSRJLETVHPYFM7ML5/", "kind": "response", "kind_rule": "落款为算法团队", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CreTAKE", "algorithm": "CreTAKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX/"}, {"msg_id": "YO6ZAQNLNNE32OI3GX2T5JXFY7Q2MJD7", "thread_id": "MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX", "position": 2, "level": 0, "author": "JingnanHe", "sender_time": "2026-09-23 09:18", "pub_utc": "2026-09-23 09:18 UTC", "body": "Dear all,\n\nDuring our ongoing review, we identified a typographical omission in the final key derivation for CreTAKE-K2S, CreTAKE-S2K, and CreTAKE-S2S. We will include the signatures in the final hash input to bind the derived key to the complete protocol transcript, consistently with the session-matching definition used in our security analysis.\n\nThe corrected key derivations are:\nCreTAKE-K2S (Fig. 1 in the specification):\nK=H(pk_i,pk_j,\\widetilde{pk},\\widetilde{c},c_i,\\sigma,k_i,\\widetilde{k}).\n\nCreTAKE-S2K (Fig. 2 in the specification):\nK=H(pk_i,pk_j,\\widetilde{pk},\\widetilde{c},c_j,\\sigma,k_j,\\widetilde{k}).\n\nCreTAKE-S2S (Fig. 4 in the specification):\nK=H(pk_i,pk_j,\\widetilde{pk},\\widetilde{c},\\sigma_i,\\sigma_j,\\widetilde{k}),\nwhere (\\sigma_i) and (\\sigma_j) are the initiator’s and responder’s signatures, respectively.\n\nThis correction requires no additional messages or transmitted data. We will incorporate it into the specification and implementation.\n\nBest regards,\nThe CreTAKE team", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/YO6ZAQNLNNE32OI3GX2T5JXFY7Q2MJD7/", "kind": "response", "kind_rule": "该账号此前已被判定为本算法回应方", "first_seen": "2026-09-24 01:41:54", "title": "Round1: Public Comment: CreTAKE", "algorithm": "CreTAKE", "thread_url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/thread/MIGUBFHREZ7R2KKULIIKQEU23BVFG3BX/"}, {"msg_id": "ZTVJHAUOCD3ZU4J72AMG3EDEZUDRR52Q", "thread_id": "ZTVJHAUOCD3ZU4J72AMG3EDEZUDRR52Q", "position": 0, "level": 0, "author": "PKCcomment", "sender_time": "2026-09-18 07:47", "pub_utc": null, "body": "All interested parities are welcome to make public comments here.", "url": "https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/ZTVJHAUOCD3ZU4J72AMG3EDEZUDRR52Q/", "kind": "call", "kind_rule": "组织方开帖", "first_seen": "2026-0
